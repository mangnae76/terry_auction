<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이턴 앱 · 마이턴</title>
<meta name="description" content="마이턴 모바일앱 — 경매의 처음부터 끝까지, 현장에서 마이턴 하나로. 한 건의 모든 기록을 한 곳에 남깁니다.">
<link rel="icon" href="/favicon.svg">
<!-- 글꼴 — 대문(intro.html)과 같은 주소 그대로. 대문에서 받아 둔 글꼴을 다시 써서 같은 글꼴로 바로 뜬다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* 마이턴 앱 소개 — 대문 「마이턴 앱 다운받기」가 새 창으로 여는 페이지. 웹 「스토어 › 모바일앱」과 같은 내용 · 모양이지만
   웹 메뉴 없이 따로 선다(로그인 전에도 메뉴가 드러나지 않게). 앱 캡처는 public/myturn-promo/shots */
:root{
  --bg:#f5f7fb;--surface:#ffffff;--line:#e5e9f2;--line-2:#d5dbe6;--card-line:#eef0f5;
  --text:#111827;--text-2:#4b5563;--muted:#6b7280;
  --navy:#213366;--blue:#2b6df3;--blue-soft:#eef3ff;--orange:#f4700a;
  --font:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:0;z-index:5;background:var(--navy)}
.top-in{display:flex;align-items:center;gap:12px;max-width:1240px;height:64px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top img{display:block;height:34px;width:auto}
/* 로고 — 웹 머리띠(.g-logo)와 같은 움직임: 올리면 살짝 기울며 커진다 */
.top-in > a img{transition:transform .4s cubic-bezier(.2,.9,.3,1.4)}
.top-in > a:hover img{transform:rotate(-4deg) scale(1.04)}
.brand-name{font-size:15px;font-weight:700;color:#50c3fc;padding-left:12px;border-left:1px solid rgba(255,255,255,.22);white-space:nowrap;letter-spacing:-.2px}   /* 이용가이드 머리띠 「이용가이드」와 같은 이름표 */
.top nav{margin-left:auto;display:flex;gap:8px}
.top nav a{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13.5px;font-weight:700;text-decoration:none}
.top nav a:hover{background:rgba(255,255,255,.1)}

.page{flex:1;width:100%;max-width:1240px;margin:0 auto;padding-block:28px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.board{padding:24px 28px 32px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 6px 20px rgba(17,24,39,.06)}

/* 아래는 웹 「스토어 › 모바일앱」(web/pages/selected.src.html .mb-*)과 같은 값 */
.mb-hero{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;align-items:start;max-width:1120px;margin:0 auto;padding:30px 12px 26px}
.mb-badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--orange);color:#fff;font-size:12px;font-weight:800}   /* 대문 앱 띠 「실전 경매 노트 앱」 알약과 같은 색 */
.mb-copy{padding-top:36px}   /* 머리 문구는 휴대폰 위쪽에 맞춰 올린다 */
.mb-copy h1{margin:16px 0 18px;font-size:clamp(26px,3.1vw,44px);line-height:1.18;font-weight:900;letter-spacing:-.02em;color:var(--navy)}   /* 대문 큰 제목(.ld-hero h1)과 같은 크기 */
.mb-copy h1 em{font-style:normal;color:var(--orange)}
.mb-copy p{margin:0;max-width:600px;font-size:16px;line-height:1.75;color:var(--text-2)}   /* 대문 소개 문단(.ld-lead)과 같은 크기 */
.mb-copy p b.or{color:var(--orange);font-weight:800}
.mb-stores{display:flex;gap:10px;margin-top:22px}
.mb-stores button{width:212px;height:50px;padding:0 12px;border:0;border-radius:10px;background:#1f2a44;color:#fff;font-size:15px;font-weight:800}
.mb-stores button:first-child{background:var(--blue)}
.mb-note{display:block;margin-top:10px;font-size:12px;color:var(--muted)}
.mb-stage{position:relative;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.mb-glow{position:absolute;left:50%;top:46%;width:400px;height:400px;max-width:100vw;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(43,109,243,.22),rgba(43,109,243,0) 70%);pointer-events:none}
.mb-phone{position:relative;width:290px;max-width:100%;padding:10px;border-radius:48px;background:linear-gradient(145deg,#2a3348,#0d1220 55%,#1b2335);box-shadow:0 0 0 1.5px #3a4560,0 30px 60px -18px rgba(15,23,42,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
.mb-btn{position:absolute;width:3px;border-radius:2px;background:#2a3348}
.mb-btn.l1{left:-3px;top:128px;height:32px}.mb-btn.l2{left:-3px;top:174px;height:58px}.mb-btn.r1{right:-3px;top:150px;height:78px}
.mb-screen{position:relative;padding-top:40px;border-radius:38px;overflow:hidden;background:#fff}
.mb-view{position:relative;aspect-ratio:780/1688}
.mb-island{position:absolute;left:50%;top:10px;width:86px;height:24px;transform:translateX(-50%);border-radius:12px;background:#0b0f18;z-index:3}
.mb-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:top;opacity:0;transform:translateY(14px) scale(1.02);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.mb-slide.on{opacity:1;transform:none}
.mb-cap{position:absolute;left:50%;bottom:14px;transform:translate(-50%,8px);padding:5px 12px;border-radius:999px;background:rgba(15,20,31,.72);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .5s ease .2s,transform .5s ease .2s;z-index:2}
.mb-cap.on{opacity:1;transform:translate(-50%,0)}
.mb-dots{display:flex;gap:7px}
.mb-dots button{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:var(--line-2);transition:width .3s,background .3s}
.mb-dots button.on{width:22px;background:var(--blue)}
/* 핵심 가치 4장 — 남색 카드에 주황 번호, 마지막(끝까지 관리)은 주황 카드(서비스 목표 장과 같은 모양) */
.mb-values-title { margin: 6px 0 12px; font-size: 16px; font-weight: 800; color: var(--text); }
.mb-values { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 26px; }
.mb-value { display: grid; align-content: start; gap: 6px; padding: 18px 20px; border-radius: 14px; background: #2b3a86; color: #fff; }
.mb-value.hot { background: #e06e2c; }
.mb-value em { font-style: normal; font-size: 15px; font-weight: 800; color: #f0a35e; font-variant-numeric: tabular-nums; }
.mb-value.hot em { color: #fff; }
.mb-value b { font-size: 17px; font-weight: 800; letter-spacing: -.3px; }
.mb-value span { font-size: 13px; line-height: 1.6; color: rgba(255, 255, 255, .82); }
/* 4장 — 머리 문구 칸 안, 소개 문단 바로 아래 2×2. 마지막(끝까지 관리)은 주황 */
.mb-copy .mb-values { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 22px 0 0; max-width: 600px; }
.mb-copy .mb-value { padding: 14px 16px; gap: 4px; border-radius: 12px; }
.mb-copy .mb-value em { font-size: 13px; }
.mb-copy .mb-value b { font-size: 15.5px; }
.mb-copy .mb-value span { font-size: 12.5px; line-height: 1.55; }
/* 흰 바탕 · 얇은 테두리 — 꽉 찬 색은 아래 스토어 단추만 남겨 단추가 묻히지 않게(2026-11-03) */
.mb-copy .mb-value { background: var(--surface); color: var(--navy); border: 1px solid #c9d2e6; }
.mb-copy .mb-value em { color: var(--orange); }
.mb-copy .mb-value span { color: var(--muted); }
.mb-copy .mb-value.hot { background: var(--surface); border-color: var(--orange); }
.mb-copy .mb-value.hot em, .mb-copy .mb-value.hot b { color: var(--orange); }
.mb-feats-title { margin: 30px 0 12px; font-size: 16px; font-weight: 800; color: var(--text); }
.mb-feats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mb-feat{padding:16px 18px;border:1px solid var(--card-line);border-radius:12px;background:var(--surface)}
.mb-feat h3{margin:0 0 8px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;color:var(--text)}
.mb-feat h3 svg{width:16px;height:16px;color:var(--blue)}
.mb-feat p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.mb-shots-title{margin:30px 0 14px;font-size:18px;font-weight:800;color:var(--text)}
.mb-apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding:0 20px}
.mb-app{margin:0;text-align:center}
.mb-app-frame{padding:8px;border-radius:30px;background:linear-gradient(145deg,#2a3348,#0d1220 55%,#1b2335);box-shadow:0 0 0 1px #3a4560,0 18px 36px -16px rgba(15,23,42,.5)}
.mb-app-frame img{display:block;width:100%;height:auto;border-radius:23px;background:#fff}
.mb-app figcaption{display:grid;gap:3px;margin-top:12px}
.mb-app figcaption b{font-size:15px;font-weight:800;color:var(--text)}
.mb-app figcaption small{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;top: 50%;z-index:20;transform: translate(-50%, -50%);padding:10px 16px;border-radius:999px;background:#111827;color:#fff;font-size:13.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
.foot{background:#252a39;color:#9aa1b2;font-size:11px;text-align:center;padding:16px}
@media (max-width:900px){.mb-apps{grid-template-columns:repeat(2,minmax(0,1fr));padding:0}.mb-hero{grid-template-columns:1fr;padding-inline:0}.mb-feats{grid-template-columns:repeat(2,minmax(0,1fr))}.board{padding:18px 16px 24px}}
@media (max-width:520px){.mb-feats,.mb-copy .mb-values{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.mb-stores{flex-wrap:wrap}.mb-stores button{width:100%}}   /* 좁은 휴대폰 — 단추를 한 줄에 하나씩 */
@media (max-width:900px){.mb-copy{padding-top:0}}
@media (prefers-reduced-motion:reduce){.mb-slide,.mb-cap{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a href="/intro.html" data-home aria-label="마이턴 처음으로"><img src="/logo-myturn.svg" alt="MYTURN"></a><span class="brand-name">마이턴앱</span>
    <nav><a href="#" id="guideSoon">이용가이드</a></nav>
  </div>
</header>
<main class="page">
  <section class="board">
    <div class="mb-hero">
      <div class="mb-copy">
        <span class="mb-badge">실전 경매 노트 앱</span>
        <h1>경매의 처음부터 끝까지,<br><em>현장에서 마이턴 하나로.</em></h1>
        <p>물건을 고르는 날부터 팔고 세금을 신고하는 날까지, 한 건의 모든 기록을 한 곳에 남깁니다.<br><b class="or">AI와 자동화</b>로 시간은 줄이고 데이터 기반으로 안전한 경매가 가능합니다.<br>3일 무료체험으로 먼저 써 보세요.</p>
        <div class="mb-values" id="values"></div>
        <div class="mb-stores"><button type="button" data-soon="Google Play">구글 플레이에서 다운로드</button><button type="button" data-soon="App Store">앱스토어에서 다운로드</button></div>
        <small class="mb-note">앱 출시 준비 중 · 지금은 웹에서 같은 기능을 쓸 수 있습니다</small>
      </div>
      <div class="mb-stage" id="stage"></div>
    </div>
    <h2 class="mb-feats-title">주요 기능</h2>
    <div class="mb-feats" id="feats"></div>
    <h2 class="mb-shots-title">실제 앱 화면</h2>
    <div class="mb-apps" id="apps"></div>
  </section>
</main>
<footer class="foot">COPYRIGHT ⓒMyTurn. ALL RIGHTS RESERVED.</footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
// 로고 — 로그인해 있으면 웹으로, 아니면 대문으로 바로 간다
try { if (localStorage.getItem('ta.web.in') === '1') document.querySelectorAll('[data-home]').forEach((a) => { a.href = '/web'; }); } catch (e) { /* 대문 그대로 */ }
(() => {
  const $ = (id) => document.getElementById(id);
  // 화면용으로 줄인 그림(600px WebP, myturn-promo/shots/web) — 원본 PNG 1.6MB → 0.4MB
  const SHOT = (f) => `/myturn-promo/shots/web/${f.replace(/\.png$/, '.webp')}`;
  // 웹 「스토어 › 모바일앱」과 같은 목록 — 고칠 때는 둘 다(web/pages/selected.src.html MOBILE_SLIDES · APP_SHOTS · MOBILE_FEATS)
  const SLIDES = [['53eb5d72dbedcf14716dc675474e1f72.png', '선정물건'], ['f538ce26245556b86f18e8e3bec69984.png', '물건정보'], ['74c80b031850a5a3008625a222d77b0e.png', '권리분석'],
    ['bid_stage.png', '수익분석'], ['route_multi.png', '임장경로'], ['fund_filled.png', '자금관리'], ['d38a0c761a697d916f83f5b34bb5434f.png', '알림설정']];
  const SHOTS = [['53eb5d72dbedcf14716dc675474e1f72.png', '선정물건', '단계 · 입찰가를 한눈에'], ['74c80b031850a5a3008625a222d77b0e.png', '권리분석', '확인할 권리를 체크로'],
    ['bid_stage.png', '수익분석', '돈이 나가는 순서까지'], ['route_multi.png', '임장경로', '방문 순서를 지도 위에']];
  const IC = {
    doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>',
    pin: '<path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    scale: '<path d="M12 3v18M5 7h14M7 7l-3 7a3 3 0 0 0 6 0L7 7zM17 7l-3 7a3 3 0 0 0 6 0l-3-7z"/>',
    chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
    pct: '<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
    check: '<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m9 11 3 3L22 4"/>',
    won: '<path d="M4 7l3 10 3-10 2 7 2-7 3 10 3-10M3 11h18"/>',
    apt: '<path d="M3 21h18M5 21V7l7-4 7 4v14M10 21v-5h4v5"/>',
  };
  // 핵심 가치 — 서비스 목표 장(소개서)과 같은 네 가지
  const VALUES = [['현장에서 바로', '조사한 내용을 현관 앞에서 펼쳐 보고 그 자리에서 고칩니다'], ['기록은 남는다', '적고 찍은 모든 것이 사건카드에 쌓여 잊히지 않습니다'],
    ['여러 건도 한 번에', '많은 물건을 동시에 조사하고 비교하고 동선까지 묶습니다'], ['끝까지 관리', '낙찰 뒤 잔금 · 명도 · 매도 · 세금까지 꾸준히 챙깁니다']];
  const FEATS = [
    ['doc', 'PDF 자동등록', '매각물건명세서 · 감정평가서 PDF를 올리면 사건번호 · 주소 · 감정가를 채웁니다'],
    ['pin', '임장경로', '선정물건을 지도에 올리고 방문 순서를 동선최적화로 정리합니다'],
    ['scale', '권리분석', '등기 · 임차인 권리관계를 물건마다 정리합니다'],
    ['chart', '손품조사', '수요분석 · 가격분석으로 현장 가기 전에 살펴봅니다'],
    ['pct', '수익분석', 'A~D안 입찰가를 비교하고 확정한 안으로 세후 수익을 계산합니다'],
    ['check', '낙찰이후', '진행절차 · 명도분석 · 세금분석을 낙찰 뒤 순서대로'],
    ['won', '자금관리', '자금입출금 · 필요경비 · 사업경비를 물건별로 기록합니다'],
    ['apt', '시장분석', '지역분석 · 랭킹분석 · 경매사례로 시장 흐름을 봅니다'],
  ];
  const ic = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

  $('stage').innerHTML = '<div class="mb-glow" aria-hidden="true"></div>'
    + '<div class="mb-phone" role="img" aria-label="마이턴 앱 화면"><i class="mb-btn l1"></i><i class="mb-btn l2"></i><i class="mb-btn r1"></i>'
    + `<div class="mb-screen"><span class="mb-island" aria-hidden="true"></span><div class="mb-view" id="view">${SLIDES.map(([f, t], i) => `<img class="mb-slide${i ? '' : ' on'}" src="${SHOT(f)}" alt="" width="600" height="1298" decoding="async"><span class="mb-cap${i ? '' : ' on'}">${t}</span>`).join('')}</div></div></div>`
    + `<div class="mb-dots" id="dots">${SLIDES.map(([, t], i) => `<button type="button" class="${i ? '' : 'on'}" data-i="${i}" aria-label="${t} 화면 보기"></button>`).join('')}</div>`;
  $('values').innerHTML = VALUES.map(([t, d], i) => `<article class="mb-value${i === VALUES.length - 1 ? ' hot' : ''}"><em>${String(i + 1).padStart(2, '0')}</em><b>${t}</b><span>${d}</span></article>`).join('');
  $('feats').innerHTML = FEATS.map(([k, t, d]) => `<article class="mb-feat"><h3>${ic(k)}${t}</h3><p>${d}</p></article>`).join('');
  $('apps').innerHTML = SHOTS.map(([f, t, d]) => `<figure class="mb-app"><div class="mb-app-frame"><img src="${SHOT(f)}" alt="마이턴 앱 ${t} 화면" width="600" height="1298" loading="lazy" decoding="async"></div><figcaption><b>${t}</b><small>${d}</small></figcaption></figure>`).join('');

  // 휴대폰 안 — 3초마다 다음 장, 점을 누르면 그 장
  let k = 0, timer = 0;
  const show = (n) => {
    k = ((n % SLIDES.length) + SLIDES.length) % SLIDES.length;
    document.querySelectorAll('#view .mb-slide').forEach((x, i) => x.classList.toggle('on', i === k));
    document.querySelectorAll('#view .mb-cap').forEach((x, i) => x.classList.toggle('on', i === k));
    document.querySelectorAll('#dots button').forEach((x, i) => x.classList.toggle('on', i === k));
  };
  const run = () => { clearInterval(timer); if (!matchMedia('(prefers-reduced-motion: reduce)').matches) timer = setInterval(() => { if (!document.hidden) show(k + 1); }, 3000); };
  $('dots').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { show(+b.dataset.i); run(); } });
  run();

  // 스토어 단추 — 출시 전
  let tt = 0;
  const toast = (t) => { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 1800); };
  // 이용가이드 — 앱용 이용가이드는 아직 없다(웹 이용가이드와 따로 만든다)
  $('guideSoon').addEventListener('click', (e) => { e.preventDefault(); toast('앱 이용가이드는 준비 중입니다.'); });
  document.querySelectorAll('[data-soon]').forEach((b) => b.addEventListener('click', () => toast(`${b.dataset.soon} 출시를 준비하고 있습니다.`)));
})();
</script>
</body>
</html>
