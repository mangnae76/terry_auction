<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 마이턴옥션 이용가이드 — 웹 머리띠 '이용가이드' 단추가 여는 페이지(/guide/). 2026-11-01 claude.ai 아티팩트에서 옮겨 왔다 -->
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>마이턴옥션 이용가이드</title>
<meta name="description" content="마이턴옥션 웹 이용가이드 — 서비스 목표, 주요 기능, 페이지별 메뉴 설명, 사용 방법, 멤버십, FAQ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* 레이아웃: 마이턴옥션 웹과 같은 틀 — 남색 머리띠 · 흰 장(章) 줄 · 블루그레이 바탕 위 흰 카드. 한 장으로 이어지는 스크롤 문서이며,
   넓은 화면에서는 왼쪽에 지금 읽는 장의 목차가 따라온다. 색 · 글꼴 · 크기 규칙은 마이턴옥션 웹(/web)의 디자인 토큰을 그대로 옮겼다 */
:root{
  --bg:#e7ebf1;--surface:#ffffff;--surface-2:#f8fafc;--surface-3:#f1f5f9;
  --line:#e5e7eb;--line-2:#d5dbe6;--card-line:#eef0f5;--row-line:#f1f3f7;--subtab-line:#d8e0ee;
  --text:#111827;--text-2:#4b5563;--muted:#6b7280;--faint:#9ca3af;
  --nav:#213366;--nav-2:#2b4078;--nav-deep:#14213d;--nav-text:#ffffff;--nav-dim:#c3cde6;--nav-name:#50c3fc;--nav-line:rgba(255,255,255,.22);
  --accent:#f4700a;--accent-soft:#f0a35e;--strong:#213366;--tab-on:#213366;
  --blue:#2b6df3;--blue-soft:#eef3ff;--cta:#4d7bef;
  --on-line:#6b85f0;--on-bg:#dce5ff;--on-text:#3850c2;
  --head-bg:#f3f6ff;--head-line:#e6ecfb;--head-text:#1f3a72;
  --plus:#eda134;--star:#facc15;--star-empty:#a8adb8;
  --ok:#16a34a;--danger:#d14343;--warn-bg:#fff7e8;--warn-line:#f3d9a4;--warn-text:#7a4f00;
  --st-desk:#2563eb;--st-plan:#16a34a;--st-visited:#15803d;--st-bid:#ca8a04;--st-running:#dc2626;--st-won:#4f5fd6;--st-fail:#7c8695;--st-sold:#0d9488;
  --tier-welcome:#6d5bd0;--tier-silver:#6b7584;--tier-gold:#c27c0e;--tier-family:#0d9488;
  --foot:#252a39;--foot-text:#9aa1b2;--foot-strong:#ffffff;
  --scrim:rgba(15,23,42,.45);
  --shot-dim:none;
  --shadow-card:0 1px 3px rgba(15,23,42,.06);
  --shadow-hover:0 10px 24px -10px rgba(33,51,102,.28),0 2px 6px rgba(15,23,42,.06);
  --shadow-pop:0 14px 36px -10px rgba(15,23,42,.3),0 3px 10px rgba(15,23,42,.08);
  --font:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --gnb-h:64px;--nav-h:46px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141f;--surface:#182031;--surface-2:#1d2638;--surface-3:#232d42;
  --line:#2a3449;--line-2:#34405a;--card-line:#253046;--row-line:#232d42;--subtab-line:#2a3650;
  --text:#cfd6e2;--text-2:#a9b2c2;--muted:#8b95a8;--faint:#6e788c;
  --nav:#172449;--nav-2:#22346a;--nav-deep:#0f1830;--nav-text:#e3e8f2;--nav-dim:#9fb0d6;--nav-name:#50c3fc;--nav-line:rgba(255,255,255,.16);
  --accent:#f4700a;--accent-soft:#f0a35e;--strong:#3d5bb0;--tab-on:#e6ecff;
  --blue:#5b8cff;--blue-soft:rgba(91,140,255,.14);--cta:#4d7bef;
  --on-line:#7d93f5;--on-bg:rgba(107,133,240,.22);--on-text:#b5c3ff;
  --head-bg:rgba(91,140,255,.12);--head-line:rgba(91,140,255,.22);--head-text:#b5c3ff;
  --plus:#eda134;--star:#facc15;--star-empty:#5b6579;
  --ok:#3fcf74;--danger:#ff7a7a;--warn-bg:rgba(237,161,52,.12);--warn-line:rgba(237,161,52,.35);--warn-text:#f3c87a;
  --st-desk:#6b9bff;--st-plan:#3fcf74;--st-visited:#34b26a;--st-bid:#e9b83a;--st-running:#ff6b6b;--st-won:#8b98ff;--st-fail:#97a1b2;--st-sold:#2dd4bf;
  --tier-welcome:#a597ff;--tier-silver:#a3adbd;--tier-gold:#f0b54a;--tier-family:#2dd4bf;
  --foot:#0b0f18;--foot-text:#7f889b;--foot-strong:#e3e8f2;
  --scrim:rgba(0,0,0,.6);
  --shot-dim:brightness(.9);
  --shadow-card:0 1px 3px rgba(0,0,0,.35);
  --shadow-hover:0 12px 26px -10px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.3);
  --shadow-pop:0 16px 40px -10px rgba(0,0,0,.75);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141f;--surface:#182031;--surface-2:#1d2638;--surface-3:#232d42;
  --line:#2a3449;--line-2:#34405a;--card-line:#253046;--row-line:#232d42;--subtab-line:#2a3650;
  --text:#cfd6e2;--text-2:#a9b2c2;--muted:#8b95a8;--faint:#6e788c;
  --nav:#172449;--nav-2:#22346a;--nav-deep:#0f1830;--nav-text:#e3e8f2;--nav-dim:#9fb0d6;--nav-name:#50c3fc;--nav-line:rgba(255,255,255,.16);
  --accent:#f4700a;--accent-soft:#f0a35e;--strong:#3d5bb0;--tab-on:#e6ecff;
  --blue:#5b8cff;--blue-soft:rgba(91,140,255,.14);--cta:#4d7bef;
  --on-line:#7d93f5;--on-bg:rgba(107,133,240,.22);--on-text:#b5c3ff;
  --head-bg:rgba(91,140,255,.12);--head-line:rgba(91,140,255,.22);--head-text:#b5c3ff;
  --plus:#eda134;--star:#facc15;--star-empty:#5b6579;
  --ok:#3fcf74;--danger:#ff7a7a;--warn-bg:rgba(237,161,52,.12);--warn-line:rgba(237,161,52,.35);--warn-text:#f3c87a;
  --st-desk:#6b9bff;--st-plan:#3fcf74;--st-visited:#34b26a;--st-bid:#e9b83a;--st-running:#ff6b6b;--st-won:#8b98ff;--st-fail:#97a1b2;--st-sold:#2dd4bf;
  --tier-welcome:#a597ff;--tier-silver:#a3adbd;--tier-gold:#f0b54a;--tier-family:#2dd4bf;
  --foot:#0b0f18;--foot-text:#7f889b;--foot-strong:#e3e8f2;
  --scrim:rgba(0,0,0,.6);
  --shot-dim:brightness(.9);
  --shadow-card:0 1px 3px rgba(0,0,0,.35);
  --shadow-hover:0 12px 26px -10px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.3);
  --shadow-pop:0 16px 40px -10px rgba(0,0,0,.75);
  color-scheme:dark;
}

/* ---------- 바탕 ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--nav)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.125em}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
/* 폭 · 여백은 대문(.ld-wrap)과 같게 — 머리띠 로고가 대문 · 절차 · 앱 소개와 같은 자리에 선다(2026-11-03) */
@media (max-width:720px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- 머리띠 ---------- */
.gnb{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--nav);color:var(--nav-text)}
.gnb-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.g-brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none}
.g-brand img{display:block;height:34px;width:auto;transition:transform .4s cubic-bezier(.2,.9,.3,1.4)}
/* 로고 — 웹 머리띠(.g-logo)와 같은 움직임: 올리면 살짝 기울며 커진다 */
.g-brand:hover img{transform:rotate(-4deg) scale(1.04)}
.g-brand span{font-size:15px;font-weight:700;color:var(--nav-name);padding-left:12px;border-left:1px solid var(--nav-line);white-space:nowrap;letter-spacing:-.2px}
.g-tools{position:relative;display:flex;align-items:center;gap:6px;flex:none}
.ver-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 12px;border-radius:999px;border:1px solid var(--nav-line);background:transparent;color:var(--nav-text);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--nav-text);font-size:18px}
.ver-btn:hover,.icon-btn:hover{background:rgba(255,255,255,.1)}
@media (max-width:560px){.g-brand img{height:28px}.g-brand span{font-size:14px}}

/* ---------- 장(章) 줄 ---------- */
.secnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--gnb-h));z-index:30;background:var(--surface);border-bottom:1px solid var(--subtab-line);box-shadow:0 1px 0 rgba(15,23,42,.03)}
.secnav-in{display:flex;align-items:stretch;gap:2px;height:var(--nav-h);overflow-x:auto;scrollbar-width:none}
.secnav-in::-webkit-scrollbar{display:none}
.secnav a{position:relative;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:15px;font-weight:600;color:var(--text-2);white-space:nowrap;text-decoration:none;transition:color .15s}
.secnav a:first-child{padding-left:2px}
.secnav a:hover{color:var(--text)}
.secnav a.on{color:var(--tab-on)}
.secnav a::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:2px 2px 0 0;background:var(--accent);transform:scaleX(0);transition:transform .2s ease}
.secnav a:first-child::after{left:0}
.secnav a.on::after{transform:scaleX(1)}
.secnav .no{font-size:11.5px;font-weight:800;color:var(--faint);font-variant-numeric:tabular-nums}
.secnav a.on .no{color:var(--accent)}
@media (max-width:560px){.secnav a{font-size:14px;padding:0 11px}.secnav .no{display:none}}

/* ---------- 이전 버전 띠 ---------- */
.oldbar{background:var(--warn-bg);border-bottom:1px solid var(--warn-line);color:var(--warn-text);font-size:13.5px}
.oldbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-block:10px}
.oldbar b{font-weight:800}
.oldbar button{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--warn-line);background:var(--surface);color:var(--text);font-size:13px;font-weight:700}

/* ---------- 본문 틀: 왼쪽 목차 + 오른쪽 글 ---------- */
main{flex:1;padding-block:24px 64px}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr)}.side{display:none}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--gnb-h) + var(--nav-h) + 20px);max-height:calc(100vh - var(--gnb-h) - var(--nav-h) - 40px);overflow:auto;padding:4px 2px 12px}
.side h6{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--muted)}
.side ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;border-left:2px solid var(--line-2)}
.side a{display:block;margin-left:-2px;padding:6px 10px 6px 14px;border-left:2px solid transparent;font-size:13.5px;font-weight:600;line-height:1.4;color:var(--text-2);text-decoration:none}
.side a:hover{color:var(--text)}
.side a.on{border-left-color:var(--accent);color:var(--tab-on);font-weight:800}
.side .star{color:var(--accent);margin-left:4px;font-size:11px;vertical-align:1px}
.content{display:grid;gap:56px;min-width:0}

/* ---------- 장 ---------- */
.sec{display:grid;gap:16px;min-width:0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--gnb-h) + var(--nav-h) + 12px)}
.sec-head{display:grid;gap:6px;padding:4px 2px}
.sec-no{font-size:12.5px;font-weight:800;letter-spacing:1.2px;color:var(--accent);font-variant-numeric:tabular-nums}
.sec-head h2{display:flex;align-items:center;gap:10px;margin:0;font-size:26px;line-height:1.25;font-weight:800;letter-spacing:-.6px;text-wrap:balance}
.sec-head h2 .ic{color:var(--blue)}
.sec-head p{margin:0;font-size:15px;color:var(--muted);max-width:70ch}
.panel{min-width:0;overflow:hidden;background:var(--surface);border:1px solid var(--card-line);border-radius:14px;box-shadow:var(--shadow-card);padding:24px 28px 28px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--gnb-h) + var(--nav-h) + 14px)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.panel-head h3{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px}
.panel-head h3>.ic{color:var(--blue)}
.panel-head .path{font-size:12.5px;font-weight:600;color:var(--muted)}
.panel-body{display:grid;gap:18px;min-width:0}
.panel.key{border-color:color-mix(in srgb,var(--accent) 45%,var(--card-line));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent),var(--shadow-card)}
@media (max-width:720px){.panel{padding:18px 16px 22px;border-radius:12px}.sec-head h2{font-size:22px}.content{gap:44px}}

/* 글 */
.lead{margin:0;font-size:16.5px;line-height:1.75;color:var(--text);max-width:72ch}
.p{margin:0;font-size:15px;line-height:1.75;color:var(--text-2);max-width:72ch}
.lead b,.p b,.list b,.note b,.tbl td b,.card p b,.step-b p b,.faq .a b{color:var(--text);font-weight:700}
.bh{margin:8px 0 0;font-size:16px;font-weight:800;letter-spacing:-.2px}
.list{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px;line-height:1.7;color:var(--text-2);max-width:76ch}
.list li::marker{color:var(--faint)}
.req{color:var(--danger);font-weight:800}
.big-quote{margin:0;padding:22px 24px;border-radius:12px;background:var(--nav);color:var(--nav-text);font-size:22px;line-height:1.45;font-weight:800;letter-spacing:-.5px;text-wrap:balance}
.big-quote em{font-style:normal;color:var(--accent-soft)}
.big-quote small{display:block;margin-top:6px;font-size:14px;font-weight:600;color:var(--nav-dim);letter-spacing:0}
@media (max-width:720px){.big-quote{font-size:18px;padding:18px}}

/* 꼬리표 · 칩 */
.tag{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:4px;font-size:11.5px;font-weight:800;letter-spacing:.2px;line-height:1;white-space:nowrap;flex:none}
.tag.plus{background:var(--plus);color:#fff}
.tag.soon{background:var(--surface-3);color:var(--muted);border:1px solid var(--line-2)}
.tag.new{background:var(--accent);color:#fff}
.tag.key{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chips-label{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);font-size:13.5px;font-weight:600;white-space:nowrap}

/* 카드 묶음 */
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:12px}
@media (max-width:980px){.cards{--cols:2!important}}
@media (max-width:600px){.cards{--cols:1!important}}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.card.dark{background:var(--nav);border-color:var(--nav);color:var(--nav-text)}
.card.dark p{color:var(--nav-dim)}
.card.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.card.hot p{color:#fff3e8}
.card-no{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--accent);font-variant-numeric:tabular-nums}
.card.dark .card-no{color:var(--accent-soft)}
.card.hot .card-no{color:#fff3e8}
.card-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.card-ic{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-size:17px;flex:none}
.card p{margin:0;font-size:14px;line-height:1.65;color:var(--text-2)}
.card .more{margin-top:auto;padding-top:4px;display:inline-flex;align-items:center;gap:2px;align-self:flex-start;font-size:13px;font-weight:700;color:var(--blue);text-decoration:none}
.card .more:hover{text-decoration:underline;text-underline-offset:3px}
.card.dark .more{color:var(--accent-soft)}

/* 따라하기 */
.steps{list-style:none;margin:0;padding:0;display:grid}
.step{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:14px;padding-bottom:20px}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:36px;bottom:6px;width:2px;border-radius:1px;background:var(--line-2)}
.step-n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--strong);color:#fff;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.step-b{min-width:0;padding-top:4px;display:grid;gap:4px;justify-items:start}
.step-b h4{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.step-b p{margin:0;font-size:14.5px;line-height:1.7;color:var(--text-2);max-width:72ch}

/* 표 */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:540px}
.tbl th{padding:10px 16px;background:var(--head-bg);border-bottom:1px solid var(--head-line);color:var(--head-text);font-size:13.5px;font-weight:700;text-align:left;white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--row-line);color:var(--text-2);line-height:1.65;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{color:var(--text);font-weight:700;white-space:nowrap}
.tbl-note{margin:8px 2px 0;font-size:13px;color:var(--muted)}

/* 알림 상자 */
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:14px 16px;border-radius:10px;border:1px solid var(--head-line);background:var(--blue-soft);font-size:14.5px;line-height:1.7;color:var(--text-2)}
.note>.ic{font-size:18px;color:var(--blue);margin-top:3px}
.note .nt{display:block;margin-bottom:2px;color:var(--text);font-weight:800}
.note.tip{background:var(--surface-2);border-color:var(--line)}
.note.tip>.ic{color:var(--plus)}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-text)}
.note.warn>.ic,.note.warn .nt,.note.warn b{color:var(--warn-text)}

/* 단추 */
.go{display:flex;flex-wrap:wrap;gap:8px}
.mini{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap}
.mini:hover{border-color:var(--on-line);color:var(--text)}
.open-app{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--head-line);background:var(--blue-soft);color:var(--blue);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.open-app:hover{border-color:var(--on-line)}

/* 대문(히어로) */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:16px;padding:36px;background:var(--nav);color:var(--nav-text);display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:32px;align-items:center}
.hero::after{content:"";position:absolute;z-index:-1;right:-160px;top:-180px;width:480px;height:480px;border-radius:50%;background:var(--nav-name);opacity:.12}
.hero-badge{justify-self:start;display:inline-flex;align-items:center;height:28px;padding:0 14px;border-radius:999px;background:var(--accent-soft);color:var(--nav-deep);font-size:13px;font-weight:900;letter-spacing:1px}
.hero-copy{display:grid;gap:16px;align-content:start}
.hero-title{margin:0;font-size:34px;line-height:1.28;font-weight:900;letter-spacing:-1px;text-wrap:balance}
.hero-title em{font-style:normal;color:var(--accent-soft)}
.hero p{margin:0;font-size:15.5px;line-height:1.75;color:var(--nav-dim);max-width:48ch}
.hero p b{color:var(--nav-text)}
.hero-chips{display:flex;flex-wrap:wrap;gap:6px}
.hero-chips span{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:var(--nav-2);color:var(--nav-text);font-size:12.5px;font-weight:700}
.hero-chips span.hot{background:var(--accent);color:#fff}
.hero-photo{position:relative;min-width:0;margin:0;overflow:hidden;border-radius:14px;background:var(--nav-deep);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 8px 18px -12px rgba(0,0,0,.35)}
.hero-photo img{display:block;width:100%;height:auto}
.hero-photo figcaption{display:grid;gap:6px;padding:18px 24px 20px;background:var(--nav-deep)}
.hero-photo figcaption span{font-size:14.5px;line-height:1.65;color:#e2e8f5;text-wrap:pretty}
.hero-photo figcaption b{font-size:24px;line-height:1.3;font-weight:900;letter-spacing:-.6px;color:var(--accent-soft)}
@media (max-width:720px){.hero-photo figcaption{padding:16px 16px 18px}.hero-photo figcaption b{font-size:20px}}
.statement{display:grid;gap:8px;padding:2px 0 4px}
.statement .eyebrow{font-size:13px;font-weight:900;letter-spacing:1.4px;color:var(--accent)}
.statement p{margin:0;font-size:23px;line-height:1.4;font-weight:800;letter-spacing:-.6px;color:var(--text);text-wrap:balance;max-width:34ch}
.statement p em{font-style:normal;color:var(--accent)}
@media (max-width:720px){.statement p{font-size:19px}}
@media (max-width:980px){.hero{grid-template-columns:1fr;padding:30px 24px}.hero-title{font-size:28px}}
@media (max-width:720px){.hero{padding:24px 18px;border-radius:12px}.hero-title{font-size:24px}}

/* 게임판 그림 */
.art{margin:0;display:grid;gap:10px}
.art .board-art{display:block;width:100%;height:auto;border-radius:12px;max-width:100%}
.art figcaption{font-size:13px;color:var(--muted);text-align:center}

/* 서비스 구간 */
.scope{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.sc{display:grid;place-items:center;min-height:54px;padding:8px 6px;border-radius:8px;background:var(--surface-3);color:var(--muted);font-size:13.5px;font-weight:700;line-height:1.35;text-align:center}
.sc.in{background:var(--on-bg);border:1px solid var(--on-line);color:var(--on-text)}
.scope-cap{padding-top:8px;border-top:3px solid var(--line-2);font-size:12.5px;font-weight:700;color:var(--muted);text-align:center}
.scope-cap.in{grid-column:2 / -1;border-top-color:var(--accent);color:var(--text)}
.scope-key{display:none;margin:8px 0 0;font-size:13px;color:var(--muted)}
.scope-key i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--on-bg);border:1px solid var(--on-line);vertical-align:-1px;margin-right:6px}
@media (max-width:760px){.scope{grid-template-columns:repeat(4,minmax(0,1fr))}.sc{font-size:12.5px}.scope-cap{display:none}.scope-key{display:block}}

/* BI */
.bi{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:stretch}
.bi-logo{display:grid;place-items:center;padding:28px;border-radius:12px;background:var(--nav)}
.bi-logo img{width:100%;max-width:220px;height:auto}
.bi-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;align-content:center}
.bi-list li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:14px;line-height:1.6;color:var(--text-2)}
.bi-list b{display:block;color:var(--text);font-size:15px}
.bi-sw{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;font-size:20px;color:#fff}
@media (max-width:760px){.bi{grid-template-columns:1fr}}

/* 게임판 칸(단계) */
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:480px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{--c:var(--st-desk);display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
.tile-band{height:8px;background:var(--c)}
.tile-in{display:grid;gap:4px;padding:10px 12px 12px}
.tile-no{font-size:11.5px;font-weight:800;letter-spacing:.3px;color:var(--faint);font-variant-numeric:tabular-nums}
.tile-name{font-size:15px;font-weight:800;color:var(--c)}
.tile-desc{font-size:12.5px;line-height:1.5;color:var(--text-2)}
.tile.start{background:var(--nav);border-color:var(--nav)}
.tile.start .tile-band{background:var(--accent)}
.tile.start .tile-no{color:var(--nav-name)}
.tile.start .tile-name{color:var(--nav-text)}
.tile.start .tile-desc{color:var(--nav-dim)}

/* 단계 줄 */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.stg{--c:var(--st-desk);display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:7px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,var(--surface));color:var(--c);font-size:14px;font-weight:700;white-space:nowrap}
.flow .arr{padding:0 1px;font-size:10px;color:var(--faint)}
.flow .grp{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px dashed var(--line-2);border-radius:10px}

/* 손품조사 3요소 */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 40px minmax(0,.95fr);gap:12px;align-items:stretch}
.trio .arrow{display:grid;place-items:center;color:var(--accent);font-size:24px}
.pillar{display:grid;gap:8px;align-content:start;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.pillar .q{font-size:12.5px;font-weight:800;color:var(--accent)}
.pillar h4{margin:0;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;letter-spacing:-.3px}
.pillar p{margin:0;font-size:14px;line-height:1.65;color:var(--text-2)}
.pillar ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6;color:var(--text-2)}
.pillar.out{background:var(--nav);border-color:var(--nav);color:var(--nav-text)}
.pillar.out .q{color:var(--accent-soft)}
.pillar.out p,.pillar.out ul{color:var(--nav-dim)}
@media (max-width:1100px){.trio{grid-template-columns:repeat(3,minmax(0,1fr))}.trio .arrow{grid-column:1 / -1;transform:rotate(90deg);height:28px}.trio .pillar.out{grid-column:1 / -1}}
@media (max-width:720px){.trio{grid-template-columns:1fr}}

/* 화면 캡처 + 번호 설명 */
.shot{margin:0;display:grid;gap:14px;min-width:0}
.shot-frame{position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:12px;background:#fff;box-shadow:var(--shadow-card)}
.shot-bar{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:#eef1f6;border-bottom:1px solid #dfe4ec}
.shot-bar i{width:9px;height:9px;border-radius:50%;background:#d3d9e3}
.shot-bar span{margin-left:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:#6b7280}
.shot-img{position:relative}
.shot-in{position:relative}
.shot-swipe{display:none}
@media (max-width:720px){.shot-img{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}.shot-in{width:680px}.shot-swipe{display:block;margin:0;padding:6px 12px 8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2);background:var(--surface-2)}}
.shot-img img{display:block;width:100%;height:auto;filter:var(--shot-dim)}
.shot-pin{position:absolute;display:grid;place-items:center;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 0 0 3px #fff,0 4px 12px rgba(0,0,0,.28);transition:transform .15s}
.shot-pin.hot{transform:scale(1.3)}
@media (max-width:720px){.shot-pin{width:20px;height:20px;margin:-10px 0 0 -10px;font-size:11px;box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.25)}}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}
@media (max-width:760px){.legend{grid-template-columns:1fr}}
.legend li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:8px 8px;border-radius:8px;font-size:14px;line-height:1.6;color:var(--text-2)}
.legend li.hot{background:var(--surface-2)}
.legend .lg-t{display:block;color:var(--text);font-weight:800}
.legend li div b{color:var(--text);font-weight:700}
.pin{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:900;font-style:normal;line-height:1;font-variant-numeric:tabular-nums}

/* 예시 화면(캡처가 없을 때) — 공통 화면 구성 */
.mock{position:relative;min-width:0;padding:34px 14px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg)}
.mock-tag{position:absolute;left:14px;top:10px;font-size:11.5px;font-weight:800;letter-spacing:.3px;color:var(--muted)}
.mock-scroll{overflow-x:auto}
.mk-app{min-width:820px;overflow:hidden;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);font-size:12px}
.mk-gnb{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;background:var(--nav);color:var(--nav-text)}
.mk-gnb img{height:22px;width:auto}
.mk-m{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;white-space:nowrap}
.mk-m .on{padding-bottom:3px;border-bottom:2px solid var(--accent)}
.mk-box{display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid var(--nav-line);border-radius:5px;font-size:11px}
.mk-r{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:10.5px;color:var(--nav-dim);white-space:nowrap}
.mk-sub{display:flex;align-items:center;gap:12px;height:36px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--subtab-line);font-weight:600;color:var(--text-2);white-space:nowrap}
.mk-sub .where{font-weight:800;color:var(--text)}
.mk-sub .on{color:var(--tab-on);text-decoration:underline 2px var(--accent);text-underline-offset:10px}
.mk-crumb{display:inline-flex;align-items:center;gap:4px;margin-right:14px;font-size:11px;color:var(--muted)}
.mk-m>i{font-style:normal;color:var(--nav-dim);font-size:11px}
.mk-div{width:1px;height:14px;background:var(--nav-line)}
.mk-body{display:grid;gap:10px;padding:12px 14px}
.mk-tool{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px}
.mk-c{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);font-size:11.5px;font-weight:500;white-space:nowrap}
.mk-c.on{background:var(--on-bg);border-color:var(--on-line);color:var(--on-text)}
.mk-search{flex:1;color:var(--faint)}
.mk-ghost{height:58px;border-radius:8px;background:var(--surface);border:1px solid var(--card-line)}
.mock .pin{width:18px;height:18px;font-size:10.5px;box-shadow:0 0 0 2px var(--surface)}

/* 이용권 */
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-top:8px}
@media (max-width:980px){.plans{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.plans{grid-template-columns:1fr}}
.plan{position:relative;display:grid;gap:6px;min-width:0;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.plan.best{border-color:var(--on-line);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--on-line)}
.plan-flag{position:absolute;top:-10px;right:14px;padding:2px 9px;border-radius:999px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800}
.plan-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plan-h b{font-size:16px;font-weight:800}
.plan-off{font-size:12.5px;font-weight:800;color:var(--danger)}
.plan-off.base{color:var(--muted);font-weight:700}
.plan-price{font-size:26px;font-weight:800;letter-spacing:-.6px;color:var(--text);font-variant-numeric:tabular-nums}
.plan-price small{margin-left:2px;font-size:15px;font-weight:700}
.plan-per{font-size:13.5px;font-weight:700;color:var(--on-text);font-variant-numeric:tabular-nums}
.plan-base{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.perks{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}   /* 혜택 수만큼 똑같이 나눈다(포인트를 숨기면 둘) */
.perk{display:grid;gap:4px;justify-items:center;text-align:center;padding:18px 8px;border-radius:12px;background:var(--blue-soft);border:1px solid var(--head-line)}
.perk strong{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--on-text);font-variant-numeric:tabular-nums}
.perk small{font-size:12.5px;color:var(--text-2)}

/* 포인트 등급 */
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.tiers{grid-template-columns:1fr}}
.tier{--c:var(--tier-welcome);display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tier-h{padding:14px 16px;background:color-mix(in srgb,var(--c) 11%,var(--surface));border-bottom:1px solid var(--line)}
.tier-h b{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:800;letter-spacing:.8px;color:var(--c)}
.tier-h b span{font-size:12.5px;font-weight:700;letter-spacing:0;color:var(--text-2)}
.tier-h small{display:block;margin-top:3px;font-size:13px;font-weight:700;color:var(--text)}
.tier ul{list-style:none;margin:0;padding:6px 16px 10px}
.tier li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--row-line);font-size:13px;color:var(--text-2)}
.tier li:last-child{border-bottom:0}
.tier li b{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 회원 비교 */
.cmp th:not(:first-child),.cmp td:not(:first-child){text-align:center}
.cmp td:first-child{white-space:normal;min-width:190px}
.cmp .hl{background:color-mix(in srgb,var(--blue) 6%,transparent)}
.cmp th.hl{color:var(--blue)}
.yes{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:700;white-space:nowrap}
.no{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;white-space:nowrap}

/* FAQ */
.faq-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.faq-cats{display:flex;flex-wrap:wrap;gap:6px}
.faq-cats button{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600}
.faq-cats button.on{background:var(--on-bg);border-color:var(--on-line);color:var(--on-text);font-weight:800}
.faq-search{display:flex;align-items:center;gap:8px;width:min(320px,100%);height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--muted)}
.faq-search:focus-within{border-color:var(--on-line);box-shadow:0 0 0 3px var(--blue-soft)}
.faq-search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:var(--text);outline:none}
.faq{display:grid;gap:8px}
.faq details{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.faq details[open]{background:var(--surface);border-color:var(--line-2)}
.faq summary{display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq .q{flex:none;color:var(--blue);font-weight:800}
.faq .cat{flex:none;font-size:11.5px;font-weight:700;color:var(--muted);padding:2px 7px;border-radius:4px;background:var(--surface-3)}
.faq summary>.ic{margin-left:auto;color:var(--faint);transition:transform .2s}
.faq details[open] summary>.ic{transform:rotate(180deg)}
.faq .a{padding:0 16px 16px 38px;font-size:14.5px;line-height:1.75;color:var(--text-2)}
.faq-empty{margin:0;padding:24px 16px;border:1px dashed var(--line-2);border-radius:12px;text-align:center;font-size:14.5px;color:var(--muted)}

/* 문의 */
.contact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.contact{grid-template-columns:1fr}}
.ct{display:grid;grid-template-columns:46px minmax(0,1fr);gap:2px 14px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.ct .card-ic{width:46px;height:46px;font-size:21px;grid-row:span 3;align-self:start}
.ct small{font-size:12.5px;font-weight:700;color:var(--muted)}
.ct strong{font-size:21px;font-weight:800;letter-spacing:-.3px;user-select:all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.ct .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* 영상 */
.video{position:relative;overflow:hidden;border-radius:12px;background:var(--nav-deep);aspect-ratio:16/9;max-width:100%}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-box{margin:0;border-radius:12px;overflow:hidden;background:var(--nav)}
.video-frame{position:relative;aspect-ratio:16/9;background:#0b1220}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.video-frame:fullscreen{background:#000}
.video-frame:-webkit-full-screen{background:#000}

const semver = (v) => v.split('.').map(Number);
const cmpVer = (a, b) => { const x = semver(a), y = semver(b); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); } return 0; };
const clone = (o) => JSON.parse(JSON.stringify(o));
const GUIDE = {
  list: [],
  release(def) {
    let content;
    if (def.content) content = def.content;
    else {
      const base = this.get(def.base);
      if (!base) throw new Error(`base 버전 ${def.base} 을 먼저 등록해 주세요.`);
      content = clone(base.content);
      if (typeof def.patch === 'function') def.patch(content);
    }
    this.list.push({ v: def.v, date: def.date, title: def.title || '', notes: def.notes || [], content });
    this.list.sort((a, b) => cmpVer(a.v, b.v));
  },
  get(v) { return this.list.find((r) => r.v === v); },
  latest() { return this.list[this.list.length - 1]; },
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('ko-KR');
/* 요금 글자 자리표 — {base} 1개월 기준가, {maxOff} 최대 할인율, {perDay} 가장 긴 기간의 하루 금액(10원 단위 반올림) */
const priceTok = (str) => {
  if (typeof str !== 'string' || str.indexOf('{') < 0) return str;
  const P = S.rel.content.pricing; const long = P.plans.reduce((a, b) => (b[0] > a[0] ? b : a));
  const total = P.base * long[0] * (100 - long[1]) / 100; const perDay = Math.round(total / (long[0] * 365 / 12) / 10) * 10;
  return str.replace(/\{base\}/g, fmt(P.base)).replace(/\{maxOff\}/g, String(Math.max(...P.plans.map((p) => p[1])))).replace(/\{perDay\}/g, fmt(perDay));
};

const toSec = (at) => { if (!at) return -1; const p = String(at).split(':').map(Number); return p.some(isNaN) ? -1 : p.reduce((a, b) => a * 60 + b, 0); };
const ytId = (u) => { const m = String(u).match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/); return m ? m[1] : ''; };
const ytSrc = (id, start, auto) => `https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1${start > 0 ? `&start=${start}` : ''}${auto ? '&autoplay=1' : ''}`;
function playerHtml() {
  const v = V();
  if (!vReady()) return `<img src="${IMG}${esc(v.poster)}" alt=""><div class="player-cover"><span class="stamp">${I('play')}준비 중</span><strong>웹 사용법 영상을 만들고 있습니다</strong><p>영상이 올라오면 이 자리에서 바로 재생되고, 목차를 눌러 원하는 장면으로 건너뛸 수 있습니다.</p><p class="more">그동안 같은 내용을 웹으로 보기에서 실제 화면과 함께 볼 수 있어요.</p><a class="btn-accent" href="#web" data-mode="web">${I('doc')}웹으로 보기</a></div>`;
  const id = ytId(v.src);
  if (id) return `<iframe id="vFrame" src="${esc(ytSrc(id, 0, false))}" title="마이턴옥션 웹 사용법 영상" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>`;
  return `<video id="vFile" controls playsinline preload="metadata" poster="${IMG}${esc(v.poster)}"><source src="${esc(v.src)}" type="${/\.webm($|\?)/i.test(v.src) ? 'video/webm' : 'video/mp4'}">${v.captions ? `<track kind="captions" srclang="ko" label="한국어" src="${esc(v.captions)}" default>` : ''}이 브라우저는 영상 재생을 지원하지 않습니다.</video>`;

function renderVideo() {
  const v = V(); const ready = vReady();
  const info = ready ? [v.length && `길이 <b>${esc(v.length)}</b>`, v.updated && `만든 날 <b>${esc(dot(v.updated))}</b>`, `기준 <b>웹 가이드 v${esc(S.rel.v)}</b>`].filter(Boolean).join('') : `<span>목차는 영상 구성 예정안입니다. 각 장의 ${I('doc')} 단추로 웹 가이드의 같은 자리를 바로 열 수 있습니다.</span>`;
  $('vview').innerHTML = `<div class="wrap">
    <header class="vv-head"><div><span class="sec-no">VIDEO</span><h2 id="vTitle">${I('play')}영상으로 보기</h2><p>웹 화면을 따라 하며 보는 사용법 영상입니다.</p></div><a class="mini" href="#web" data-mode="web">${I('doc')}웹으로 보기</a></header>

        <ol>${v.chapters.map((c, i) => {
          const sec = toSec(c.at); const can = ready && sec >= 0;
          const inner = `<span class="toc-no">${String(i + 1).padStart(2, '0')}</span><span class="toc-txt"><b>${esc(c.title)}${c.key ? tagOf('key') : ''}</b><small>${esc(c.desc)}</small></span><span class="toc-at${can ? '' : ' tbd'}">${can ? esc(c.at) : '예정'}</span>`;
          return `<li class="${c.key ? 'key' : ''}${S.chapter === c.id ? ' on' : ''}" data-ch="${esc(c.id)}">${can ? `<button type="button" class="toc-item" data-seek="${esc(c.id)}" aria-label="${esc(c.title)} 장면으로 건너뛰기 (${esc(c.at)})">${inner}</button>` : `<div class="toc-item">${inner}</div>`}<a class="toc-web" href="#${esc(c.aid)}" title="웹으로 보기에서 열기" aria-label="${esc(c.title)} — 웹으로 보기에서 열기">${I('doc')}</a></li>`;
        }).join('')}</ol></aside>
    </div></div>`;

function seekTo(id, auto) {
  const c = V().chapters.find((x) => x.id === id); if (!c) return;
  S.chapter = id; document.querySelectorAll('.vv-toc li').forEach((li) => li.classList.toggle('on', li.dataset.ch === id));
  const sec = toSec(c.at); if (!vReady() || sec < 0) return;
  const f = $('vFile'); const fr = $('vFrame');
  if (f) { try { f.currentTime = sec; if (auto) { const pr = f.play(); if (pr && pr.catch) pr.catch(() => {}); } } catch (e) { /* 메타데이터 전 — 무시 */ } }
  else if (fr) { const yid = ytId(V().src); if (yid) fr.src = ytSrc(yid, sec, auto); }
  if (auto) $('player').scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'nearest' });
}
function stopVideo() {
  const f = $('vFile'); if (f) { try { f.pause(); } catch (e) { /* 그만 */ } }
  const fr = $('vFrame'); if (fr) { const yid = ytId(V().src); if (yid) fr.src = ytSrc(yid, 0, false); }
}

/* ---------- 보기 방식 (첫 화면 · 웹 · 영상) ---------- */
function setMode(m) {
  if (S.mode === m) return;
  const was = S.mode; S.mode = m;
  if (was === 'video') stopVideo();
  $('home').hidden = m !== 'home'; $('vview').hidden = m !== 'video';
  $('secnav').hidden = m !== 'web'; $('main').hidden = m !== 'web';
  document.documentElement.dataset.mode = m;
  if (m === 'home') renderHome();
  if (m === 'video') renderVideo();
  syncH();
  if (m === 'web') { S.cur = ''; syncSpy(true); }
}
const MODES = ['home', 'web', 'video'];
function route(h, instant) {
  // 들어오면 바로 웹 페이지 — 고르는 첫 화면은 건너뛴다(예전 #home 주소도 웹으로)
  if (!h || h === 'home') { setMode('web'); window.scrollTo(0, 0); return; }
  if (h === 'web') { setMode('web'); window.scrollTo(0, 0); return; }
  if (h === 'video' || h.startsWith('video-')) { setMode('video'); window.scrollTo(0, 0); if (h.startsWith('video-')) seekTo(h.slice(6), false); return; }
  if (document.getElementById(h) && $('main').contains(document.getElementById(h))) { setMode('web'); if (!goTo(h, instant)) window.scrollTo(0, 0); return; }
  setMode('web'); window.scrollTo(0, 0);
}

    }).join('');
    return `<section class="sec" id="${sec.id}" data-sec="${sec.id}" aria-labelledby="h-${sec.id}">
      <header class="sec-head"><span class="sec-no">${String(i + 1).padStart(2, '0')}</span><h2 id="h-${sec.id}">${I(sec.ic)}${esc(sec.title)}</h2><p>${sec.desc}</p></header>
      ${sec.hero ? heroHtml() : ''}${panels}</section>`;
  }).join('');
}

function renderFoot() {
  const k = C().contact; const L = GUIDE.latest();
  $('foot').innerHTML = `<div class="wrap">
    <div><p><b>마이턴옥션 이용가이드</b> v${esc(S.rel.v)} · ${dot(S.rel.date)} 기준</p><p>최신 버전 v${esc(L.v)} · <button type="button" class="linkish" data-act="log">업데이트 내역</button></p><p>마이턴옥션은 리치마블의 부동산 경매 브랜드입니다.</p></div>
    <div><p>문의 ${esc(k.phone)} · 대표메일 ${esc(k.email)}</p><p>${esc(k.address)}</p><p>COPYRIGHT ⓒMyTurn. ALL RIGHTS RESERVED.</p></div>
  </div>`;
}

function renderOldbar() {
  const L = GUIDE.latest(); const bar = $('oldbar');
  bar.hidden = S.rel === L;
  if (!bar.hidden) bar.innerHTML = `<div class="wrap"><span>지금 <b>이전 버전 v${esc(S.rel.v)}</b>(${dot(S.rel.date)}) 가이드를 보고 있습니다. 최신은 v${esc(L.v)}(${dot(L.date)})입니다.</span><button type="button" data-act="latest">최신 버전 보기</button></div>`;
}

function renderVerPop() {
  const L = GUIDE.latest();
  $('verPop').innerHTML = `<h6>가이드 버전</h6>${GUIDE.list.slice().reverse().map((r) => `<button type="button" class="ver-opt${r === S.rel ? ' on' : ''}" data-ver="${esc(r.v)}"><b>v${esc(r.v)}</b>${r === L ? '<em>최신</em>' : '<span></span>'}<small>${dot(r.date)} · ${esc(r.title)}</small></button>`).join('')}<button type="button" class="ver-log" data-act="log">${I('history')}업데이트 내역 보기</button>`;
}

function render() {
  renderNav(); renderContent(); renderFoot(); renderOldbar(); renderVerPop();
  if (S.mode === 'home') renderHome();
  if (S.mode === 'video') renderVideo();
  S.cur = ''; if (S.mode === 'web') syncSpy(true);
}

/* ---------- 스크롤 위치 따라가기 ---------- */
const reduce = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const navBottom = () => $('secnav').getBoundingClientRect().bottom;

function setActive(secId, subIdv) {
  if (secId !== S.cur) {
    S.cur = secId; renderSide();
    const nav = $('secnavIn'); let on = null;
    nav.querySelectorAll('a').forEach((a) => { const hit = a.dataset.sec === secId; a.classList.toggle('on', hit); if (hit) { a.setAttribute('aria-current', 'true'); on = a; } else a.removeAttribute('aria-current'); });
    if (on) { const l = on.offsetLeft - 24; if (l < nav.scrollLeft || on.offsetLeft + on.offsetWidth > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = Math.max(0, l); }
  }
  S.curSub = subIdv || '';
  $('side').querySelectorAll('a').forEach((a) => a.classList.toggle('on', a.dataset.sub === S.curSub));
}

function syncSpy(force) {
  if (S.mode !== 'web') return;
  if (!force && Date.now() < S.lockSpy) return;
  const line = navBottom() + 40;
  const secs = [...document.querySelectorAll('.sec')];
  let cur = secs[0];
  secs.forEach((s) => { if (s.getBoundingClientRect().top <= line) cur = s; });
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1];
  if (!cur) return;
  const panels = [...cur.querySelectorAll('.panel[data-sub]')];
  let sub = panels[0];
  panels.forEach((p) => { if (p.getBoundingClientRect().top <= line) sub = p; });
  setActive(cur.dataset.sec, sub ? sub.dataset.sub : '');
}

function goTo(id, instant) {
  const el = document.getElementById(id); if (!el) return false;
  const sec = el.closest('.sec'); S.lockSpy = Date.now() + 800;
  setActive(sec ? sec.dataset.sec : id, el.classList.contains('panel') ? id : '');
  el.scrollIntoView({ behavior: instant || reduce() ? 'auto' : 'smooth', block: 'start' });
  return true;
}

function fromHash(instant) {
  let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = ''; }
  route(h, instant);
}

/* ---------- 버전 · 창 · 테마 · 알림 ---------- */
function setVersion(v) {
  const r = GUIDE.get(v); if (!r || r === S.rel) return;
  const keep = S.mode === 'web' ? (S.curSub || S.cur) : ''; S.rel = r; render();
  if (keep) goTo(keep, true);
  try { const u = new URL(location.href); if (r === GUIDE.latest()) u.searchParams.delete('v'); else u.searchParams.set('v', r.v); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (e) { /* 주소를 바꿀 수 없는 곳 — 화면만 바꾼다 */ }
  toast(`v${r.v} 가이드를 엽니다.`);
}
function togglePop(open) { const pop = $('verPop'); const want = open == null ? pop.hidden : open; pop.hidden = !want; $('verBtn').setAttribute('aria-expanded', String(want)); }
let lastFocus = null;
function openLog() {
  togglePop(false); lastFocus = document.activeElement; const L = GUIDE.latest();
  $('modalBox').innerHTML = `<div class="modal-h"><h3 id="modalTitle">${I('history')}업데이트 내역</h3><button type="button" class="icon-btn" data-act="close" aria-label="닫기">${I('x')}</button></div>${GUIDE.list.slice().reverse().map((r) => `<section class="rel"><div class="rel-h"><b>v${esc(r.v)}</b>${r === L ? '<span class="tag">최신</span>' : ''}<time datetime="${esc(r.date)}">${dot(r.date)}</time></div><ul>${r.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>${r === S.rel ? '' : `<button type="button" class="mini" data-ver="${esc(r.v)}">이 버전 보기</button>`}</section>`).join('')}`;
  $('modal').hidden = false; const c = $('modalBox').querySelector('[data-act="close"]'); if (c) c.focus();
}
function closeLog() { $('modal').hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
const THEME_KEY = 'myturn.guide.theme';
const isDark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
function paintTheme() { const d = isDark(); $('themeBtn').innerHTML = I(d ? 'sun' : 'moon'); $('themeBtn').setAttribute('aria-label', d ? '낮 화면으로 바꾸기' : '밤 화면으로 바꾸기'); }
function toggleTheme() { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* 저장 못 해도 화면은 바뀐다 */ } paintTheme(); }
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 1800); }
function copyText(text, btn) {
  const done = () => toast('복사했습니다.');
  const fallback = () => { const box = btn.closest('.ct'); const el = box && box.querySelector('strong'); if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('선택했습니다. 복사해 쓰세요.'); } };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback(); } catch (e) { fallback(); }
}
function filterFaq() {
  const q = (($('faqQ') || {}).value || '').trim().toLowerCase(); let n = 0;
  document.querySelectorAll('#faqList details').forEach((d) => {
    const hit = (S.faqCat === '전체' || d.dataset.cat === S.faqCat) && (!q || d.textContent.toLowerCase().includes(q));
    d.hidden = !hit; if (hit) { n++; if (q) d.open = true; }
  });
  const e = $('faqEmpty'); if (e) e.hidden = n > 0;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', (e) => {
  /* 소개 영상 전체 화면 — 틀째 화면 가득. 못 하는 기기(아이폰 사파리 등)는 영상 화면을 새 창으로 */
  if (e.target.closest('[data-act="video-full"]')) {
    const f = $('promoFrame'); const go = f && (f.requestFullscreen || f.webkitRequestFullscreen);
    if (go) { try { const r = go.call(f); if (r && r.catch) r.catch(() => window.open(PROMO_PLAY_URL, '_blank', 'noopener')); } catch (err) { window.open(PROMO_PLAY_URL, '_blank', 'noopener'); } }
    else window.open(PROMO_PLAY_URL, '_blank', 'noopener');
    return;
  }
  const a = e.target.closest('a[href^="#"]');
  if (a && !a.target) {
    const id = decodeURIComponent(a.getAttribute('href').slice(1));
    const el = id && document.getElementById(id);
    if (MODES.includes(id) || id.startsWith('video-') || (el && $('main').contains(el))) {
      e.preventDefault(); togglePop(false);
      const modeJump = S.mode !== 'web' || MODES.includes(id) || id.startsWith('video-');
      try { if (modeJump) history.pushState(null, '', `#${id}`); else history.replaceState(null, '', `#${id}`); } catch (err) { /* 주소를 못 바꿔도 화면은 바꾼다 */ }
      if (modeJump) route(id, true); else goTo(id, false);
      return;
    }
  }
  const sk = e.target.closest('[data-seek]');
  if (sk) { seekTo(sk.dataset.seek, true); try { history.replaceState(null, '', `#video-${sk.dataset.seek}`); } catch (err) { /* 그만 */ } return; }
  const t = e.target.closest('[data-act],[data-ver],[data-copy],[data-cat]');
  if (!t) { if (!e.target.closest('.g-tools')) togglePop(false); return; }
  if (t.dataset.cat) { S.faqCat = t.dataset.cat; document.querySelectorAll('.faq-cats button').forEach((b) => b.classList.toggle('on', b.dataset.cat === S.faqCat)); filterFaq(); return; }
  if (t.dataset.ver) { closeLog(); togglePop(false); setVersion(t.dataset.ver); return; }
  if (t.dataset.copy) { copyText(t.dataset.copy, t); return; }
  if (t.dataset.act === 'log') openLog();
  else if (t.dataset.act === 'close') closeLog();
  else if (t.dataset.act === 'latest') setVersion(GUIDE.latest().v);
});
/* 번호 설명에 올리면 그림의 같은 번호가 커진다 */
const pinHot = (e, on) => { const li = e.target.closest('.legend li[data-pin]'); if (!li) return; const fig = li.closest('[data-shot]'); const pin = fig && fig.querySelector(`.shot-pin[data-pin="${li.dataset.pin}"]`); li.classList.toggle('hot', on); if (pin) pin.classList.toggle('hot', on); };
document.addEventListener('mouseover', (e) => pinHot(e, true));
document.addEventListener('mouseout', (e) => pinHot(e, false));
$('verBtn').addEventListener('click', (e) => { e.stopPropagation(); togglePop(); });
$('themeBtn').addEventListener('click', toggleTheme);
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeLog(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('modal').hidden) closeLog(); togglePop(false); } });
document.addEventListener('input', (e) => { if (e.target.id === 'faqQ') filterFaq(); });
window.addEventListener('hashchange', () => fromHash(false));
window.addEventListener('popstate', () => fromHash(true));
let spyRaf = 0;
window.addEventListener('scroll', () => { if (spyRaf) return; spyRaf = requestAnimationFrame(() => { spyRaf = 0; syncSpy(false); }); }, { passive: true });
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); } catch (e) { /* 옛 브라우저 */ }
const syncH = () => { document.documentElement.style.setProperty('--gnb-h', `${$('gnb').offsetHeight}px`); if (!$('secnav').hidden && $('secnav').offsetHeight) document.documentElement.style.setProperty('--nav-h', `${$('secnav').offsetHeight}px`); };
try { new ResizeObserver(syncH).observe($('gnb')); } catch (e) { window.addEventListener('resize', syncH); }

/* ---------- 시작 ---------- */
try { const th = localStorage.getItem(THEME_KEY); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th; } catch (e) { /* 저장소를 못 쓰면 기기 설정을 따른다 */ }
let want = '';
try { want = new URLSearchParams(location.search).get('v') || ''; } catch (e) { want = ''; }
S.rel = GUIDE.get(want) || GUIDE.latest();
/* FAQ — 커뮤니티 · 고객센터와 같은 목록(faq.json, 웹 빌드 때 앱 FAQ 에서 뽑는다). 받은 뒤 그린다 — 못 받으면 빈 목록으로 그리고 문의하기 안내가 뜬다 */
/* 새로고침해도 본문이 사라졌다 나타나지 않게(2026-11-03) — 예전엔 faq.json 을 받은 뒤에야 본문 전체를 그려, 받는 동안 화면이 비었다.
   이제 본문은 바로 그린다. FAQ 는 지난번 받아 둔 목록(이 브라우저)으로 먼저 채우고, 새 목록이 다르면 그때 다시 그린다(보던 자리는 그대로).
   보던 스크롤 자리도 이 탭이 열려 있는 동안 남겼다가 되살린다 */
const FAQ_KEY = 'guide.faq'; const POS_KEY = 'guide.pos';
const setFaq = (list) => { if (Array.isArray(list)) GUIDE.list.forEach((rel) => { rel.content.faq = list.map((f) => ({ ...f })); }); };
let faqSeen = '';
try { faqSeen = localStorage.getItem(FAQ_KEY) || ''; if (faqSeen) setFaq(JSON.parse(faqSeen)); } catch (e) { faqSeen = ''; }
try { history.scrollRestoration = 'manual'; } catch (e) { /* 그만 */ }
addEventListener('pagehide', () => { try { sessionStorage.setItem(POS_KEY, JSON.stringify({ hash: location.hash, y: Math.round(window.scrollY) })); } catch (e) { /* 그만 */ } });
const start = () => {
  paintTheme(); syncH(); render(); fromHash(true);
  let pos = null; try { pos = JSON.parse(sessionStorage.getItem(POS_KEY) || 'null'); } catch (e) { pos = null; }
  requestAnimationFrame(() => {
    if (S.mode === 'web') fromHash(true);
    if (pos && pos.hash === location.hash && pos.y > 0) window.scrollTo(0, pos.y);   /* 새로고침 — 보던 자리 그대로 */
  });
};
start();
fetch('faq.json', { cache: 'no-cache' })
  .then((r) => (r.ok ? r.text() : ''))
  .then((txt) => {
    if (!txt || txt === faqSeen) return;   /* 그대로면 다시 그리지 않는다 */
    let list; try { list = JSON.parse(txt); } catch (e) { return; }
    if (!Array.isArray(list)) return;
    try { localStorage.setItem(FAQ_KEY, txt); } catch (e) { /* 그만 */ }
    setFaq(list);
    const y = window.scrollY; render(); window.scrollTo(0, y);   /* FAQ 만 바뀌어도 보던 자리는 그대로 */
  })
  .catch(() => {});
})();
</script>

</body></html>
