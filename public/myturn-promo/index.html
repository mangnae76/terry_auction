<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이턴옥션 플랫폼 소개 영상</title>
<style>
  /* the film draws its text with these exact faces; subset to the characters it uses (SIL OFL 1.1) */
  @font-face { font-family: 'Noto Sans CJK KR'; src: url('inline/403d209a3be867c7.woff2') format('woff2'); font-weight: 700; font-display: block; }
  @font-face { font-family: 'Noto Sans CJK KR'; src: url('inline/2f6517ef706ef859.woff2') format('woff2'); font-weight: 900; font-display: block; }
  @font-face { font-family: 'Noto Sans Mono CJK KR'; src: url('inline/0abaf6b67b7be77a.woff2') format('woff2'); font-weight: 700; font-display: block; }

  html, body { margin: 0; height: 100%; background: #0B1226; overflow: hidden; }
  body { display: grid; place-items: center; font-family: 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  /* everything inside scales with the player width (cqw = 1% of it) */
  .mtp { container-type: inline-size; position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #0B1226; overflow: hidden; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
  .mtp canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .mtp .poster { position: absolute; inset: 0; background: #0B1226 center / cover no-repeat; }
  .mtp.started .poster { display: none; }
  .mtp .cover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11, 18, 38, .45); transition: opacity .25s; }
  .mtp .big { display: grid; justify-items: center; gap: max(8px, 1.3cqw); color: #fff; font-weight: 900; font-size: max(12px, 1.7cqw); letter-spacing: -.02em; text-shadow: 0 .15cqw .8cqw rgba(0,0,0,.45); }
  .mtp .big i { width: max(46px, 7.4cqw); aspect-ratio: 1; border-radius: 50%; background: #F07900; box-shadow: 0 .8cqw 2.4cqw rgba(240,121,0,.45); display: grid; place-items: center; transition: transform .15s; }
  .mtp .big i svg { width: 42%; margin-left: 8%; fill: #fff; }
  .mtp:hover .big i, .mtp:focus-visible .big i { transform: scale(1.06); }
  /* before the first play: a pill button in the poster's empty lower-left corner, under the feature pills */
  .mtp:not(.started) .cover { background: none; place-items: end start; padding: 0 0 4.1cqw 6.25cqw; }
  .mtp:not(.started) .big { grid-auto-flow: column; align-items: center; gap: max(6px, .9cqw); padding: max(4px, .5cqw) max(12px, 1.9cqw) max(4px, .5cqw) max(4px, .5cqw); font-size: max(11px, 1.7cqw); border-radius: 99cqw; background: #F07900; box-shadow: 0 .6cqw 2cqw rgba(240,121,0,.35); text-shadow: none; transition: transform .15s, background .15s; }
  .mtp:not(.started) .big i { width: max(20px, 2.9cqw); background: #fff; box-shadow: none; }
  .mtp:not(.started) .big i svg { fill: #F07900; }
  .mtp:not(.started):hover .big, .mtp:not(.started):focus-visible .big { background: #FF8A14; transform: translateY(-.15cqw); }
  .mtp:not(.started):hover .big i { transform: none; }
  /* at the end: leave the logo + CTA frame clear, small replay pill in the lower-right corner */
  .mtp.ended .cover { background: none; place-items: end end; padding: 0 2.4cqw 2.4cqw 0; }
  .mtp.ended .big { grid-auto-flow: column; align-items: center; gap: max(6px, .8cqw); padding: max(4px, .45cqw) max(12px, 1.6cqw) max(4px, .45cqw) max(4px, .45cqw); border-radius: 99cqw; background: rgba(20, 33, 61, .88); font-size: max(11px, 1.4cqw); text-shadow: none; }
  .mtp.ended .big i { width: max(20px, 2.5cqw); box-shadow: none; }
  .mtp.ended:hover .big { background: #14213D; }
  .mtp .bar { position: absolute; left: 0; right: 0; bottom: 0; height: .3cqw; min-height: 3px; background: rgba(255,255,255,.18); opacity: 0; transition: opacity .25s; }
  .mtp .bar b { display: block; height: 100%; width: 0; background: #F07900; }
  .mtp .snd { position: absolute; top: 1.5cqw; right: 1.5cqw; width: 3cqw; min-width: 28px; aspect-ratio: 1; border: 0; border-radius: 50%; background: rgba(11,18,38,.55); color: #fff; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .25s; padding: 0; }
  .mtp .snd svg { width: 55%; }
  .mtp.playing .cover { opacity: 0; pointer-events: none; }
  .mtp.playing:hover .bar, .mtp.paused .bar, .mtp.playing:hover .snd, .mtp.paused .snd { opacity: 1; }
  .mtp.loading .big span::after { content: ' · 불러오는 중'; font-weight: 700; opacity: .8; }
  /* 재생 전 — 화면 한가운데 큰 ▶ (영상인 줄 바로 알게, 2026-11-03). 누르면 어디를 눌러도 재생되므로 그림만 */
  .mtp .mid { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .mtp .mid i { width: max(56px, 9cqw); aspect-ratio: 1; border-radius: 50%; background: rgba(240, 121, 0, .94); box-shadow: 0 .8cqw 2.6cqw rgba(0, 0, 0, .35), 0 0 0 max(4px, .5cqw) rgba(255, 255, 255, .35); display: grid; place-items: center; transition: transform .15s; }
  .mtp .mid i svg { width: 40%; margin-left: 8%; fill: #fff; }
  .mtp:hover .mid i, .mtp:focus-visible .mid i { transform: scale(1.07); }
  .mtp.started .mid, .mtp.hero .mid { display: none; }
  /* 대문 모드(?mode=hero) — 바로 재생 · 계속 되풀이. 썸네일 · 재생 단추 · 진행 막대 · 소리 단추는 감추고(소리는 바깥 대문이 켜고 끈다) */
  .mtp.hero .poster, .mtp.hero .cover, .mtp.hero .bar, .mtp.hero .snd { display: none !important; }
  .mtp.hero { cursor: default; }
</style>
