<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이턴옥션</title>
<!-- 로그인 창은 웹과 같은 앱 로그인 화면(LoginPage)을 그대로 띄운다 — 웹 묶음(pdfparse)을 누를 때 불러온다 -->
<link rel="stylesheet" href="/web/pdfparse.css">
<style>
  /* 대문 — 들어오자마자 소개 영상이 소리와 함께 첫 화면 전체에서 계속 되풀이된다.
     오른쪽 위: 사운드 ON/OFF · 로그인. 한 바퀴 돌면(또는 화면을 누르면) 로그인 창 */
  :root { --navy: #0B1226; --blue: #2b6df3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--navy); font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; }
  .stage iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--navy); }
  /* 단추는 영상 안쪽 오른쪽 위에 — 창 비율이 16:9 가 아니면(맥 16:10 등) 영상 위아래 · 좌우에 빈 띠가 생기니
     영상 테두리에서 24px 안으로 잡는다. --fit = 창 안에 들어가는 영상 폭 */
  /* 영상은 16:9 그대로(늘리지 않는다) — 창 비율이 다르면 위아래나 양옆에 남색 띠가 생기니 단추는 영상 테두리에서 24px 안 */
  :root { --fit: min(100vw, calc(100vh * 16 / 9)); --edge-t: calc((100vh - var(--fit) * 9 / 16) / 2); --edge-r: calc((100vw - var(--fit)) / 2); }
  .bar { position: fixed; top: calc(var(--edge-t) + 24px); right: calc(var(--edge-r) + 24px); z-index: 20; display: flex; gap: 8px; }
  /* 두 단추 같은 모양 · 같은 높이 — 속이 비친 알약 테두리만(영상을 가리지 않게), 올리면 살짝 채운다 */
  .bar button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; width: 120px; padding: 0 10px; white-space: nowrap;
    border-radius: 999px; border: 1.5px solid #8a94a6; background: transparent; color: #8a94a6;
    font: inherit; font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer; 
    transition: background .15s, border-color .15s;
  }
  /* 평소엔 회색 테두리 · 회색 글자(영상 바탕이 흰 장면에서도 보이게), 올리면 회색으로 채우고 흰 글자 */
  .bar button:hover { color: #fff; background: #8a94a6; border-color: #8a94a6; }
  /* 한글 글꼴은 위쪽 여백이 커 가운데 맞춤이어도 글자가 떠 보인다 — 1px 내려 알약 세로 가운데에 */
  .bar button span { position: relative; top: 1px; }
  /* 브라우저가 소리 자동재생을 막았을 때 — 사운드 단추 아래 작은 안내 */
  .hint { position: fixed; top: calc(var(--edge-t) + 64px); right: calc(var(--edge-r) + 24px); z-index: 5; padding: 6px 12px; border-radius: 8px; background: rgba(11, 18, 38, .7); color: rgba(255, 255, 255, .85); font-size: 13px; font-weight: 600; pointer-events: none; }
  .hint[hidden] { display: none; }
  .bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .bar svg { width: 15px; height: 15px; }
  /* 로그인 창 — 웹의 앱 로그인 창과 같은 틀 */
  /* 뒤 영상은 계속 돌되 뿌옇게 — 로그인 카드에 눈이 가게 */
  .veil { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(5, 10, 24, .45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .veil[hidden] { display: none; }
  /* 로그인 — 웹의 로그인 창과 같게 하얀 카드만(앱 로그인 화면의 파란 바탕 · 스크롤 틀은 걷어낸다) */
  .modal { position: relative; width: min(366px, calc(100% - 32px)); }
  .modal .lp-shell { min-height: 0 !important; background: none !important; padding: 0 !important; overflow: visible !important; }
  .modal .lp-card { max-width: none !important; box-shadow: 0 24px 60px rgba(0, 0, 0, .35) !important; }
  .modal .x { position: absolute; top: 10px; right: 10px; z-index: 2; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; font-size: 20px; line-height: 1; color: #6b7280; cursor: pointer; }
  .modal .x:hover { background: #f3f4f6; color: #111827; }
  /* 가벼운 로그인 창 — 앱 LoginPage 의 카드와 같은 값 */
  .ql-card { background: #fff; border-radius: 16px; padding: 20px 22px 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); display: flex; flex-direction: column; gap: 8px; font-family: inherit; }
  .ql-brand { text-align: center; margin-bottom: 6px; }
  .ql-brand img { height: 60px; width: auto; }
  .ql-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #374151; font-weight: 600; }
  .ql-field input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; font-size: 14px; color: #111827; outline: none; background: #fff; }
  .ql-field input:focus { border-color: #2b6df3; box-shadow: 0 0 0 3px rgba(43, 109, 243, .15); }
  .ql-pw { position: relative; display: block; }
  .ql-pw input { padding-right: 42px; }
  .ql-eye { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 14px; opacity: .55; }
  .ql-eye:hover { opacity: 1; background: #f3f4f6; }
  .ql-err { margin: 0; font-size: 12px; color: #dc2626; }
  .ql-submit { width: 100%; height: 44px; border: 0; border-radius: 10px; background: #1f3a72; color: #fff; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
  .ql-submit:disabled { background: #9ca3af; cursor: wait; }
  .ql-submit.ghost { margin-top: -4px; background: #fff; color: #1f3a72; border: 1px solid #c7d0e4; }
  .ql-sep { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #9ca3af; }
  .ql-sep::before, .ql-sep::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
  .ql-social { width: 100%; height: 44px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
  .ql-social.kakao { background: #fee500; color: #191919; }
  .ql-opts { display: flex; justify-content: space-evenly; margin-top: 2px; }
  .ql-opts label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #4b5563; cursor: pointer; }
  .ql-opts input { width: 15px; height: 15px; margin: 0; accent-color: #1f3a72; }
  .ql-links { margin: 0; display: flex; justify-content: space-between; align-items: center; white-space: nowrap; padding: 0 2px; }
  .ql-links button { border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; color: #9ca3af; }
  .ql-links button:hover { color: #4b5563; text-decoration: underline; }
  .ql-links .ql-signup { color: #2b6df3; }
  .ql-links i { font-style: normal; font-size: 11px; color: #cbd2de; }
  .modal .wait { margin: 0; padding: 60px 0; border-radius: 16px; background: #fff; text-align: center; color: #6b7280; font-size: 15px; }
</style>
</head>
<body>
  <nav class="bar" aria-label="대문 단추">
    <button type="button" id="snd" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path id="sndOn" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path id="sndOff" d="m22 9-6 6m0-6 6 6" style="display:none"/></svg><span>사운드 ON</span>
    </button>
    <button type="button" class="login" id="loginBtn"><span>로그인</span></button>
  </nav>
  <p class="hint" id="hint" hidden>화면을 한 번 누르면 소리가 나요</p>
  <main class="stage">
    <iframe id="promo" src="/myturn-promo/index.html?mode=hero" title="마이턴 옥션 소개 영상" allow="autoplay; fullscreen"></iframe>
  </main>
  <div class="veil" id="veil" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="로그인">
      <button type="button" class="x" id="closeLogin" aria-label="닫기">×</button>
      <!-- 가벼운 로그인 창 — 누르면 바로 뜬다(앱 로그인 화면과 같은 모양). 무거운 로그인 묶음은 '로그인'을 누를 때 쓴다 -->
      <form class="ql-card" id="quickLogin" autocomplete="on">
        <div class="ql-brand"><img src="/myturn-promo/media/logo_gray.png" alt="MYTURN AUCTION" /></div>
        <label class="ql-field"><span>회원 아이디</span><input id="qlId" type="email" autocomplete="email" placeholder="example@email.com" required /></label>
        <label class="ql-field"><span>비밀번호</span>
          <span class="ql-pw"><input id="qlPw" type="password" autocomplete="current-password" placeholder="6자 이상" required /><button type="button" class="ql-eye" id="qlEye" aria-label="비밀번호 보기">👁</button></span>
        </label>
        <p class="ql-err" id="qlErr" hidden></p>
        <button type="submit" class="ql-submit" id="qlSubmit">로그인</button>
        <div class="ql-sep"><span>또는</span></div>
        <button type="button" class="ql-social kakao" id="qlKakao">카카오로 시작하기</button>
        <div class="ql-opts">
          <label><input type="checkbox" id="qlSave" />아이디 저장</label>
          <label><input type="checkbox" id="qlKeep" />로그인 유지</label>
        </div>
        <p class="ql-links"><button type="button" data-full>아이디 찾기</button><i>·</i><button type="button" data-full>비밀번호 찾기</button><i>·</i><button type="button" data-full>무료체험</button><i>·</i><button type="button" id="qlSignup" class="ql-signup">회원가입</button></p>
      </form>
      <div id="loginMount" hidden><p class="wait">불러오는 중입니다…</p></div>
    </div>
  </div>
  <script>
    // 이 탭에서 대문을 한 번 봤다 — /web 으로 가면 다시 대문으로 돌려보내지 않는다
    try { sessionStorage.setItem('ta.intro.seen', '1'); } catch (e) { /* 그만 */ }
    const frame = document.getElementById('promo');
    const sndBtn = document.getElementById('snd');
    const veil = document.getElementById('veil');
    const promo = () => frame.contentWindow && frame.contentWindow.MYTURN_PROMO;

    // ===== 사운드 — 처음부터 ON. 브라우저가 소리 자동재생을 막았어도 단추는 ON 그대로 두고, 화면 어디든 처음 누를 때 소리를 낸다 =====
    let muted = false;
    let blocked = false;   // 자동재생이 막혀 꺼진 상태
    const paintSnd = () => {
      sndBtn.setAttribute('aria-pressed', String(!muted));
      sndBtn.querySelector('span').textContent = muted ? '사운드 OFF' : '사운드 ON';
      document.getElementById('sndOn').style.display = muted ? 'none' : '';
      document.getElementById('sndOff').style.display = muted ? '' : 'none';
    };
    const hint = document.getElementById('hint');
    const setMuted = (m) => { muted = m; blocked = false; hint.hidden = true; const p = promo(); if (p && p.setMuted) p.setMuted(m); paintSnd(); };
    // 막혀 있던 중에 단추를 누르면 그 뜻은 'OFF' — 이미 소리가 안 나니 표시만 OFF 로
    sndBtn.addEventListener('click', () => setMuted(blocked ? true : !muted));
    const wakeSound = () => { if (blocked) setMuted(false); };
    document.addEventListener('pointerdown', (e) => { if (!sndBtn.contains(e.target)) wakeSound(); }, true);
    document.addEventListener('keydown', wakeSound, true);

    // ===== 로그인 — 웹과 같은 앱 로그인 화면 =====
    let T = null; let unmount = null;
    const loadBundle = () => new Promise((ok, no) => {
      if (window.TAPdf) { ok(window.TAPdf); return; }
      const s = document.createElement('script'); s.src = '/web/pdfparse.js';
      s.onload = () => (window.TAPdf ? ok(window.TAPdf) : no(new Error('묶음을 못 읽었습니다')));
      s.onerror = () => no(new Error('묶음을 못 불러왔습니다'));
      document.head.appendChild(s);
    });
    // 로그인 창이 뜨면 소리를 끈다(영상은 계속) — 닫으면 소리가 켜져 있던 경우에만 다시 켠다
    let soundBeforeLogin = null;
    const closeLogin = () => {
      if (veil.hidden) return;
      veil.hidden = true;
      if (unmount) { try { unmount(); } catch (e) { /* 그만 */ } unmount = null; }
      if (soundBeforeLogin === true && muted) setMuted(false);
      soundBeforeLogin = null;
    };
    // 대문이 뜨자마자 로그인 묶음을 미리 받아 둔다 — 누른 뒤에 3MB 를 받으면 한참 반응이 없어 보였다.
    // 단추는 늘 '로그인' — 누르면 로그인 창이 뜬다(이미 로그인해 있어도 창부터)
    const ready = (async () => {
      if (!T) { T = await loadBundle(); T.startStores(); T.useAuthStore().initialize(); }
      const auth = T.useAuthStore();
      if (!auth.ready && auth.waitUntilReady) await auth.waitUntilReady();
      return auth;
    })();
    ready.catch(() => { /* 누를 때 다시 해 본다 */ });
    // ===== 가벼운 로그인 창 — 누르면 바로 뜬다. 묶음(로그인 처리)은 '로그인'을 누를 때 쓴다(대문이 뜰 때 미리 받아 두므로 대개 이미 와 있다) =====
    const $q = (id) => document.getElementById(id);
    const quick = $q('quickLogin');
    const SAVED_ID_KEY = 'myturn.login.savedId';   // 앱 로그인 화면과 같은 열쇠
    const KEEP_KEY = 'myturn.login.keep';
    const readLocal = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
    const writeLocal = (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { /* 그만 */ } };
    $q('qlId').value = readLocal(SAVED_ID_KEY);
    $q('qlSave').checked = !!readLocal(SAVED_ID_KEY);
    $q('qlKeep').checked = readLocal(KEEP_KEY) !== '0';
    $q('qlEye').addEventListener('click', () => { const i = $q('qlPw'); i.type = i.type === 'password' ? 'text' : 'password'; });
    $q('qlSignup').addEventListener('click', () => { location.href = '/signup'; });
    const showErr = (t) => { const e = $q('qlErr'); e.textContent = t || ''; e.hidden = !t; };
    const busy = (on) => { ['qlSubmit', 'qlKakao'].forEach((id) => { $q(id).disabled = on; }); $q('qlSubmit').textContent = on ? '로그인 중…' : '로그인'; };
    const authNow = async () => {
      try { return await ready; } catch (e) {
        if (!T) { T = await loadBundle(); T.startStores(); T.useAuthStore().initialize(); }
        const a = T.useAuthStore();
        if (!a.ready && a.waitUntilReady) await a.waitUntilReady();
        return a;
      }
    };
    /** 로그인 공통 — 유지 방식 정하고, 들어갈 수 있는 계정인지 보고, 웹으로 */
    const doLogin = async (how) => {
      showErr(''); busy(true);
      try {
        const auth = await authNow();
        writeLocal(KEEP_KEY, $q('qlKeep').checked ? '' : '0');
        if (T.setLoginPersistence) await T.setLoginPersistence($q('qlKeep').checked);
        const profile = await how(auth);
        if (!profile) return;
        if (T.isAllowedEmail && !T.isAllowedEmail(profile.email)) { await auth.logout(); showErr('이 계정은 사용 권한이 없습니다.'); return; }
        location.href = '/web?login=1';   // 로그인 끝 — 선정목록으로
      } catch (e) {
        const a = T && T.useAuthStore ? T.useAuthStore() : null;
        showErr((a && a.error) || '로그인하지 못했습니다 — 다시 시도해 주세요.');
      } finally { busy(false); }
    };
    quick.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const id = $q('qlId').value.trim(); const pw = $q('qlPw').value;
      if (!id || !pw) { showErr('이메일과 비밀번호를 입력해 주세요.'); return; }
      void doLogin(async (auth) => {
        const p = await auth.login(id, pw);
        writeLocal(SAVED_ID_KEY, $q('qlSave').checked ? id : '');
        return p;
      });
    });
    $q('qlKakao').addEventListener('click', () => {
      void doLogin(async (auth) => {
        if (T.isKakaoLoginConfigured && !T.isKakaoLoginConfigured()) { showErr('카카오 로그인이 아직 준비되지 않았습니다.'); return null; }
        return auth.loginWithKakao();
      });
    });
    // 아이디 찾기 · 비밀번호 찾기 · 무료체험 — 앱 로그인 화면(그 창들이 다 들어 있다)으로 바꿔 띄운다
    quick.querySelectorAll('[data-full]').forEach((b) => b.addEventListener('click', async () => {
      const el = $q('loginMount');
      quick.hidden = true; el.hidden = false;
      try {
        await authNow();
        el.innerHTML = '';
        unmount = T.mountAppLogin(el, (what) => {
          if (what === 'signup') { location.href = '/signup'; return; }
          location.href = '/web?login=1';
        });
      } catch (e) {
        el.innerHTML = '<p class="wait">불러오지 못했습니다 — 새로고침 뒤 다시 눌러 주세요.</p>';
      }
    }));
    const openLogin = () => {
      if (!veil.hidden) return;
      veil.hidden = false;
      quick.hidden = false; $q('loginMount').hidden = true;
      soundBeforeLogin = !muted && !blocked;
      if (!muted) setMuted(true);
      showErr('');
      setTimeout(() => { ($q('qlId').value ? $q('qlPw') : $q('qlId')).focus(); }, 0);
    };
    document.getElementById('loginBtn').addEventListener('click', openLogin);
    document.getElementById('closeLogin').addEventListener('click', closeLogin);
    veil.addEventListener('click', (e) => { if (e.target === veil) closeLogin(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLogin(); });

    // 영상이 알려 오는 것 — 소리가 막혔음 · 한 바퀴 돌았음 · 화면을 눌렀음
    let looped = false;
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.type === 'myturn-promo:muted') { blocked = true; hint.hidden = false; }   // 단추는 ON 그대로 — 첫 손길에 소리를 낸다
      if (e.data.type === 'myturn-promo:click') { wakeSound(); }
      if (e.data.type === 'myturn-promo:loop' && !looped) { looped = true; openLogin(); }
    });
  </script>
</body>
</html>
