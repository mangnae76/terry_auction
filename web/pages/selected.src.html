    if (e.key === 'Enter' && e.target.id === 'regNo') submitRegister();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('rg-empty')) { e.preventDefault(); $('pdfInput').click(); }
    if (e.key === 'Enter' && (e.target.id === 'loginPw' || e.target.id === 'loginEmail')) { e.preventDefault(); document.querySelector('[data-act="login-submit"]').click(); }
    if (e.key === 'Enter' && e.target.id === 'favUrl') { e.preventDefault(); document.querySelector('[data-act="fav-add"]').click(); }
    if (e.key === 'Enter' && e.target.id === 'favEditUrl') { e.preventDefault(); document.querySelector('[data-act="fav-save"]').click(); }
    if (e.key === 'Enter' && e.target.id === 'aiKeyIn') { e.preventDefault(); document.querySelector('[data-act="ai-save"]').click(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.rg-item.ready')) { e.preventDefault(); e.target.click(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card, tr[data-act="card"]')) { e.preventDefault(); e.target.click(); }
  });
  /* 말풍선 자리 — 어느 화면·어느 자리든, 위쪽에 붙어 있는 틀(머리띠 · 하위 탭 줄 · 필터/고정 카드)에 가리면 아래로 띄운다.
     천장 = 이 단추보다 위에 있는 붙은 틀들의 아랫선 (단추를 품은 틀은 빼고) */
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest('[data-tip]');
    if (!el || el.dataset.tipPos === 'below') return;
    const top = el.getBoundingClientRect().top;
    let ceiling = 0;
    document.querySelectorAll('.gnb, .subtabs, .toolbar-shell').forEach((bar) => {
      if (bar.hidden || !bar.offsetParent || bar.contains(el)) return;
      const r = bar.getBoundingClientRect();
      if (r.bottom <= top + 1) ceiling = Math.max(ceiling, r.bottom);
    });
    el.classList.toggle('tip-below', top - 40 < ceiling);
  });
  /* 표 안 말풍선 — 맨 위층에 띄워 표 상자에 잘리지 않게. 주소처럼 data-tip-trunc 가 붙은 칸은 글이 잘렸을 때만 */
  const tipFloat = document.createElement('div'); tipFloat.className = 'tip-float'; tipFloat.setAttribute('role', 'tooltip'); document.body.appendChild(tipFloat);
  const hideTipFloat = () => tipFloat.classList.remove('on');
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest('.table-wrap [data-tip]');
    if (!el || (el.hasAttribute('data-tip-trunc') && el.scrollWidth <= el.clientWidth)) { hideTipFloat(); return; }
    tipFloat.textContent = el.dataset.tip;
    const r = el.getBoundingClientRect(); const w = tipFloat.offsetWidth; const h = tipFloat.offsetHeight;
    let ceiling = 0;
    document.querySelectorAll('.gnb, .subtabs, .toolbar-shell').forEach((bar) => { if (bar.hidden || !bar.offsetParent) return; const b = bar.getBoundingClientRect(); if (b.bottom <= r.top + 1) ceiling = Math.max(ceiling, b.bottom); });
    const x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
    const y = r.top - h - 7 < ceiling ? r.bottom + 7 : r.top - h - 7;
    tipFloat.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    tipFloat.classList.add('on');
  });
  window.addEventListener('scroll', hideTipFloat, true);
  /* 별 미리보기 — 마우스를 올린 별까지 미리 칠해 보인다 */
  document.addEventListener('mouseover', (e) => {
    const star = e.target.closest('.star'); const wrapEl = e.target.closest('.stars');
    if (star && wrapEl) { wrapEl.classList.add('preview'); wrapEl.querySelectorAll('.star').forEach((s) => s.classList.toggle('p', Number(s.dataset.n) <= Number(star.dataset.n))); }
  });
  document.addEventListener('mouseout', (e) => {
    const wrapEl = e.target.closest('.stars');
    if (wrapEl && !wrapEl.contains(e.relatedTarget)) { wrapEl.classList.remove('preview'); wrapEl.querySelectorAll('.star').forEach((s) => s.classList.remove('p')); }
  });
  /* 파싱결과 상자에 PDF 끌어다 놓기 */
  document.addEventListener('dragover', (e) => { const d = e.target.closest('#rgDrop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { const d = e.target.closest('#rgDrop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
  document.addEventListener('drop', (e) => { const d = e.target.closest('#rgDrop'); if (!d) return; e.preventDefault(); d.classList.remove('over'); const fs = [...((e.dataTransfer && e.dataTransfer.files) || [])]; if (fs.length) parseFiles(fs); });
  document.addEventListener('dragover', (e) => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { const d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', (e) => { const d = e.target.closest('#drop'); if (!d) return; e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) { S.modal.file = f.name; renderModal(); } });

  /* 붙었을 때 그림자 — 선정물건 · 선정물건등록 두 상자 모두. 하위 탭이 있으면 탭 줄 높이만큼 아래에서 붙는다 */
  /* 붙었을 때 그림자 — 틀 고정 모듈과 짝. 상자가 제 고정 자리(top)에 닿았으면 붙은 것이다 (화면·머리 높이와 상관없이) */
  const markStuck = () => document.querySelectorAll('.toolbar-shell').forEach((shell) => {
    if (!shell.offsetParent) return;
    const top = parseFloat(getComputedStyle(shell).top);
    shell.classList.toggle('stuck', getComputedStyle(shell).position === 'sticky' && window.scrollY > 0 && Math.abs(shell.getBoundingClientRect().top - top) < 1);
  });
  /* 틀 고정 높이 — 머리띠·하위 탭 줄의 실제 높이를 변수에 적는다 (좁은 화면에서 머리띠가 두 줄이 돼도 맞게) */
  const syncStickTop = () => {
    const g = document.querySelector('.gnb'); const sub = $('subTabs');
    if (g) document.documentElement.style.setProperty('--gnb-h', `${g.offsetHeight}px`);
    if (sub && !sub.hidden) document.documentElement.style.setProperty('--subtab-h', `${sub.offsetHeight}px`);
    /* 물건상세 위 고정 상자(사건 요약) 높이 — 그 아래에 붙는 것(예상수익분석 제목 · A~D 칩)이 이 값만큼 더 내려 선다 */
    const shell = document.querySelector('.item-shell');
    if (shell && shell.offsetParent) document.documentElement.style.setProperty('--item-shell-h', `${shell.offsetHeight}px`);
  };
  syncStickTop();
  try { new ResizeObserver(syncStickTop).observe(document.querySelector('.gnb')); } catch (e) { window.addEventListener('resize', syncStickTop); }
  window.addEventListener('scroll', markStuck, { passive: true });
  window.addEventListener('scroll', syncStickTop, { passive: true });
  window.addEventListener('resize', markStuck);
  window.addEventListener('scroll', () => { if (S.menu) { S.menu = null; render(); } }, { passive: true });
  window.addEventListener('resize', () => { fitCourts(); if (S.menu) { S.menu = null; render(); } });
  try { document.fonts && document.fonts.ready.then(fitCourts); } catch { /* 글꼴 대기 없이도 된다 */ }
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderHeader); } catch { /* 옛 브라우저 */ }

  /* ---------- 떠 있는 등록 단추 — 끌어서 옮기기 ---------- */
  const FAB_KEY = 'wlp.web.fab';
  const fab = $('fab');
  /* 움직일 수 있는 울타리 — 가로는 가운데 1280 내용 칸 안, 세로는 머리띠 아래 ~ 화면 바닥 */
  const fabBounds = () => {
    const c = $('content'); const r = c.getBoundingClientRect(); const cs = getComputedStyle(c);
    const minX = r.left + parseFloat(cs.paddingLeft); const maxX = r.right - parseFloat(cs.paddingRight) - fab.offsetWidth;
    /* 위로는 남색 머리띠 아래까지만 — 머리띠 밑으로 숨어 못 잡게 되는 일이 없도록 */
    const minY = document.querySelector('.gnb').offsetHeight + 8;
    return { minX, maxX: Math.max(minX, maxX), minY, maxY: Math.max(minY, window.innerHeight - fab.offsetHeight - 8) };
  };
  const placeFab = (x, y) => {
    const b = fabBounds();
    const cx = Math.round(Math.min(Math.max(b.minX, x), b.maxX)); const cy = Math.round(Math.min(Math.max(b.minY, y), b.maxY));
    fab.style.left = `${cx}px`; fab.style.top = `${cy}px`; fab.style.bottom = 'auto';
    return { x: cx, y: cy };
  };
  const resetFab = () => { fab.style.left = ''; fab.style.top = ''; fab.style.bottom = ''; };
  const savedFab = store.get(FAB_KEY, null);
  if (savedFab && Number.isFinite(savedFab.dx) && Number.isFinite(savedFab.y)) placeFab(fabBounds().minX + savedFab.dx, savedFab.y);
  let fabDrag = null; let fabJustDragged = false;
  fab.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const r = fab.getBoundingClientRect();
    fabDrag = { dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, moved: false, id: e.pointerId };
    /* 누르는 순간부터 포인터를 붙잡는다 — 빨리 끌어 단추 밖으로 나가도 따라온다 */
    try { fab.setPointerCapture(e.pointerId); } catch { /* 못 잡아도 천천히 끌면 된다 */ }
  });
  fab.addEventListener('pointermove', (e) => {
    if (!fabDrag) return;
    if (!fabDrag.moved && Math.hypot(e.clientX - fabDrag.sx, e.clientY - fabDrag.sy) < 6) return;
    if (!fabDrag.moved) { fabDrag.moved = true; fab.classList.add('dragging'); }
    placeFab(e.clientX - fabDrag.dx, e.clientY - fabDrag.dy);
  });
  const endFabDrag = () => {
    if (!fabDrag) return;
    if (fabDrag.moved) {
      const r = fab.getBoundingClientRect();
      store.set(FAB_KEY, { dx: Math.round(r.left - fabBounds().minX), y: Math.round(r.top) });
      fabJustDragged = true;
      setTimeout(() => { fabJustDragged = false; }, 0);
    }
    fab.classList.remove('dragging'); fabDrag = null;
  };
  fab.addEventListener('pointerup', endFabDrag);
  fab.addEventListener('pointercancel', endFabDrag);
  /* 끌고 난 뒤의 클릭은 등록 창을 열지 않는다 */
  fab.addEventListener('click', (e) => { if (fabJustDragged) { e.stopImmediatePropagation(); e.preventDefault(); fabJustDragged = false; } }, true);
  fab.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (!fab.style.top) return;
    resetFab(); store.set(FAB_KEY, null); toast('등록 단추를 제자리로 돌려놨어요.', 'info');
  });
  window.addEventListener('resize', () => { const sv = store.get(FAB_KEY, null); if (fab.style.top && sv) placeFab(fabBounds().minX + sv.dx, sv.y); });

  startCloud();
  const savedTheme = store.get('wlp.web.theme', '');
  if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
  render();
})();
</script>
