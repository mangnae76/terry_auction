:root {

  --blue: #5b8cff; --blue-soft: rgba(91, 140, 255, 0.14); --cta-hover: #6a91f5;

  --foot: #0b0f18; --foot-text: #7f889b; --scrim: rgba(0, 0, 0, 0.6);

  --shadow-hover: 0 12px 26px -10px rgba(0, 0, 0, 0.7), 0 2px 6px rgba(0, 0, 0, 0.3);
  --shadow-pop: 0 16px 40px -10px rgba(0, 0, 0, 0.75);

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
/* 물건이 적어도 페이지는 1600까지 — 바닥글이 맨 아래(1600)에 붙는다 */
@media (min-width: 641px) {
  body { min-height: 1600px; display: flex; flex-direction: column; }
  body > main { flex: 1 0 auto; }
  body > .foot { flex: 0 0 auto; }
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--nav); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.wrap {
  width: 100%; max-width: calc(1280px + 64px); margin: 0 auto;
  padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px));
}

/* ================= 머리띠 — 시안의 좌표를 1280 폭 기준 비율로 옮긴다 ================= */
.gnb { background: var(--nav); color: var(--nav-text); position: relative; z-index: 40; }
.gnb-in { position: relative; height: 66px; }
.gnb a, .gnb button { color: inherit; text-decoration: none; }
/* 로고 — 머리띠 높이(66) 가운데, 시안 폭(약 133px)에 맞춘 44px 높이 */
.g-logo { position: absolute; left: -0.47%; top: 11px; display: block; }
.g-logo img { display: block; height: 44px; width: auto; transition: transform .4s cubic-bezier(.2, .9, .3, 1.4); }
.g-logo:hover img { transform: rotate(-4deg) scale(1.04); }
.g-menu {
  position: absolute; top: 32px; height: 26px; display: inline-flex; align-items: center;
  font-size: var(--menu-fs); font-weight: 700; letter-spacing: -0.3px; white-space: nowrap;
  transition: color .15s;
}
.g-menu::after {
  content: ""; position: absolute; left: -9px; right: -9px; bottom: -8px; height: 3px; border-radius: 2px 2px 0 0;
  background: var(--nav-orange); transform: scaleX(0); transition: transform .2s ease;
}
.g-menu:hover { color: #cfe0ff; }
.g-menu:hover::after { transform: scaleX(1); opacity: .55; }
.g-menu.on::after { transform: scaleX(1); opacity: 1; }
/* +물건등록이 선정목록 왼쪽 첫 자리에 들어오며 앞 메뉴 셋이 한 칸씩 밀렸다(시장정보는 비어 있던 42% 자리로) */
/* 메뉴 아홉 — 낙찰이후 · 자금관리가 시장분석 옆에 들어오며 간격을 고르게 다시 잡았다(글자 폭 + 같은 틈) */
.m0 { left: 13.75%; } .m1 { left: 21.73%; } .m2 { left: 28.90%; } .m3 { left: 36.07%; } .m3c { left: 43.24%; }
.m3d { left: 50.41%; } .m4 { left: 57.58%; } .m5 { left: 64.75%; } .m6 { left: 70.65%; }
.g-icons { position: absolute; left: 79.1%; top: 3px; display: flex; gap: 6px; }
.g-ico { position: relative; width: 24px; height: 24px; border: 0; background: transparent; padding: 0; display: grid; place-items: center; color: #fff !important; border-radius: 6px; transition: color .15s, background .15s; }
.g-ico:hover { background: rgba(255, 255, 255, 0.14); }
.g-ico svg { width: 17px; height: 17px; }
.g-ico .dot { position: absolute; top: 2px; right: 2px; width: 7px; height: 7px; border-radius: 50%; background: #ff4d4f; box-shadow: 0 0 0 1.5px var(--nav); }
.g-box {
  /* 상단 메뉴 전부의 아래 메뉴를 한 번에 펼치고 접는 단추 — 속은 비우고 흰 테두리·흰 삼각형 */
  position: absolute; left: 79.2%; top: 35px; width: 18px; height: 18px; border-radius: 2px; border: 1px solid #fff;
  background: transparent; display: grid; place-items: center; padding: 0; transition: background .15s;
}
.g-box svg { width: 8px; height: 8px; color: #fff; transition: transform .2s; }
.g-box:hover { background: rgba(255, 255, 255, 0.14); }
.g-box[aria-expanded="true"] svg { transform: rotate(180deg); }

/* 펼친 아래 메뉴 — 머리띠 바로 밑 한 띠. 칸은 위 메뉴와 같은 가로 자리에 선다 */
.g-mega { position: absolute; left: 0; right: 0; top: 100%; z-index: 39; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 14px 28px -18px rgba(15, 23, 42, 0.45); animation: pop-in .16s ease-out; }
.g-mega-in { position: relative; min-height: 232px; }
.g-col { position: absolute; top: 16px; display: grid; gap: 2px; min-width: 120px; }
.g-col a { display: block; padding: 6px 0; font-size: var(--tab-fs); color: var(--text-2); text-decoration: none; white-space: nowrap; transition: color .12s; }
.g-col a:hover { color: var(--blue); }
.g-col a.on { color: var(--blue); font-weight: 700; }
/* 둘째 줄 오른쪽 — [사람] 로그인(=로그인 뒤엔 이름) ▼ 회원가입(=로그인 뒤엔 로그아웃). 시안 좌표: 82.5% / 글자 84.9% / ▼ 90.6% / 93.75% */
.g-user { position: absolute; left: 82.5%; top: 33px; height: 24px; display: flex; align-items: center; }
.g-login {
  position: relative; height: 24px; display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent;
  padding: 0; font-size: var(--menu-fs); font-weight: 700; letter-spacing: -0.3px; white-space: nowrap;
}
/* 사람 그림 — 앱 머리글(AppMobileHeader)의 흉상 선 그림 그대로, 상자 없이 */
.g-login .pic { width: 27px; height: 24px; display: grid; place-items: center; color: #fff; transition: color .15s; }
.g-login .pic svg { width: 23px; height: 23px; }
.g-login .txt { min-width: 67px; text-align: left; transition: color .15s; }
.g-login.named .txt { color: var(--nav-name); }
.g-login:hover .txt { color: #cfe0ff; }
.g-login:hover .pic { color: #cfe0ff; }
.g-login.named:hover .txt { color: #8fdcff; }
.g-arrow { position: relative; margin-left: 4px; width: 14px; height: 24px; border: 0; padding: 0; background: transparent; display: grid; place-items: center; }
.g-arrow i { width: 0; height: 0; border-left: 4.5px solid transparent; border-right: 4.5px solid transparent; border-top: 8px solid var(--nav-orange); transition: transform .2s; }
.g-arrow:hover i { transform: translateY(2px); }
.g-arrow[aria-expanded="true"] i { transform: rotate(180deg); }
.g-out, .g-join { position: relative; margin-left: 26px; height: 24px; display: inline-flex; align-items: center; border: 0; background: transparent; padding: 0; font-size: var(--menu-fs); font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; }
.g-out:hover, .g-join:hover { color: #cfe0ff; text-decoration: underline; text-underline-offset: 4px; }
.g-pop { position: absolute; top: 64px; z-index: 50; }
.g-pop.user { left: auto; right: 0; top: 34px; }

/* 회원정보 펼침 — 앱 머리글(AppMobileHeader) '마이턴 회원정보' 메뉴와 같은 짜임, 글자만 웹 기본 크기로 */
.um { min-width: 272px; padding: 0 0 6px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-pop); overflow: hidden; animation: pop-in .14s ease-out; }
.um-head { padding: 11px 16px 9px; font-size: 13px; font-weight: 800; color: var(--um-head-text); background: var(--um-head-bg); border-bottom: 1px solid var(--um-head-line); }
.um-info { padding: 14px 16px 13px; border-bottom: 1px solid var(--surface-3); }
.um-name { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.um-badge { width: 24px; height: 24px; border-radius: 7px; background: #b5d334; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex: 0 0 auto; }
.um-name strong { font-size: 16px; font-weight: 800; }
.um-id { font-style: normal; font-size: 13px; color: #8a93a4; }
.um-facts { margin: 12px 0 0; display: grid; grid-template-columns: 104px 1fr; row-gap: 6px; column-gap: 10px; }
.um-facts dt { margin: 0; }
.um-facts dd { margin: 0; font-size: 14px; color: var(--text-2); text-align: right; }
.um-facts dd.blue { color: #2b6df3; } .um-facts dd.orange { color: #e8622a; }
.um-link { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px; border: 0; background: transparent; padding: 0; font-size: 14px; color: #2b6df3 !important; }
.um-link i { font-style: normal; font-size: 13px; transition: transform .15s; }
.um-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.um-link:hover i { transform: translateX(2px); }
.um-btn { display: block; width: 100%; text-align: left; padding: 11px 16px; border: 0; background: transparent; font-size: 15px; font-weight: 600; color: var(--text) !important; transition: background .12s; }
.um-btn:hover { background: var(--surface-2); }
.um-btn.out { color: #dc2626 !important; font-weight: 700; }
.um-sep { border-top: 1px solid var(--surface-3); margin-top: 2px; padding-top: 2px; }

[hidden] { display: none !important; }

/* ================= 도구 상자 — 시안처럼 연회색 띠 위의 흰 상자 ================= */
.toolbar-shell { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); padding: 8px 0 12px; transition: box-shadow .2s; }
/* 머리띠 오른쪽 위(로그아웃 위) — 공지·결제하기 | 알림·밤낮. 메뉴 글자(top 32) 위 빈 자리에 작게 */
.g-util { position: absolute; right: -4px; top: 2px; display: flex; align-items: center; gap: 2px; }
.g-util .u-link { height: 26px; font-size: 14px; color: rgba(255, 255, 255, 0.78) !important; }
.g-util .u-link svg, .g-util .u-ico { color: rgba(255, 255, 255, 0.78) !important; }
.g-util .u-link.pay, .g-util .u-link.pay svg { color: #9fc0ff !important; }
.g-util .u-link:hover, .g-util .u-ico:hover { background: rgba(255, 255, 255, 0.12); color: #fff !important; }
.g-util .u-link:hover svg { color: #fff !important; }
.g-util .u-ico { width: 26px; height: 26px; }
.g-util .u-ico svg { width: 16px; height: 16px; }
.g-util .u-sep { background: rgba(255, 255, 255, 0.28); height: 12px; }
.g-util .u-ico .dot { top: 4px; right: 4px; box-shadow: 0 0 0 1.5px var(--nav); }
/* 하위 탭 줄 — 참고 시안처럼 흰 띠, 아래 #D8E0EE 선으로 단을 나눈다. 밑줄은 ::after 막대(테두리는 둥근 모서리로 U자가 된다) */
/* 상위 메뉴 글자 18 · 하위 탭 글자 16 — 창이 좁아지면 @media 에서 이 두 값만 줄인다(최소 14).
   하위 탭 글자 — 물건상세(물건정보~입찰가산정) · 물건등록(자동등록 · 직접입력) 등 모든 탭 줄이 이 값 하나를 쓴다.
   창이 좁아지면 아래 @media 에서 이 값만 바꾼다 */
:root { --menu-fs: 18px; --tab-fs: 16px; --tab-px: 22px; --tab-h: 44px; } /* 하위 탭 높이도 한 값 — 시장분석 · 물건상세 하위 탭과 물건등록 탭이 같이 쓴다 */
/* 카드 안쪽 여백 — 모든 웹 카드가 이 값을 쓴다.
   --card-pad-x: 카드 테두리에서 제목까지(제목 자리는 이 값으로 고정)
   --card-inset: 제목 아래 내용을 제목보다 한 단 더 안으로 (하위로 갈수록 안쪽)
   --list-pad-l/r: 선정목록 물건 카드 · 수익률 분석 카드의 좌우 안쪽 여백 */
:root { --card-pad-x: 24px; --card-inset: 12px; --list-pad-l: 20px; --list-pad-r: 18px; }
/* 표 · 입력칸 세로 여유 — 웹 물건상세(손품조사 · 임장조사 …)의 표 칸 위아래 여백과 입력칸 높이를 이 두 값 하나로 */
:root { --tbl-py: 14px; --ctl-h: 34px; }
.it-card { padding-left: var(--card-pad-x); padding-right: var(--card-pad-x); }
.it-card > :not(.it-head) { margin-left: var(--card-inset); margin-right: var(--card-inset); }
.rg-results > :not(.rg-head) { margin-left: var(--card-inset); margin-right: var(--card-inset); }
.app-detail .adp-card { padding: 4px var(--card-pad-x) 16px !important; }
.app-detail .adp-card > :not(.adp-card-head) { margin-left: var(--card-inset); margin-right: var(--card-inset); }
/* 예상수익분석 — 제목이 고정 묶음(.adp-profit-sticky) 안에 있다. 묶음은 들이지 않고 제목 아래 것만 들인다 (다른 카드와 제목 자리 같게) */
.app-detail .adp-card > .adp-profit-sticky { margin: 0 calc(-1 * var(--card-pad-x)) !important; padding: 0 var(--card-pad-x) !important; }
.app-detail .adp-profit-head h2 .adp-profit-ico { width: 15px; height: 15px; }
.app-detail .adp-profit-sticky > :not(.adp-card-head) { margin-left: var(--card-inset); margin-right: var(--card-inset); }
/* 시장분석 — 분석 도구 화면의 '뒤로'(분석 도구 첫 화면으로)는 웹에서 감춘다 */
.app-market .adm-back { display: none !important; }
/* 시장분석 탭 공통 — 분석 도구 화면의 블루그레이 바탕을 지우고, 고르는 줄을 경로(홈 › 시장분석) 바로 아래에 붙인다 */
.app-market .adm-shell { min-height: 0 !important; background: transparent !important; }
.app-market .adm-body { padding: 0 0 40px !important; max-width: none !important; }
/* 시장분석 탭 공통 고르는 줄 — 거래량 랭킹 판과 같은 규칙: 칸·단추 높이 40 · 모서리 6, 칸 글자 16, 종류 단추 15, 단추 글자 16 */
.app-market .adm-bar :is(select.adm-input, input.adm-input, .adm-load, .adm-csv) { height: 40px !important; border-radius: 6px !important; }
.app-market .adm-bar :is(select.adm-input, input.adm-input) { font-size: 16px !important; }
.app-market .adm-bar :is(.adm-load, .adm-csv) { font-size: 16px !important; padding: 0 18px !important; min-width: 136px; white-space: nowrap; } /* 조회 · 엑셀 내려받기 같은 폭 */
.app-market .adm-bar .adm-seg { height: 40px; box-sizing: border-box; border-radius: 6px !important; align-items: center; }
.app-market .adm-bar .adm-seg-btn { font-size: 15px !important; }
.app-market .adm-bar .adm-f > small { font-size: 14px !important; }
.app-market .adm-sum { font-size: 14px !important; } .app-market .adm-sum strong { font-size: 16px !important; }
/* 지역분석 — 화면 제목 줄(제목 · 설명 · 엑셀 단추)은 웹에서 통째로 감춘다. 엑셀 내려받기는 '조회' 옆으로 옮겼다 */
.app-market:is([data-k="region"], [data-k="dong"]) .adm-top { display: none !important; }
/* 엑셀 내려받기는 조회 바로 왼쪽 — 둘이 오른쪽 끝에 붙어 선다 */
.app-market:is([data-k="region"], [data-k="dong"]) .adm-csv-bar { margin-left: auto !important; }
.app-market:is([data-k="region"], [data-k="dong"]) .adm-csv-bar + .adm-load { margin-left: 0 !important; }
/* 시도 · 시군구 · 읍면동 칸은 조금 좁게(260 → 200) */
.app-market:is([data-k="region"], [data-k="dong"]) .adm-bar select.adm-input.narrow { width: 200px !important; }
/* 지역분석 — 고르는 칸 · 종류 · 엑셀 내려받기 · 조회가 한 줄에 서게 */
.app-market:is([data-k="region"], [data-k="dong"]) .adm-bar { flex-wrap: nowrap !important; }
/* 지역분석 — 고르는 줄(흰 카드)을 물건정보 카드처럼 화면 끝까지 이어지는 띠(--band) 위에 얹는다.
   띠는 카드 그림자를 화면 폭만큼 펼쳐 만들고, 위아래 16px 만 남기고 자른다 */
/* 고르는 줄 띠 · 탭 줄은 위(머리띠 · 하위 탭 아래)에 붙어 있고 아래 내용만 흐른다 — 물건상세의 위 카드처럼 */
.app-market[data-k="dong"] .adm-bar { box-shadow: 0 0 0 100vmax var(--band) !important; clip-path: inset(-14px -100vmax -10px -100vmax); margin-top: 6px !important; margin-bottom: 10px !important; padding-top: 10px !important; padding-bottom: 10px !important;
  position: sticky !important; top: calc(var(--stick-top) + var(--gnb-h) + var(--subtab-h) + 14px); z-index: 12; }
/* (붙는 자리 = 처음 놓인 자리 — 둘이 다르면 내리는 순간 몇 px 움직였다 멈춰 흔들려 보인다. 띠는 하위 탭 바로 아래부터 덮는다) */
.app-market[data-k="dong"] .adm-bar::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 100vw; height: 1px; transform: translateX(-50%); background: var(--subtab-line); pointer-events: none; } /* 띠 아래 끝 선 */
/* 탭 줄(수요공급 · 지역별 분석 · …) 밑줄을 화면 끝까지 */
.app-market[data-k="dong"] .adm-tabs-top { padding-bottom: 0; margin-top: 12px !important; height: 40px; box-sizing: border-box; align-items: stretch !important;
  position: sticky !important; top: calc(var(--stick-top) + var(--gnb-h) + var(--subtab-h) + 14px + var(--bar-h, 62px) + 12px); z-index: 11;
  background: var(--bg); box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(-12px -100vmax 0 -100vmax); }
/* 아래 바닥 띠(.foot)가 표 바로 밑에 붙어 올라와 보였다 — 표 한 줄쯤 띄운다 */
#marketView:has(.app-market[data-k="dong"]) .market-content { padding-bottom: 56px; }
/* 화면 끝까지 긋는 선 — transform 으로 옮기면 반 픽셀에 걸려 선이 흐려지고 파란 밑줄과 1px 어긋났다. left 로 옮긴다 */
.app-market[data-k="dong"] .adm-tabs-top::after { content: ""; position: absolute; left: calc(50% - 50vw); bottom: 0; width: 100vw; height: 1px; background: var(--subtab-line); }
.app-market[data-k="dong"] .adm-view-tabs button { position: relative; z-index: 1; }
.app-market:is([data-k="region"], [data-k="dong"]) .adm-bar select.adm-input.narrow { width: 150px !important; }
/* 기간(3 · 6 · 12개월)이 종류 옆에 들어오며 한 줄에 다 담기게 — 고르는 칸 180 → 150, 엑셀 · 조회 136 → 120 */
.app-market:is([data-k="region"], [data-k="dong"]) .adm-bar :is(.adm-load, .adm-csv) { min-width: 120px !important; padding: 0 14px !important; }
@media (max-width: 1360px) { .app-market:is([data-k="region"], [data-k="dong"]) .adm-bar select.adm-input.narrow { width: 128px !important; } .app-market:is([data-k="region"], [data-k="dong"]) .adm-bar :is(.adm-load, .adm-csv) { min-width: 100px !important; } .app-market:is([data-k="region"], [data-k="dong"]) .adm-bar { gap: 8px !important; } }
/* 거래량 랭킹 — 임장경로처럼 지도를 하위 탭 바로 아래부터 화면 끝까지 통째로 깔고(1920 전체),
   안내 상자 · 고르는 칸 · 통계 판은 그 위에 얹는다 */
/* 지도가 화면을 통째로 쓰는 화면 — 페이지 자체는 굴러가지 않는다(판은 제 안에서만 굴러간다) */
/* 다른 화면으로 가도 랭킹지도는 숨긴 채 남아 있다 — 시장분석이 보일 때만 잠근다 */
html:has(#marketView:not([hidden]) .app-market[data-k="ranking"]), body:has(#marketView:not([hidden]) .app-market[data-k="ranking"]) { overflow: hidden; overscroll-behavior: none; }
body:has(#marketView:not([hidden]) .app-market[data-k="ranking"]) .foot { display: none; }
.app-market[data-k="ranking"] .adm-shell { min-height: 0; background: transparent; }
.app-market[data-k="ranking"] .adm-body { padding: 0 !important; max-width: none !important; }
.app-market[data-k="ranking"] .tsp-stage {
  position: fixed !important; left: 0 !important; right: 0 !important; width: auto !important; margin: 0 !important;
  top: calc(var(--stick-top) + var(--gnb-h) + var(--subtab-h)) !important; bottom: 0 !important; height: auto !important; min-height: 0 !important;
  border: 0 !important; border-radius: 0 !important; z-index: 0;
}
/* 제목·설명 줄(지역별 거래량 랭킹 · 지도와 함께 …)은 웹에서 통째로 감춘다 */
.app-market[data-k="ranking"] .adm-top { display: none !important; }
/* 고르는 칸 — 왼쪽 판 맨 위(통계 정보 위)에 한 줄씩: 시도 · 시군구 · 읍면동 · 종류 · 기간 · 검색.
   칸 크기는 물건등록 칸과 같게(높이 34 · 모서리 6), 칸 위 작은 이름은 감추고 칸 안에 '○○ 선택' */
.app-market[data-k="ranking"] .tsp-filter { display: none !important; }
/* 통계 정보 — 이름(거래 건수 · 거래 총액 · 평균가 · 평당 단가)은 회색 보통 글자, 값은 파랑 */
.app-market[data-k="ranking"] .tsp-stat-grid dt { color: #6b7280 !important; font-weight: 400 !important; }
.app-market[data-k="ranking"] .tsp-stat-grid dd { color: #2b6df3 !important; }
.app-market[data-k="ranking"] .tsp-filter-slot { display: flex; flex-direction: column; gap: 8px; }
/* 줄 차례: 시도 · 시군구 · 읍면동 → 종류 · 매매/전월세 → 기간 → 검색 (여섯 칸 격자) */
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-bar { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-bar > * { grid-column: 1 / -1; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-bar > .tsp-f:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-bar > .tsp-f:nth-child(2) { grid-column: 3 / 5; grid-row: 1; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-bar > .tsp-f:nth-child(3) { grid-column: 5 / 7; grid-row: 1; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-bar > .tsp-f:nth-child(4) { grid-column: 1 / 5; grid-row: 2; }
/* 종류 옆에 매매/전월세, 그 아래 기간 한 줄 */
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-bar > .tsp-f-deal { grid-column: 5 / 7; grid-row: 2; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-bar > .tsp-f-period { grid-column: 1 / -1; grid-row: 3; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-bar > .tsp-search-btn { grid-row: 4; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-f { flex: 0 0 auto; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-f > small { display: none; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-search-btn { margin-left: 0; width: 100%; }
.app-market[data-k="ranking"] .tsp-filter-slot :is(.tsp-select, .tsp-seg, .tsp-search-btn) { height: var(--ctl-h) !important; border-radius: 6px !important; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-select { font-size: 14px !important; }
/* 아직 안 고른 칸의 '○○ 선택' 은 흐린 회색 (고르면 검정) */
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-select.ph { color: #9ca3af !important; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-select.ph option { color: #111827; }
/* 판 맨 위 제목 · 안내, 검색 아래 고른 결과 — 그리고 칸 사이마다 가름선 */
.app-market[data-k="ranking"] .tsp-web-head { display: flex; flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; } /* 제목 옆에 설명 한 줄 */
.app-market[data-k="ranking"] .tsp-web-head strong { font-size: 16px; font-weight: 800; color: #111827; }
.app-market[data-k="ranking"] .tsp-web-head small { font-size: 14px; color: #6b7280; }
.app-market[data-k="ranking"] .tsp-web-picked { display: flex; flex-direction: column; gap: 3px; }
.app-market[data-k="ranking"] .tsp-web-picked strong { font-size: 16px; font-weight: 800; color: #111827; }
.app-market[data-k="ranking"] .tsp-web-picked small { font-size: 14px; font-weight: 600; color: #2b6df3; }
.app-market[data-k="ranking"] .tsp-panel > * + * { border-top: 1px solid #e5e7eb; padding-top: 14px; }
/* 지도 알약(등수 · 동 · 건수) — 약 20% 크게 */
.app-market[data-k="ranking"] .trade-map-pin { padding: 4px 11px 4px 4px !important; gap: 6px !important; }
.app-market[data-k="ranking"] .trade-map-pin i { width: 20px !important; height: 20px !important; font-size: 12.5px !important; }
.app-market[data-k="ranking"] .trade-map-pin b { font-size: 13px !important; }
.app-market[data-k="ranking"] .trade-map-pin span { font-size: 12.5px !important; }
.app-market[data-k="ranking"] .trade-map-pin.top { padding: 5px 13px 5px 5px !important; }
.app-market[data-k="ranking"] .trade-map-pin.top i { width: 23px !important; height: 23px !important; font-size: 14px !important; }
.app-market[data-k="ranking"] .trade-map-pin.top b { font-size: 15px !important; }
.app-market[data-k="ranking"] .trade-map-pin.top span { font-size: 14px !important; }
/* 왼쪽 판 글자 · 칸 크기 — 최소 14, 소제목(거래량 랭킹 · 고른 지역 · 통계 정보 · 동별 거래 랭킹) 16.
   고르는 칸은 높이 40 · 글자 16 (입력 칸 규칙), 종류 · 거래 단추 15 */
.app-market[data-k="ranking"] .tsp-panel :is(.tsp-web-head strong, .tsp-web-picked strong, h3) { font-size: 16px !important; }
.app-market[data-k="ranking"] .tsp-panel h3 small { font-size: 14px !important; }
.app-market[data-k="ranking"] .tsp-filter-slot :is(.tsp-select, .tsp-seg, .tsp-search-btn) { height: 40px !important; }
.app-market[data-k="ranking"] .tsp-filter-slot :is(.tsp-select, .tsp-search-btn) { font-size: 16px !important; }
.app-market[data-k="ranking"] .tsp-filter-slot .tsp-seg-btn { font-size: 15px !important; }
.app-market[data-k="ranking"] .tsp-panel :is(.tsp-stat-grid dt, .tsp-rank-avg, .tsp-rank-pct, .tsp-empty, .tsp-note) { font-size: 14px !important; }
.app-market[data-k="ranking"] .tsp-panel .tsp-stat-grid dd { font-size: 16px !important; }
.app-market[data-k="ranking"] .tsp-panel :is(.tsp-rank-name, .tsp-rank-count) { font-size: 16px !important; }
.app-market[data-k="ranking"] .tsp-panel .tsp-rank-badge { font-size: 14px !important; }
/* 왼쪽 판 — 임장경로의 왼쪽 칸과 같은 자리 · 같은 폭(546) · 화면 밑단까지 */
.app-market[data-k="ranking"] .tsp-panel {
  position: fixed !important; left: 18px !important; width: 546px !important; max-width: calc(100vw - 36px) !important;
  top: calc(var(--stick-top) + var(--gnb-h) + var(--subtab-h) + 18px) !important; bottom: 18px !important;
}
/* 지역 수요공급 · 지역분석 — 고르는 칸 위 이름(시·도 / 시·군·구 / 읍·면·동 / 종류)은 감추고, 칸 안에 '시도 선택' 같은 회색 안내 */
.app-market:is([data-k="region"], [data-k="dong"]) .adm-bar .adm-f > small { display: none !important; }
.app-market .adm-bar select.ph { color: #9ca3af; }
.app-market .adm-bar select.ph option { color: #111827; }
/* 펼친 고르기 목록(면적 · 룸수 · 케이스 · 상담 상호 …)은 위 고정 줄(머리띠 · 하위 탭 · 사건 요약, z 30)보다 아래 층에 */
.app-detail :is(.adp-rcase-list, .adp-rcase-backdrop, .adp-agency-options, .adp-agency-backdrop, .adp-multi-panel) { z-index: 25 !important; }
/* 앱 색 이름(tokens.css) — 웹에는 앱 전역 CSS 가 없어 이 이름을 쓰는 선·글자가 비어 보였다
   (돈이 나가는 순서의 '필요한 내 돈 합계' 위 선 등). 웹에 띄운 앱 화면 안에서만 같은 값을 준다 */
.app-detail { --bg-card: #ffffff; --bg-soft: #f1f5f9; --text-primary: #1e293b; --text-secondary: #64748b; --text-muted: #94a3b8; --app-line: #e2e8f0; }
:root[data-theme="dark"] .app-detail { --bg-card: #131a27; --bg-soft: #1c2638; --text-primary: #ecf2ff; --text-secondary: #9fb0ca; --text-muted: #7c8aa3; --app-line: #2a3954; }
.app-detail .adp-cash-step + .adp-cash-step { border-top-color: var(--app-line) !important; }
/* 웹 산정표 — 머리줄(구분 · 상세 · 비중 · 금액)은 가운데, 금액 칸 오른쪽은 글자 한두 개만큼 띄운다 */
.app-detail .adp-profit-table thead th { text-align: center !important; }
.app-detail .adp-profit-table tr > :last-child { padding-right: 22px !important; }
/* 상세 칸(감정가 ~ 세후 수익률)은 왼쪽 회색 구분 칸에 붙지 않게 글자 한 개만큼 띄운다 */
.app-detail .adp-profit-table td:not(.adp-cat):not(.r) { padding-left: 18px !important; }
/* 돈이 나가는 순서 — '필요한 내 돈 합계' 를 단계 제목(예: 명도·수리 · 집을 넘겨받고 고치는 비용)과 같은 크기로 */
.app-detail .adp-cash-total, .app-detail .adp-cash-total :is(span, b), .app-detail .adp-cash-head b { font-size: 14px !important; }
/* 웹 산정표(두 열) — 표 폭을 칸 폭에서 좌우 들임만큼 빼서, 위 A~D 칩 줄의 시작 · 끝과 맞춘다 */
.app-detail .adp-card > .adp-profit-table { width: calc(100% - 2 * var(--card-inset)) !important; box-sizing: border-box; }
/* 웹 산정표 이름 줄 — 'A안' 20, 초기화 · 표 삭제는 알약 대신 비고 칸과 같은 둥근 사각형(모서리 6 · 높이 40), 휴지통은 정사각 */
.app-detail .adp-profit-label { font-size: 20px !important; line-height: 1.2; }
.app-detail .adp-profit-head-row .adp-pd-reset { height: 40px !important; border-radius: 6px !important; padding: 0 12px !important; border-color: #e3e8f0 !important; }
.app-detail .adp-profit-head-row .adp-pd-del { width: 40px !important; padding: 0 !important; }
.app-detail .adp-profit-head-row .adp-pd-del svg { width: 18px; height: 18px; }
/* 웹은 앱 머리줄이 없다 — 머리띠 · 하위 탭 · 사건 요약 상자 바로 아래에 붙고, 그 상자들보다 아래 층에 선다
   (앱 값 그대로 두면 엉뚱한 높이에 붙어 위 상자들 사이로 올라가 깨져 보였다) */
.app-detail .adp-profit-sticky {
  top: calc(var(--stick-top) + var(--gnb-h) + var(--subtab-h) + var(--item-shell-h, 0px)) !important; z-index: 20 !important;
}
.res > :not(.res-head) { margin-left: calc(var(--card-inset) / 2); margin-right: calc(var(--card-inset) / 2); }
.subtabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 31; background: var(--band); border-bottom: 1px solid var(--subtab-line); }
/* ===== 틀 고정 (모든 화면 공통 모듈) =====
   남색 머리띠 → [하위 탭 줄] → 필터 상자(.toolbar-shell) 를 한 덩어리로 위에 붙인다. 어느 화면이든
   필터 상자는 .toolbar-shell 로 감싸기만 하면 된다. 높이는 변수로 — 머리띠 --gnb-h, 하위 탭 줄 --subtab-h.
   화면 폭과 상관없이 늘 고정한다. 좁은 화면에선 머리띠가 두 줄이 되므로 --gnb-h 는 syncStickTop() 이 실제 높이로 맞춘다 */
:root { --gnb-h: 66px; --subtab-h: 45px; --stick-top: env(safe-area-inset-top, 0px); }
.gnb { position: sticky; top: var(--stick-top); }
.subtabs { top: calc(var(--stick-top) + var(--gnb-h)); }
.toolbar-shell { top: calc(var(--stick-top) + var(--gnb-h)); }
body.has-subtabs .toolbar-shell { top: calc(var(--stick-top) + var(--gnb-h) + var(--subtab-h)); }
.subtabs-in { display: flex; align-items: stretch; gap: 8px; height: var(--tab-h); }
.subtab { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 0 var(--tab-px); border: 0; border-radius: 0; background: transparent; font-size: var(--tab-fs); font-weight: 600; color: var(--muted); white-space: nowrap; transition: color .15s; }
.subtab svg { width: 16px; height: 16px; }
.subtab:hover { color: var(--text); }
.subtab.on { color: var(--blue); font-weight: 800; }
.subtab::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px 2px 0 0; background: var(--blue); transform: scaleX(0); transition: transform .2s ease; }
.subtab:hover::after { transform: scaleX(1); opacity: .45; }
.subtab.on::after { transform: scaleX(1); opacity: 1; animation: tab-bar-in .22s ease; }
.crumb-slot { padding-top: 2px; }
.crumb-slot + .content { padding-top: 6px; }
.u-link { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; color: var(--text-2); white-space: nowrap; transition: background .15s, color .15s; }
.u-link svg { width: 16px; height: 16px; color: var(--muted); transition: color .15s; }
.u-link:hover { background: var(--surface-3); color: var(--text); }
.u-link:hover svg { color: var(--text); }
.u-link.pay { color: var(--blue); }
.u-link.pay svg { color: var(--blue); }
.u-sep { width: 1px; height: 14px; background: var(--line-2); margin: 0 4px; }
.u-ico { position: relative; width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; padding: 0; display: grid; place-items: center; color: var(--text-2); transition: background .15s, color .15s; }
.u-ico:hover { background: var(--surface-3); color: var(--text); }
.u-ico svg { width: 18px; height: 18px; }
.u-ico .dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: #ff4d4f; box-shadow: 0 0 0 1.5px var(--band); }
.crumbs { display: flex; justify-content: flex-start; align-items: center; gap: 12px; height: 30px; padding-left: 2px; font-size: 13px; color: var(--muted); }
.crumbs a { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; transition: color .15s; }
.crumbs a:hover { color: var(--blue); }
.crumbs svg { width: 15px; height: 15px; }
.crumb-sep { color: var(--faint); font-size: 14px; line-height: 1; }
/* 지금 자리는 색으로만 알린다 — 경로줄에는 굵은 글씨를 쓰지 않는다 */
.crumbs strong { color: var(--text); font-weight: 500; }
.toolbar-shell.stuck { box-shadow: 0 8px 18px -12px rgba(15, 23, 42, 0.35); }
.toolbar {
  position: relative; background: var(--surface); border: 1px solid var(--tb-line); border-radius: 8px;
  /* 세로를 줄였다 — 위·아래 여백 10, 두 줄 사이 8, 두 줄 모두 높이 28. 오른쪽 끝은 보관함·휴지통·고르기 */
  padding: 10px 24px; display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 8px;
}
/* 윗줄 상자는 32 — 아랫줄 단계(28)보다 한 단계 크게, 테두리는 아랫줄 '전체' 상자와 같은 색 */
.tb-row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 32px; }
.pop-root { position: relative; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--text-2); font-size: 13px; font-weight: 500; white-space: nowrap; transition: border-color .15s, background .15s, color .15s;
}
.chip:hover { border-color: var(--line-2); background: var(--surface); color: var(--text); }
.chip.on { border-color: #9fb8f5; background: var(--blue-soft); color: #2a5fbf; font-weight: 700; }
.chip[aria-expanded="true"] { border-color: var(--blue); }
.chip svg { width: 15px; height: 15px; flex: 0 0 auto; }
.chip .gt { width: 10px; height: 10px; opacity: .7; margin-left: 4px; }
/* 앱 .wlp-filter-btn — 펼침 삼각형(▼), 고른 칸만 파랗게 */
.chip.dd { padding-right: 11px; min-width: 104px; }
.chip.dd .txt { min-width: 0; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.chip.dd .tri { flex: 0 0 auto; margin-left: auto; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--muted); transition: transform .15s; }
.chip.dd .txt { margin-right: 10px; }
.chip.dd.on .tri { border-top-color: #2a5fbf; }
.chip.dd[aria-expanded="true"] .tri { transform: rotate(180deg); }
.chip.dd svg { color: var(--faint); }
.chip.dd.on svg { color: #2a5fbf; }
.seg { display: inline-flex; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); padding: 2px; gap: 1px; }
.seg button {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border: 1px solid transparent; border-radius: 4px; background: transparent;
  color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, color .15s;
}
.seg button:hover { color: var(--text); background: var(--surface-3); }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 700; border-color: var(--line-2); }
.seg button svg { width: 13px; height: 13px; }
.search {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; width: 340px; padding: 0 10px; border-radius: 6px;
  border: 1px solid var(--line-2); background: var(--surface); transition: border-color .15s, box-shadow .15s, width .2s;
}
.search:hover { border-color: #b8c1d1; }
.search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); width: 400px; }
.search svg { width: 15px; height: 15px; color: var(--faint); flex: 0 0 auto; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13px; }
.search input::placeholder { color: var(--faint); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; padding: 0; }
.search .clear:hover { color: var(--text); }
.search .clear svg { width: 10px; height: 10px; }
/* ===== 선정물건등록 ===== */
.reg-box { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 8px; align-content: start; }
/* 상자 둘 나란히 — 구글드라이브 연동 | AI 자동 분석. 좁으면 위아래로 */
/* 등록 화면 안내 상자 — 파싱 상자 바로 위에 선다.
   좌우 숨통(24)과 제목 꼴을 파싱 상자와 같게 두어 아이콘이 한 세로선에 선다.
   설명은 제목 오른쪽에 한 줄로 붙인다 */
.rg-lead-box {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--card-line); border-radius: 10px;
  box-shadow: var(--shadow-card); padding: 13px 24px; margin-bottom: 12px;
}
.rg-lead-box h2 {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; margin: 0;
  font-size: 15px; font-weight: 800; color: var(--text); white-space: nowrap;
}
.rg-lead-box h2 svg { width: 18px; height: 18px; color: #2a5fbf; flex: 0 0 auto; }
.rg-lead-box p { flex: 1 1 320px; min-width: 0; margin: 0; font-size: 14px; font-weight: 500; color: var(--text-2); line-height: 1.5; }
@media (max-width: 720px) { .rg-lead-box { padding: 11px 14px; } .rg-lead-box h2 { font-size: 14px; } .rg-lead-box p { font-size: 14px; } }
.reg-duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
@media (max-width: 1100px) { .reg-duo { grid-template-columns: minmax(0, 1fr); } }
/* 상자가 탭 — 고른 상자는 파란 테두리, 안 고른 상자는 눌러서 바꾼다 */
/* 앱 로그인 창 — 앱 화면의 남색 바탕은 빼고 흰 카드만 띄운다 (카드 모양은 앱 그대로) */
.app-login { position: relative; width: min(360px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 0 !important; background: transparent !important; box-shadow: none !important; border: 0 !important; }
.app-login .lp-shell { min-height: 0 !important; background: none !important; padding: 0 !important; }
.app-login .lp-card { max-width: none !important; }
.app-login-x { position: absolute !important; top: 10px; right: 10px; z-index: 2; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #6b7280; display: grid; place-items: center; cursor: pointer; }
.app-login-x:hover { background: #f3f4f6; color: #111827; }
.app-login-x svg { width: 18px; height: 18px; }
/* 로그인 전 안내 */
.list-guide { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 10px; padding: 12px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--card-line); }
.list-guide .lg-title { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; color: var(--text); }
.list-guide .lg-title svg { width: 17px; height: 17px; color: #2a5fbf; }
.list-guide .lg-text { font-size: 14px; color: var(--text); }
.demo-note { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 9px 14px; border-radius: 8px; background: #fff7e6; border: 1px solid #f5d79e; color: #8a5a00; font-size: 13px; }
:root[data-theme="dark"] .demo-note { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.3); color: #fbbf24; }
/* ===== 물건상세 — 고정 카드(앱 adp-sticky-head) ===== */
.item-head { row-gap: 8px; padding-top: 10px; padding-bottom: 10px; }
.ih-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ih-back { flex: 0 0 auto; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); display: grid; place-items: center; }
.ih-back:hover { background: var(--surface-3); color: var(--text); }
.ih-back svg { width: 18px; height: 18px; }
.ih-title { margin: 0; font-size: 20px; font-weight: 800; color: var(--text); white-space: nowrap; }
.ih-tag { margin-right: 6px; color: #324f87; }
:root[data-theme="dark"] .ih-tag { color: #9db8ff; }
.ih-court { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ih-court em { font-style: normal; font-weight: 700; color: var(--blue); }
.ih-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.ih-right .ibtn { width: 32px; height: 32px; }
.ih-right .ibtn svg { width: 20px; height: 20px; } /* 고정 카드 보관함·휴지통 — 목록 카드(17)보다 15% 크게 */
.ih-pdf { box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border: 1px solid #c7d7f7; border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--text-2) !important; text-decoration: none; }
.ih-pdf svg { width: 14px; height: 14px; }
.ih-stage { box-sizing: border-box; height: 28px; padding: 0 12px; border-radius: 8px; /* 알약 대신 PDF 단추와 같은 둥근 네모 · 같은 높이 */ border: 1.5px solid #6b85f0; background: #dce5ff; color: #3850c2; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; }
.ih-stage.hot { border-color: #ef6b6b; background: #ffdede; color: #c22e2e; }
.ih-stage.off { border-color: #c4c9d4; background: #eef0f4; color: #6b7280; }
.ih-stage.done { border-color: #34b37a; background: #dcf5e8; color: #157a4b; }
/* 단계 칩은 누르면 손품조사~매도 단계 목록이 펼쳐지는 단추 (선정목록 표의 단계 단추와 같은 목록) */
.ih-stage { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-family: inherit; }
.ih-stage .caret { font-style: normal; font-size: 11px; opacity: .8; }
/* 1줄: 종류 칩 · 중요도·매각구분·면적 / 2줄: 주소 복사(종류 칩 아래) · 주소 */
.ih-prop { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px 10px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.ih-line { display: flex; align-items: center; gap: 10px; min-width: 0; grid-column: 2 / 4; }
/* 전체 접기 — 별 아래, 앱 .adp-fold-all 과 같은 모양(34×26 · 16px 화살표) */
.ih-fold { grid-column: 3; justify-self: end; width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.ih-fold:hover { background: #f2f6ff; }
.ih-fold img { width: 16px; height: 16px; object-fit: contain; transition: transform .2s; }
.ih-fold.up img { transform: rotate(180deg); }
/* 물건정보 탭 — 전체 접기면 카드 제목만 남긴다 */
.it-grid.folded .it-card > :not(.it-head) { display: none; }
.ih-stars { margin-left: auto; flex: 0 0 auto; }
/* 별 끝선을 아래 '전체 접기' 단추 오른쪽 끝에 맞춘다 — 목록용 오른쪽 여백(8px)을 빼고, 별 그림이 단추 안에서 들어간 1.5px 만큼 더 민다 */
.ih-stars .stars { margin-right: -1.5px; }
/* 종류 칩과 주소 칩은 같은 크기 — 위아래로 줄이 맞는다 */
.ih-kind, .ih-copy { justify-self: start; box-sizing: border-box; display: inline-flex !important; align-items: center; justify-content: center; min-width: 64px; height: 24px !important; padding: 0 10px !important; font-size: 14px !important; border: 1px solid transparent; }
.ih-copy { border-color: #c7d7f7 !important; }
.ih-kind { padding: 2px 10px; border-radius: 999px; background: #e0eaff; color: #2b6df3; font-size: 14px; font-weight: 800; white-space: nowrap; }
.ih-sale { min-width: 0; font-size: 14px; /* 아래 주소 줄과 같은 크기 */ color: #2b6df3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ih-copy { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border: 1px solid #c7d7f7; border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 700; color: #2a5fbf; }
.ih-copy svg { width: 13px; height: 13px; }
.ih-addr { margin: 0; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ih-addr b { color: #2b6df3; font-weight: 700; }
/* ===== 물건상세 — 탭 카드 ===== */
.it-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 1100px) { .it-grid { grid-template-columns: minmax(0, 1fr); } }
/* 앱 물건상세를 띄운 자리 — 앱 머리(제목·탭·물건요약)와 아래 메뉴는 웹 것이 있어 감춘다 */
.app-detail .adp-sticky-head, .app-detail .amb { display: none !important; }
/* ===== 낙찰이후 · 자금관리 · 더보기 — 앱 화면(PostWinPage · FinancePage · MorePage)을 웹 흐름에 맞게 푼다 =====
   앱 화면은 손전화 한 장을 덮는 고정 틀(위 붙박이 · 아래만 구름)이다. 웹은 머리띠 · 하위 탭 아래로 보통 글처럼 흐르게 고정만 푼다.
   앱의 제목줄 뒤로가기 · 탭 줄 · 아래 메뉴는 웹 머리띠와 하위 탭이 대신한다 */
.app-page :is(.pw-shell, .fin-shell) { position: static !important; inset: auto !important; overflow: visible !important; background: transparent !important; }
.app-page :is(.pw-fixed-top, .fin-fixed-top) { position: static !important; background: transparent !important; box-shadow: none !important; }
.app-page :is(.pw-body, .fin-body) { overflow: visible !important; padding-bottom: 40px !important; }
.app-page .more-shell { min-height: 0 !important; background: transparent !important; padding-bottom: 40px !important; }
.app-page .more-fixed { position: static !important; background: transparent !important; }
.app-page :is(.pw-tabs, .fin-tabs, .more-titlebar, .quick, .pg-back-shared, .pg-back, .amb) { display: none !important; }
.app-page .more-card.first { margin-top: 0 !important; }
#appPageView .content { padding-top: 8px; }
/* ===== 임장경로 — 앱 FieldTripPlannerPage 를 웹 흐름에 맞게 푼다 =====
   앱 화면은 손전화 한 장을 통째로 덮는 고정 틀이다. 웹에서는 머리띠·경로줄 아래에
   보통 글처럼 흘러야 하므로 그 고정만 풀고, 안쪽 짜임은 앱 그대로 둔다 */
.app-trip .ftp-shell {
  position: static !important; inset: auto !important; z-index: auto !important;
  overflow: visible !important; background: transparent !important;
}
.app-trip .ftp-scroll { overflow: visible !important; }
/* 앱의 제목줄(뒤로가기 포함)과 아래 메뉴는 웹 머리띠가 대신한다 */
.app-trip .ftp-shell > .ftp-section-title.is-page,
.app-trip .amb { display: none !important; }
/* 지도는 머리띠 아래를 가득 채우고, 그 위 왼쪽에 조작 칸을 띄운다 (지도 앱과 같은 짜임).
   둘 다 화면 기준으로 붙이므로 감싼 칸의 스크롤에 잘리지 않는다 */
#tripView .crumb-slot { display: none; }
#tripView .content { padding: 0; min-height: 0; }
/* 앱 화면의 모양(pdfparse.css)이 이 글보다 늦게 실려 같은 힘이면 그쪽이 이긴다 —
   자리를 바꾸는 값에는 !important 를 붙인다 (물건상세 칸과 같은 규칙) */
.app-trip .ftp-map-wrap {
  position: fixed !important; left: 0 !important; right: 0 !important;
  top: calc(var(--stick-top) + var(--gnb-h)) !important; bottom: 0 !important;
  margin: 0 !important; height: auto !important; max-height: none !important;
  border-radius: 0 !important; z-index: 0 !important;
}
/* 조작 칸 밖(지도 쪽)은 지도가 받아야 한다 — 칸은 제 폭만큼만 자리를 차지한다 */
.app-trip .ftp-map { border-radius: 0 !important; }
/* '한 번 눌러 지도 이동' 안내는 손전화용이다 — 웹은 처음부터 끌 수 있으니 숨긴다 */
.app-trip .ftp-map-hint { display: none !important; }
/* 티맵은 웹에서 길찾기를 열어 주지 않는다 — 웹에서만 감춘다(앱은 그대로 쓴다) */
.app-trip .ftp-nav-launch-btn[aria-label="티맵 내비게이션 실행"] { display: none !important; }
.app-trip .ftp-nav-launch-row { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
/* 출발지·도착지 · 네이버·카카오 · 내 위치·즐겨찾기 글자를 키운다 (웹만) */
.app-trip .ftp-nav-launch-btn { font-size: 14px !important; }
.app-trip .ftp-od-field input { font-size: 14px !important; }
.app-trip .ftp-fav-text { font-size: 13px !important; }
/* 지도 위 번호·화살표 — 앱은 이 모양을 전역 스타일(src/style.css)에 둔다.
   웹 묶음은 화면별 스타일(pdfparse.css)만 싣기 때문에 그대로는 번호가 보이지 않는다.
   Leaflet 이 divIcon 으로 직접 만드는 칸이라 화면별 스타일이 닿지도 않는다 — 여기 같이 적는다 */
.trip-marker { background: transparent !important; border: none !important; }
.trip-marker-badge {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 13px; line-height: 1;
  border: 3px solid #fff; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.35);
}
.trip-marker-badge.tone-start { background: #16a34a; }
.trip-marker-badge.tone-stop { background: #2563eb; }
.trip-marker-badge.tone-end { background: #f97316; }
/* 다녀온 곳 — 번호는 그대로 두고 흐리게, 오른쪽 아래에 체크 */
.trip-marker-badge.done { background: #94a3b8; position: relative; }
.trip-marker-badge.done::after {
  content: '✓';
  position: absolute; right: -2px; bottom: -2px;
  width: 13px; height: 13px; border-radius: 50%;
  background: #2f7d4f; color: #fff; border: 1.5px solid #fff;
  font-size: 8px; font-weight: 800; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
/* 번호 말풍선 — 주소가 길어도 잘리지 않게 한 줄로 눕힌다 */
.trip-pop .leaflet-popup-content { margin: 10px 14px; white-space: nowrap; }
.trip-pop .tp-addr { display: block; font-size: 14px; font-weight: 800; color: #111827; }
.trip-pop .tp-info { display: block; margin-top: 4px; font-size: 14px; font-weight: 500; color: #4b5563; }
.trip-pop .tp-info b { font-weight: 800; color: #111827; }
.trip-pop .tp-info em { font-style: normal; color: #9ca3af; }
.trip-pop .tp-sep { display: inline-block; margin: 0 8px; font-style: normal; color: #d1d5db; }
.trip-arrow { background: transparent !important; border: none !important; }
.trip-arrow-icon { width: 14px; height: 14px; position: relative; }
.trip-arrow-icon::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 6px solid transparent; border-right: 6px solid transparent;
  border-bottom: 10px solid #2563eb;
  filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 1px #fff);
}
/* 확대·축소 단추 — 왼쪽 위는 조작 칸이 덮는다. 오른쪽 위 끝으로 보낸다 */
.app-trip .leaflet-top.leaflet-left { left: auto !important; right: 0 !important; }
.app-trip .leaflet-top.leaflet-left .leaflet-control { margin-right: 10px !important; } /* 왼쪽 여백만 있어 오른끝에 딱 붙었다 */
/* 왼쪽 조작 칸 — 경로설정 · 동선최적화 · 목록이 한 통으로 흐른다.
   지도는 이 칸 '안' 에 들어 있고 position:fixed 는 제 부모가 만든 층 안에서만 겹침을 가른다.
   그래서 칸 자체에 바탕을 주면 지도가 그 바탕을 덮어 버린다 —
   바탕·테두리는 칸이 아니라 칸 안의 줄(.ftp-fixed-top · .ftp-list)에 주고,
   그 줄들을 지도 위(z 1)로 올린다. 지도는 칸 안에서 바닥(z 0)에 깔린다 */
.app-trip .ftp-scroll {
  position: fixed !important; left: 18px !important;
  top: calc(var(--stick-top) + var(--gnb-h) + 18px) !important; bottom: 18px !important;
  width: 546px !important; max-width: calc(100vw - 36px) !important;
  overflow-y: auto !important; overscroll-behavior: contain; z-index: 5 !important;
  background: transparent !important; border: 0 !important; box-shadow: none !important;
  padding: 0 !important;
  /* 상자는 화면 밑단(아래 18px)까지 내려온다 — 목록이 짧으면 아래쪽을 빈 흰 칸으로 채우고,
     길어지면 이 칸 안에서만 굴러간다 */
  display: flex !important; flex-direction: column !important;
}
.app-trip .ftp-scroll > .ftp-fixed-top { flex: 0 0 auto; }
.app-trip .ftp-scroll > .ftp-list { flex: 1 0 auto; }
/* 목록을 접어 윗줄만 남으면 윗줄이 아래까지 채운다 */
.app-trip .ftp-scroll:not(:has(> .ftp-list)) > .ftp-fixed-top { flex: 1 0 auto; }
.app-trip .ftp-scroll > .ftp-fixed-top, .app-trip .ftp-scroll > .ftp-list {
  position: relative; z-index: 1;
  /* 출발지·도착지 검색 목록이 아래 줄에 덮이지 않게 윗줄을 한 겹 더 올린다 */
  background: rgba(255, 255, 255, 0.96) !important;
  border: 1px solid #e2e8f3; border-top: 0; border-bottom: 0;
  /* 그림자는 주지 않는다 — 윗줄 그림자가 아래로 번져 방문·완료 줄과 S 줄에
     회색 그늘을 드리우고, 한 상자가 둘로 갈라져 보였다 */
}
.app-trip .ftp-scroll > .ftp-fixed-top { z-index: 2; border-top: 1px solid #e2e8f3; border-radius: 14px 14px 0 0; }
.app-trip .ftp-scroll > .ftp-list { border-bottom: 1px solid #e2e8f3; border-radius: 0 0 14px 14px; }
/* 두 줄 사이 10px — 앱에서는 한 상자 안의 여백이지만, 웹은 줄마다 바탕을 주므로
   그 여백이 바깥으로 삐져나와 지도가 비쳤다. 여백을 상자 안으로 들인다 */
.app-trip .ftp-scroll > .ftp-list { padding-top: 10px; }
.app-trip .ftp-scroll > .ftp-list > :first-child { margin-top: 0 !important; }
/* 안쪽 줄이 제 바탕으로 모서리를 덮는다 — 맨 위·맨 아래 줄에도 같은 라운드를 준다 */
.app-trip .ftp-scroll > .ftp-fixed-top > :first-child { border-radius: 14px 14px 0 0; }
.app-trip .ftp-scroll > .ftp-list > :last-child { border-radius: 0 0 14px 14px; }
/* 목록을 접으면 윗줄 하나만 남는다 — 그때는 네 모서리를 모두 둥글린다 */
.app-trip .ftp-scroll:not(:has(> .ftp-list)) > .ftp-fixed-top { border-bottom: 1px solid #e2e8f3; border-radius: 14px; }
:root[data-theme="dark"] .app-trip .ftp-scroll > .ftp-fixed-top,
:root[data-theme="dark"] .app-trip .ftp-scroll > .ftp-list { background: rgba(17, 24, 39, 0.94) !important; border-color: #2a3650; }
/* 패널 안에서는 앱 그대로의 폭을 쓴다 */
.app-trip .ftp-fixed-top, .app-trip .ftp-update-bar, .app-trip .ftp-list { max-width: none !important; margin-left: 0 !important; margin-right: 0 !important; }
.app-trip .ftp-fixed-top { background: transparent; }
/* 지도가 화면을 채우므로 바닥글은 임장경로에서 비운다 */
body.trip-full .foot { display: none; }
.app-detail .adp-shell { min-height: 0 !important; padding-bottom: 0 !important; background: transparent !important; }

.app-detail.tab-field .adp-fs-sections :is(select, .adp-agency-trigger, .adp-agency-trigger .txt, .adp-multi-trigger, .adp-multi-placeholder) { font-size: 14px !important; }

.app-detail.tab-field .adp-fs-sections .adp-fs-row .lbl { padding-left: 4px; }
.app-detail.tab-field .adp-fs-sections .adp-fs-section .adp-survey-row { grid-template-columns: 112px minmax(0, 1fr) 30px; }

.app-detail.tab-field .adp-fs-sections .adp-survey-row { border-bottom: 0 !important; } /* 박스 안 줄 밑줄 빼기 — 다른 줄(①②)처럼 */

/* ③ 에서도 누구에게(임차인·입주민·동대표) 고르는 단추가 없는 줄(우편함 · 전기가스수도 · 임차인차량)은 ② 처럼 체크 바로 앞까지 길게 */

/* 입찰자 현황조사 줄은 ② 수리상태처럼 길게 — 고르는 칸이 체크 바로 앞까지, 체크는 다른 줄 체크와 같은 끝 */

.app-detail.tab-field .adp-fs-sections .adp-fs-section .adp-survey-row > .lbl { padding-left: 4px; }

.app-detail.tab-field .adp-fs-toggles .adp-toggle-btn { height: calc(var(--ctl-h) - 4px) !important; }

/* 말풍선(ⓘ 설명 · 주소 안내 등)도 글자 14 — 웹에 띄운 앱 화면의 모든 말풍선 */
.app-detail :is(.adp-note-bubble, .adp-dm-bubble) { font-size: 14px !important; }

/* 웹 손품조사 — 개별성 분석 두 표의 줄 높이를 약 30% 넉넉히 */

.app-detail.tab-survey .adp-conc-table td:not(.adp-conc-note) :is(strong, .adp-conc-v), .app-detail.tab-survey .adp-conc-table td.num { font-size: 16px !important; font-weight: 800 !important; }

/* 웹 — 편집할 때 입력칸 글자 16, 칸 높이는 --ctl-h 이상 (글자가 작아 칸도 작아 보였다) */
.app-detail :is(input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), select, textarea) { font-size: 16px !important; }
/* 웹 부동산 상담표(유선 · 현장) — 상호선택 · 연락처 입력 · 선택 · 금액 칸 글자를 상호선택과 같은 14 로 맞춘다 */
/* (입력칸 16 규칙이 :not 셋으로 더 세다 — 같은 :not 셋에 .agency-table 을 더해 이긴다) */
.app-detail .agency-table input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
.app-detail .agency-table :is(.adp-agency-trigger, .adp-agency-trigger .txt) { font-size: 14px !important; }
.app-detail :is(.adp-dm-table, .adp-conc-table, .adp-ind-table, .adp-ruser-table) :is(input:not([type="checkbox"]), select) { min-height: var(--ctl-h) !important; }
/* 웹 손품조사 — 급매가 표도 세로로 넉넉히 (칸 위아래 7 → 14, 블록 사이 8 → 16) */
.app-detail.tab-survey .adp-mkt-body .adp-dm-table .cell > :is(small, strong, span, .adp-mkt-unit) { padding-top: var(--tbl-py) !important; padding-bottom: var(--tbl-py) !important; }
.app-detail.tab-survey .adp-mkt-body .adp-mkt-block + .adp-mkt-block { margin-top: 16px !important; }

.app-detail.tab-survey .adp-ind-table > colgroup > col:first-child { width: 125px !important; }
/* 웹 손품조사 — 매매수요 ① 수치입력 · ② 지표결과 표는 세로로 넉넉히 (줄 높이 약 두 배) */
.app-detail.tab-survey :is(.dm-input, .dm-result) .cell .cell-head { min-height: 76px !important; padding-top: 16px !important; padding-bottom: 16px !important; }

.it-col { display: grid; gap: 12px; align-content: start; min-width: 0; }
.it-card { background: var(--surface); border: 1px solid var(--card-line); border-radius: 10px; box-shadow: var(--shadow-card); padding: 14px 24px 16px; min-width: 0; }
.it-card.wide { grid-column: 1 / -1; }
.it-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
.it-head h2 { margin: 0 !important; }
.it-edit { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); font-size: 14px; font-weight: 700; color: var(--text-2); }
.it-edit.save { border-color: #2a5fbf; color: #2a5fbf; }
.it-in { height: 28px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); font-size: 13px; color: var(--text); width: 110px; margin-left: 4px; text-align: right; }
.it-in.sm { width: 64px; } .it-in.wide { width: 180px; }
.it-in:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.it-rows.editing > dd { white-space: nowrap; }
.it-vtabs { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; /* 칸 폭을 가장 넓은 칸(500M 미만)에 맞춰 똑같이 */ padding: 3px; margin: 2px 0 10px; border-radius: 8px; background: var(--surface-2); }
.it-vtabs button { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; font-size: 14px; font-weight: 700; color: var(--muted); }
.it-vtabs button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.12); }
.it-area + .it-area { margin-top: 12px; }
.it-area h3 { margin: 0 0 6px; font-size: 13.5px; font-weight: 800; color: var(--text); }
/* 표 공통 — 앱 물건상세 표(.adp-table)처럼 네 모서리를 8px 로 깎는다. 모든 표가 같은 값을 쓴다.
   radius 가 먹으려면 border-collapse 가 separate 여야 한다. 바깥 테두리는 표에, 칸 사이 선은
   위·오른쪽에만 그어서 겹치지 않게 한다(rowspan 칸이 있어도 선이 두 겹이 되지 않는다) */
.it-kv, .it-table { border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.it-kv th, .it-kv td, .it-table th, .it-table td { border: 0; border-top: 1px solid var(--line); }
.it-kv th, .it-kv td { border-right: 1px solid var(--line); }
.it-kv tr > :last-child { border-right: 0; }
/* 표가 <colgroup> 으로 시작하면 그다음(머리줄·본문)의 첫 줄이 맨 윗줄이다 — 빠뜨리면 바깥 테두리와 겹쳐 두 줄로 보인다 */
.it-kv > :first-child > tr:first-child > *, .it-table > :first-child > tr:first-child > *,
.it-kv > colgroup + * > tr:first-child > *, .it-table > colgroup + * > tr:first-child > * { border-top: 0; }
.it-kv { width: 100%; font-size: 13px; table-layout: fixed; }
.it-kv th, .it-kv td { padding: 7px 10px; text-align: left; vertical-align: middle; word-break: break-word; }

.it-kv.cols4 th { width: 104px; }
/* 전유부 — 이름 칸은 '총 가구/세대/호' · '승강기(비상/승용)' 가 한 줄에 들어가는 폭 */
.it-kv.it-unit th { width: 136px; white-space: nowrap; }
.it-kv td.grid, .it-kv td.grid2 { line-height: 1.9; }
.it-kv td.grid .it-place, .it-kv td.grid2 .it-place { display: inline-block; margin-right: 12px; }
.it-floor th { width: auto; }
/* 건축물정보 — 표가 둘(표제부 + 층별)이면 사이를 띄우고, 칸 글씨는 한 줄로 */

.it-na { color: var(--faint); }

.it-subtab ~ .it-subtab { margin-top: 12px; }
.it-emptyline { margin: 0; padding: 10px 0; font-size: 13px; color: var(--faint); }

/* 두 단의 제목 칸을 같은 폭으로 — 아래 네 칸이 위 줄과 나란히 선다 */
.auto-box .rg-row1 > .rg-title { min-width: 176px; margin-right: 0; }
/* Plus 딱지 — 유료로 쓸 수 있는 자리에만 단다 */
.plan-tag { display: inline-block; flex: 0 0 auto; border-radius: 999px; font-weight: 800; letter-spacing: -.1px; vertical-align: 1px; }
.plan-tag.plus { padding: 1px 7px; background: #eda134; color: #fff; font-size: 14px; line-height: 1.5; }
/* 등록 방법 탭 — 자동 등록(Plus) · 직접 입력. 밑줄은 ::after 막대로(전역 button 둥근모서리를 피한다) */
/* 아래 회색 줄은 창 끝까지 — 띠처럼 긋는다 (html·body 가 overflow-x: clip 이라 가로 스크롤은 생기지 않는다) */
.reg-tabbar { position: relative; display: flex; align-items: stretch; gap: 2px; }
.reg-tabbar::after { content: ""; position: absolute; left: 50%; bottom: 0; z-index: 0; width: 100vw; height: 1px; transform: translateX(-50%); background: var(--subtab-line); } /* 물건상세 하위 탭 줄과 같은 색 */
.reg-shell { padding-top: 0; padding-bottom: 0; } /* 탭 줄이 상자 전체 — 위아래 띠를 남기지 않는다 */
/* 물건등록 탭 띠도 시장분석 · 물건상세 하위 탭 띠와 같은 높이: 탭(--tab-h 44) + 아래 선 1 = 45 */
.reg-tabbar { height: calc(var(--tab-h) + 1px); }
.reg-tabbar .reg-tab { align-self: flex-start; }
.reg-tab { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px; height: var(--tab-h); padding: 0 var(--tab-px); border: 0; border-radius: 0; background: transparent; font-size: var(--tab-fs); font-weight: 600; color: var(--muted); white-space: nowrap; transition: color .15s; }
.reg-tab svg { width: 17px; height: 17px; }
.reg-tab:hover { color: var(--text); }
.reg-tab.on { color: var(--blue); font-weight: 800; }
.reg-tab::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 3px; border-radius: 2px 2px 0 0; background: var(--blue); transform: scaleX(0); transition: transform .2s ease; }
.reg-tab:hover::after { transform: scaleX(1); opacity: .45; }
.reg-tab.on::after { transform: scaleX(1); opacity: 1; animation: tab-bar-in .22s ease; }
@keyframes tab-bar-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.reg-tab .plan-tag { pointer-events: none; }
.reg-tab:not(.on) .plan-tag.plus { background: #f2dcb6; color: #8a6520; } /* 꺼진 탭에서도 알약은 알약으로 보이게 */
/* 유료가 아닐 때 — 왼쪽 상자는 한 발 물리고 누를 수 없게 한다 */

.lock-note { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
/* AI 줄 — 가져오기 줄 아래에 한 단 */

.rg-ai .ai-setup-text { font-size: 14px; color: var(--text-2); }
/* 직접 입력 칸 — 두 칸씩, 소재지만 한 줄 */
/* 위 고정 상자에는 이제 등록 방법 탭만 남는다 */
.reg-duo { grid-template-columns: minmax(0, 1fr); }
/* 조작 상자·직접입력 상자 — 둘 다 안내 상자 아래에 선다 */

.rg-results.auto-box { display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; }
/* 상자 사이는 어디서나 12px — 안내 · 알림 · 조작 · 파싱 · 직접입력 어느 차례로 와도 같게 */

.reg-content > .rg-lead-box { margin-bottom: 0; }

@media (max-width: 900px) { .rg-sub { display: none; } }

.rg-row1, .rg-row2 { display: flex; align-items: center; gap: 8px; min-height: 32px; min-width: 0; }
.rg-title { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; margin-right: 4px; font-size: 14px; font-weight: 800; color: var(--text); white-space: nowrap; cursor: help; }

.rg-folder { position: relative; min-width: 0; }

.rg-fitem .mk {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface);
}

.ai-switch { flex: 0 0 auto; position: relative; width: 48px; height: 28px; /* 키 등록 버튼(28)과 같은 높이 */ padding: 0; border: 0; border-radius: 999px; background: #d1d5db; transition: background .15s; }
