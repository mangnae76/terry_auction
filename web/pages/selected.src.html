.ai-switch { flex: 0 0 auto; position: relative; width: 48px; height: 28px; /* 키 등록 버튼(28)과 같은 높이 */ padding: 0; border: 0; border-radius: 999px; background: #d1d5db; transition: background .15s; }
.ai-switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: left .15s; }
.ai-switch.on { background: #2b6df3; }
.ai-switch.on i { left: 23px; }
.ai-text { display: inline-flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
.ai-text b { font-size: 13px; font-weight: 800; color: var(--text); }
.key-field { position: relative; }
.key-field input { width: 100%; box-sizing: border-box; padding-right: 76px !important; }
.key-field .kf-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: transparent; display: grid; place-items: center; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
.kf-btn:hover { background: var(--surface-3); color: var(--text); }
.kf-btn svg { width: 17px; height: 17px; }
.key-field .kf-btn[data-act="ai-eye"] { right: 38px; }
.key-field .kf-btn[data-act="ai-paste"] { right: 5px; }
.ai-setup, .ai-run { display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: 24px; }
.ai-setup-text { font-size: 13px; font-weight: 400; color: var(--text); white-space: nowrap; }
.ai-key { display: inline-flex; align-items: center; gap: 5px; }
.ai-key svg { width: 14px; height: 14px; }
.ai-setup b { font-size: 13px; font-weight: 800; color: var(--text); white-space: nowrap; }
.my-set .rg-head { margin-bottom: 6px; }
.my-dlg-body { display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 160px); overflow: auto; } /* 더보기 › 계정관리의 AI 설정 창 */
.my-lead { margin: 0 0 12px; font-size: 13px; font-weight: 500; color: var(--text-2); line-height: 1.6; }
.ai-body.flat { padding: 0; }
.my-content > * + * { margin-top: 12px; }
.my-set .rg-ai { display: flex; align-items: center; gap: 8px; }
.key-state { font-size: 14px; font-weight: 700; color: var(--faint); white-space: nowrap; }
.key-state.ok { color: #16a34a; }
.key-state.no { color: #dc2626; }
.key-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--blue) !important; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.key-link svg { width: 13px; height: 13px; }
.ai-setup-help { min-width: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 980px) { .ai-setup { flex-wrap: wrap; padding-left: 0; } .ai-run { padding-left: 0; } .ai-setup-help { flex-basis: 100%; white-space: normal; } }
.ai-text small { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.ai-key { flex: 0 0 auto; height: 28px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); font-size: 14px; font-weight: 700; color: var(--text-2); }
.ai-key:hover { border-color: #b8c1d1; color: var(--text); }
.rg-head .rg-stats + .hint { margin-left: 0; }
.rg-head h2 { white-space: nowrap; }
@media (max-width: 1100px) { .rg-head .hint { display: none; } }
.rg-stats { margin-left: auto; margin-right: 8px; display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.rg-stats b { color: var(--text); font-weight: 800; margin: 0 1px 0 3px; }
.rg-stats .n-new b { color: #2b6df3; } .rg-stats .n-chg b { color: #7c3aed; } .rg-stats .n-err b { color: #ef4444; }
.reg-content { padding-top: 11px; }
.rg-banner { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; padding: 12px 14px; border-radius: 10px; background: #dbe7ff; border: 1px solid #b6cdf8; font-size: 14px; font-weight: 700; color: #1d4ed8; } /* 진행 · 안내 띠 — 바탕에 묻히지 않게 맑은 파랑 + 테두리 */
:root[data-theme="dark"] .rg-banner { background: #1e2c4a; border-color: #34508a; color: #a8c2ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rg-banner { background: #1e2c4a; border-color: #34508a; color: #a8c2ff; } }
.rg-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: rgDot 1.2s infinite ease-in-out; }
.rg-dot:nth-child(2) { animation-delay: .2s; } .rg-dot:nth-child(3) { animation-delay: .4s; }
@keyframes rgDot { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
.rg-results { background: var(--surface); border: 1px solid var(--card-line); border-radius: 10px; box-shadow: var(--shadow-card); padding: 14px 24px 12px; transition: border-color .15s, box-shadow .15s; } /* 좌우 24 — 위 연동 상자(.toolbar)와 제목 세로선을 맞춘다 */
.rg-results.over { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.rg-head { display: flex; align-items: center; gap: 8px; }
.rg-head h2 { margin: 0; display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 800; }
.rg-head h2 svg { width: 18px; height: 18px; color: #2a5fbf; }
.rg-head .cnt { font-size: 13px; color: var(--muted); }
.rg-head .hint { margin-left: auto; font-size: 14px; color: var(--faint); }
.rg-chev { width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; }
.rg-chev:hover { background: var(--surface-3); color: var(--text); }
.rg-chev svg { width: 18px; height: 18px; transition: transform .2s; }
.rg-chev.up svg { transform: rotate(180deg); }
.rg-empty { margin-top: 10px; padding: 46px 16px; border: 1.5px dashed var(--line-2); border-radius: 10px; text-align: center; color: var(--faint); font-size: 13.5px; line-height: 1.7; }
.rg-empty .ic { font-size: 32px; display: block; margin-bottom: 4px; filter: grayscale(1); opacity: .55; transition: filter .15s, opacity .15s; } /* 평소엔 회색, 올리면 원래 색 */
.rg-empty:hover .ic, .rg-results.over .rg-empty .ic { filter: none; opacity: 1; }
/* 끌어다 놓는 상자 — 목록이 생겨도 목록 위에 남는다(더 끌어다 놓을 수 있게). 눌러도 파일을 고른다 */
.rg-empty { cursor: pointer; transition: border-color .15s, background .15s, color .15s; }
.rg-empty:hover, .rg-results.over .rg-empty { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
.rg-empty.slim { padding: 14px 16px; display: flex; align-items: center; justify-content: center; gap: 10px; line-height: 1.5; font-size: 14px; }
.rg-empty.slim .ic { font-size: 22px; margin: 0; }
.rg-empty.slim br { display: none; }
.rg-list { list-style: none; margin: 8px 0 0; padding: 0; }
.rg-item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 64px; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 8px; border-bottom: 1px solid var(--surface-3); transition: background .12s; }
.rg-item:last-child { border-bottom: 0; }
.rg-item.ready { cursor: pointer; }
.rg-item:hover { background: var(--surface-2); }
.rg-ic { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: #fef2f2; color: #ef4444; }
.rg-ic.drive { background: #ecfdf5; color: #0f9d58; }
.rg-ic svg { width: 18px; height: 18px; }
.rg-text { min-width: 0; }
.rg-text strong { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rg-text p { margin: 2px 0 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rg-text p.err { color: #ef4444; }
.rg-text p.ai { font-size: 14px; font-weight: 700; color: #2b6df3; }
.rg-text p.ai em { font-style: normal; font-weight: 400; color: var(--muted); }
.rg-text p.ai.gray { color: var(--faint); font-weight: 400; }
.rg-text p.ai.err { color: #dc2626; font-weight: 400; }
.rg-meta { min-width: 0; font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rg-meta i { font-style: normal; color: var(--faint); margin: 0 6px; }
.badge { justify-self: end; font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
.badge.s-신규 { background: #eff6ff; color: #2b6df3; } .badge.s-변경 { background: #f3e8ff; color: #7c3aed; } .badge.s-오류 { background: #fee2e2; color: #ef4444; }
.rg-foot { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px 0; font-size: 14px; font-weight: 400; color: var(--muted); }
/* 목록 비우기 — 오류 옆 휴지통 */
.rg-clear-btn { width: 30px; height: 30px; padding: 0; margin-left: -4px; border: 0; border-radius: 6px; background: transparent; display: grid; place-items: center; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
.rg-clear-btn:hover { background: #fdecec; color: #dc2626; }
.rg-clear-btn svg { width: 18px; height: 18px; }
.rg-foot button { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 3px 6px; border-radius: 5px; }
.rg-foot button:hover { background: var(--surface-3); color: var(--text); }
.rg-missing { margin-top: 10px; padding: 11px 13px; background: #fff6e8; border: 1px solid #f3dcb5; border-radius: 10px; }
.rg-missing .h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: #8a5a00; }
.rg-missing .h button { margin-left: auto; height: 28px; padding: 0 11px; border: 1px solid #e3b472; border-radius: 6px; background: #fff; font-size: 14px; font-weight: 700; color: #8a5a00; }
.rg-missing p { margin: 6px 0 0; font-size: 14px; color: #8a6400; }
.rg-missing ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: #6b5a3a; line-height: 1.6; }
/* 폴더 등록·AI 키 창 */
.dialog.fav-dlg { width: min(880px, 100%); padding: 0; overflow: hidden; }
.fav-body { padding: 10px 20px 18px; display: grid; gap: 12px; }
.fav-sub { margin: 8px 0 0; font-size: 14px; font-weight: 700; color: var(--muted); }
/* 창 안을 두 묶음으로 — 새로 등록하는 곳과 등록해 둔 목록을 상자로 가른다 */
.fav-sec { border: 1px solid var(--card-line); border-radius: 10px; padding: 12px 14px 14px; }
.fav-sec .fav-sub { margin: 0 0 9px; }
.fav-sec .fav-list { border-top: 1px solid var(--surface-3); max-height: 300px; }
.fav-form { display: grid; grid-template-columns: 1fr 2.6fr auto; gap: 6px; }
.fav-form input, .ai-body input { height: 38px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); font-size: 13.5px; min-width: 0; }
.fav-form input:focus, .ai-body input:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.fav-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--surface-3); max-height: 320px; overflow: auto; }
.fav-list li { display: grid; grid-template-columns: auto minmax(0, auto) 1fr auto; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--surface-3); }
.fav-list li:last-child { border-bottom: 0; }
/* 주소는 줄이지 않고 끝까지 보인다 — 길면 다음 줄로 */
.fav-list .url { font-size: 14px; color: var(--muted); word-break: break-all; line-height: 1.45; }
.fav-list .acts { display: flex; gap: 4px; }
.fav-list .empty-li { display: block; text-align: center; color: var(--faint); font-size: 13px; padding: 18px; }
/* 고치는 줄도 같은 모양 — 체크 · 폴더명 칸(알약 자리) · 주소 칸(주소 자리) · 저장/취소 */
.fav-list li.editing input.fav-in { height: 28px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); font-size: 14px; min-width: 0; color: var(--text); }
.fav-list li.editing input.fav-in:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.fav-list li.editing .fav-in.name { width: 190px; }
.fav-list li.editing .fav-in.url-in { width: 100%; }
.fav-list .mini { height: 28px; padding: 0 10px; } /* 저장·취소·수정·삭제 모두 주소 칸과 같은 높이 */
.fav-list li > .fchip { height: 28px; padding: 0 12px; } /* 폴더 알약도 폴더명 칸과 같은 높이 */
/* 좁은 화면 — 앱처럼 1행: 체크 · 알약(폴더명) · 버튼, 2행: 주소 */
@media (max-width: 640px) {
  .fav-form { grid-template-columns: 1fr auto; }
  .fav-form #favUrl { grid-column: 1; grid-row: 2; }
  .fav-form .btn { grid-column: 2; grid-row: 1 / span 2; height: auto; }
  .fav-list li { grid-template-columns: auto minmax(0, 1fr) auto; row-gap: 5px; }
  .fav-list li > .fchip { justify-self: start; }
  .fav-list li > .url, .fav-list li.editing .fav-in.url-in { grid-column: 2 / -1; grid-row: 2; }
  .fav-list li > .acts { grid-column: 3; grid-row: 1; }
  .fav-list li.editing .fav-in.name { width: 100%; max-width: 190px; }
}
.ai-body { padding: 4px 20px 18px; display: grid; gap: 10px; }
.ai-msg { margin: 0; font-size: 14px; color: #dc2626; }
.ai-msg.ok { color: #16a34a; }
.ai-help { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; color: var(--text-2); }
/* 키 받는 법 — 차례대로 따라오는 칸 */
.ai-steps { padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.ai-steps h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--text); }
.ai-steps h3 svg { width: 16px; height: 16px; color: #eda134; }
.ai-steps ol { margin: 0; padding-left: 18px; font-size: 14px; line-height: 2.1; color: var(--text-2); }
.ai-steps ol b { font-weight: 700; color: var(--text); }
.key-link.plain { font-size: inherit; text-decoration: none; }
.key-link.plain:hover { text-decoration: underline; }
/* 돈 걱정 더는 한 줄 — 상자 없이 글로만 */
.ai-tip { margin: 10px 0 0; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #8a6520; }
.ai-tip svg { flex: 0 0 auto; width: 14px; height: 14px; }
.ai-btns { display: flex; justify-content: flex-end; gap: 6px; }
@media (max-width: 980px) {
  .rg-row1, .rg-row2 { flex-wrap: wrap; }
  .rg-folder { flex-basis: 100%; order: 5; }
  .rg-stats { margin-left: 0; flex-basis: 100%; }
  .rg-item { grid-template-columns: 30px minmax(0, 1fr) auto; }
}
@media (max-width: 640px) {
  .crumbs { white-space: nowrap; gap: 8px; }
  .g-util { gap: 0; }
  .u-link { font-size: 0; gap: 0; padding: 0 7px; }
  .u-link svg { width: 17px; height: 17px; }
  .rg-head h2 { white-space: nowrap; }
  .rg-head .hint { display: none; }
  .rg-head .rg-chev { margin-left: auto; }
  .rg-meta { grid-column: 2 / -1; grid-row: 2; }
}
/* 떠 있는 선정물건등록 — 웹에서는 내보이지 않는다.
   머리띠에 '+물건등록'이 늘 떠 있어 같은 자리로 가는 길이 둘이 되고, 지도·목록 위를 가린다.
   (끌어 옮기는 손잡이까지 걷어내지 않고 한 줄로 감춘다 — 앱의 .wlp-fab 은 그대로 쓴다) */
.fab { display: none !important; }
.fab {
  position: fixed; z-index: 35; left: calc(max(32px, (100vw - 1280px) / 2) + 14px); bottom: calc(116px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 5px; height: 46px; padding: 0 22px; border: 0; border-radius: 999px;
  background: #2b6df3; color: #fff; font-size: 15px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap;
  box-shadow: 0 4px 12px rgba(43, 109, 243, 0.35); transition: transform .15s, box-shadow .15s, background .15s;
}
.fab .plus { font-size: 20px; line-height: 1; font-weight: 900; transition: transform .25s; }
.fab:hover { background: #1f5fe0; transform: translateY(-2px); box-shadow: 0 10px 22px -6px rgba(43, 109, 243, 0.55); }
.fab:hover .plus { transform: rotate(90deg); }
.fab:active { transform: none; }
/* 끌어서 옮기기 — 손을 떼면 그 자리를 기억한다(이 브라우저에만) */
.fab, .fab[data-tip] { position: fixed; touch-action: none; user-select: none; -webkit-user-select: none; }
.fab.dragging { cursor: grabbing; transform: scale(1.05); box-shadow: 0 16px 30px -8px rgba(43, 109, 243, 0.6); transition: none; }
.fab.dragging[data-tip]::after { display: none; }
.cta {
  position: absolute; right: 27px; top: 50%; transform: translateY(-50%); height: 43px; padding: 0 20px; border: 0; border-radius: 22px;
  background: var(--cta); color: #fff; font-size: 16px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap;
  box-shadow: 0 6px 14px -6px rgba(77, 123, 239, 0.8); transition: background .15s, transform .15s, box-shadow .15s;
}
.cta:hover { background: var(--cta-hover); transform: translateY(calc(-50% - 2px)); box-shadow: 0 10px 20px -8px rgba(77, 123, 239, 0.9); }
.cta:active { transform: translateY(-50%); }
.cta .plus { display: inline-block; margin-right: 5px; transition: transform .25s; }
.cta:hover .plus { transform: rotate(90deg); }

.tb-row2 { display: flex; align-items: center; min-height: 28px; }
/* 단계 띠 — 남는 폭을 칸 사이에 고르게 나눈다 */
.tabs { display: flex; align-items: center; justify-content: space-between; min-width: 0; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; height: 26px; padding: 0 9px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted);
  font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, color .15s, border-color .15s; text-align: left;
}
.tab.cell { min-width: 124px; }
.tab:hover { color: var(--text); background: var(--surface-3); }
.tab.on { border-color: var(--tb-line); background: var(--surface); color: var(--text); font-weight: 700; }
.tab .n { margin-left: 3px; }
.tab.hot .n { color: #dc2626; font-weight: 700; }
.tab-sep { flex: 0 0 auto; width: 1px; height: 18px; background: var(--line-2); margin: 0 22px 0 6px; }
/* 보관함·휴지통·고르기 — 윗줄 오른쪽 끝. 아랫줄은 단계 띠가 통째로 쓴다 */
.tools { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; margin-left: auto; padding-left: 12px; }
.sort-btn {
  display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px 0 11px; border-radius: 6px; border: 1px solid var(--sort-line);
  background: var(--sort-bg); color: var(--sort-text); font-size: 13px; font-weight: 500; white-space: nowrap; transition: filter .15s;
}
.sort-btn .swap { width: 12px; height: 10px; margin-left: 4px; }
.tb-pair { display: inline-flex; gap: 8px; }
/* 카드 ⇄ 목록 — 정렬 버튼과 같은 꼴. 카드는 회색, 목록으로 바꾸면 파랑 */
.sort-btn.layout { border-color: var(--line-2); background: var(--surface-2); color: var(--text-2); }
.sort-btn.layout.on { border-color: #d2e2fb; background: #eaf1ff; color: var(--blue); }
.sort-btn.on { border-color: #d2e2fb; background: #eaf1ff; color: var(--blue); }
.sort-btn:hover { filter: brightness(.96); }
.sort-btn svg { width: 15px; height: 15px; }
.cnt-btn {
  display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--text); font-size: 14px; white-space: nowrap; transition: border-color .15s, background .15s;
}
.cnt-btn:hover, .cnt-btn[aria-expanded="true"] { border-color: var(--line-2); background: var(--surface-2); }
.cnt-btn svg { width: 18px; height: 18px; color: var(--muted); }
.cnt-btn em { font-style: normal; font-size: 9.5px; color: var(--faint); margin: 0 1px 0 2px; }
.pick-btn { width: 34px; height: 32px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text-2); padding: 0; transition: background .15s, border-color .15s; }
.pick-btn:hover { border-color: #b8c1d1; background: var(--surface-2); }
.pick-btn.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.pick-btn svg { width: 18px; height: 18px; }
.layout-btn { width: 30px; height: 28px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); padding: 0; transition: background .15s, border-color .15s, color .15s; }
.layout-btn:hover { border-color: var(--line-2); background: var(--surface-2); color: var(--text); }
.layout-btn.on { border-color: #9fb8f5; background: var(--blue-soft); color: #2a5fbf; }
.layout-btn svg { width: 17px; height: 17px; }

/* 단계 띠 — 앱 .wlp-step 색 그대로. 글자에 단계 색, 고르면 그 색으로 채운다 */
.step {
  --c: var(--st-all); --cb: var(--st-all-bg);
  flex: 0 0 auto; height: 28px; padding: 0 7px; border: 0; border-radius: 6px; background: transparent; color: var(--c);
  font-size: 13px; font-weight: 400; letter-spacing: -0.3px; white-space: nowrap;
  box-shadow: inset 0 0 0 1px transparent; transition: background .15s, color .15s, box-shadow .15s;
}
.step em { font-style: normal; font-weight: 400; margin-left: 3px; opacity: .95; }
/* 테두리는 글자 굵기(보통)에 맞춰 1px */
.step:hover { box-shadow: inset 0 0 0 1px var(--cb); }
/* 고르면 반전 — 단계 색으로 차고 글자는 흰색 */
.step.on, .step.on:hover { background: var(--cb); color: #fff; box-shadow: none; }
.step.on em { opacity: .85; }
.step.st-other { --c: var(--st-other); --cb: var(--st-other-bg); }
.step.st-won { --c: var(--st-won); --cb: var(--st-won-bg); }
.step.st-fail { --c: var(--st-fail); --cb: var(--st-fail-bg); }
.step.st-cancel { --c: var(--st-cancel); --cb: var(--st-cancel-bg); }
.step.st-sold { --c: var(--st-sold); --cb: var(--st-sold-bg); }
/* 낙찰·유찰·취소는 한 칸 — ▾ 로 셋 중 하나를 고른다 */
.step .dd { font-style: normal; font-size: 10px; margin-left: 6px; opacity: .8; display: inline-block; transition: transform .15s; }
.step[aria-expanded="true"] .dd { transform: rotate(180deg); }
.step.st-desk { --c: var(--st-desk); --cb: var(--st-desk-bg); }
.step.st-plan { --c: var(--st-plan); --cb: var(--st-plan-bg); }
.step.st-visited { --c: var(--st-visited); --cb: var(--st-visited-bg); }
.step.st-bid { --c: var(--st-bid); --cb: var(--st-bid-bg); }
.step.st-running { --c: var(--st-running); --cb: var(--st-running-bg); }
/* 단계 사이 — 가는 꺾쇠(>) */
.step-arrow { flex: 0 0 auto; width: 6px; height: 6px; font-size: 0; border-top: 1.5px solid #c8cdd5; border-right: 1.5px solid #c8cdd5; transform: rotate(45deg); margin: 0 4px 0 1px; }
.step-gap { flex: 0 0 auto; width: 4px; }
/* 전체 — 종전처럼 흰 상자 + 테두리, 굵은 검정 글자. 옆에 세로 줄로 단계와 가른다 */
/* 전체 — 다른 단계와 같은 상자(모서리 6px = 위 칸 펼침 상자와 같은 둥글기), 흰 바탕 + 가는 회색 테두리 */
.step.st-all { color: var(--muted); }
.step.st-all:hover { box-shadow: inset 0 0 0 1px var(--tb-line); color: var(--text); }
.step.st-all.on, .step.st-all.on:hover { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--tb-line); }
.step-dot { flex: 0 0 auto; width: 4px; height: 4px; border-radius: 50%; background: #c8cdd5; margin: 0 2px; }
.step-sep { flex: 0 0 auto; width: 1.5px; height: 14px; border-radius: 1px; background: var(--line-2); margin: 0 4px; }
/* 수익률 분석 카드가 옆에 설 때 — 단계 띠 오른쪽 끝을 물건 카드의 알약 끝(카드 오른쪽 안쪽)에 맞춘다.
   300(수익률 분석) + 12(틈) + 카드 오른쪽 안쪽 여백 − 24(상자 안쪽 여백) − 1(테두리) */
@media (min-width: 1340px) { .tb-row2 { padding-right: calc(287px + var(--list-pad-r)); } }

.chips-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 2px 0; }
.chips-row:empty { display: none; }
.chips-row.keep { display: flex; min-height: 34px; }
.f-chip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 10px; border-radius: 13px; background: var(--blue-soft); color: #2a5fbf; border: 1px solid #c9d8ff; font-size: 14px; font-weight: 600; }
.f-chip button { width: 18px; height: 18px; border: 0; background: transparent; color: inherit; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.f-chip button:hover { background: rgba(42, 95, 191, 0.14); }
.f-chip svg { width: 10px; height: 10px; }
.chips-row .n { font-size: 14px; color: var(--text-2); margin-right: 4px; }
.chips-row .reset { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 3px 6px; border-radius: 5px; }
.chips-row .reset:hover { color: var(--text); background: var(--surface-3); }

.pickbar { display: flex; gap: 6px; margin-top: 10px; padding: 7px 8px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); align-items: center; }
.pickbar .msg { margin: 0 auto 0 6px; font-size: 13px; font-weight: 600; }
.pickbar .msg b { color: var(--blue); }
.pickbar button { min-width: 84px; height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); font-size: 14px; font-weight: 700; color: var(--text-2); transition: background .15s, border-color .15s; }
.pickbar button:hover:not(:disabled) { border-color: #b8c1d1; color: var(--text); }
.pickbar button.purge { border-color: var(--danger-line); color: var(--danger); }
.pickbar button.purge:hover:not(:disabled) { background: rgba(209, 67, 67, 0.06); }
.pickbar button:disabled { opacity: .45; cursor: not-allowed; }

/* ================= 팝오버 ================= */
.pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; min-width: 200px; padding: 6px; background: var(--surface); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-pop); animation: pop-in .14s ease-out;
}
/* 이미 펼쳐 둔 목록 — 고를 때마다 다시 그려지는데, 그때 열림 애니메이션이 또 돌면 상자가 튄다 */
.pop.no-anim { animation: none; }
.pop.right { left: auto; right: 0; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.pop-title { padding: 7px 10px 5px; font-size: 14px; font-weight: 700; color: var(--faint); }
.opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent; text-align: left; font-size: 13px; color: var(--text) !important; transition: background .12s; white-space: nowrap; }
.opt:hover { background: var(--surface-3); }
.opt.on { color: #2a5fbf !important; font-weight: 700; background: var(--blue-soft); }
.opt svg { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
.opt.on svg { color: #2a5fbf; }
.opt .r { margin-left: auto; color: var(--faint); font-size: 14px; }
.opt .ck-mark { margin-left: auto; width: 14px; height: 14px; color: #2a5fbf; }
.opt-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.filter-pop { width: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px; }
.filter-pop .col { min-width: 0; }
.filter-pop .col + .col { border-left: 1px solid var(--line); padding-left: 6px; }

.cal { width: 326px; padding: 16px 20px 16px; } /* 안쪽 여백 넉넉히 — 요일 · 날짜 · 안내가 상자 끝에 붙지 않게 */
.cal-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; }
.cal-head b { font-size: 16px; } /* 달력 글자 — 제목 16 · 요일 15 · 날짜 · 안내 14 */
.cal-head button { width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.cal-head button:hover { background: var(--surface-3); color: var(--text); }
.cal-head svg { width: 15px; height: 15px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 2px; }
.cal-grid .w { text-align: center; font-size: 15px; color: var(--text-2); padding: 3px 0; }
.cal-grid .w.sun, .cal-day.sun { color: #dc2626; }
.cal-grid .w.sat, .cal-day.sat { color: #2563eb; }
.cal-day { position: relative; justify-self: center; align-self: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: transparent; font-size: 14px; color: var(--text); }
.cal-day:hover:not(:disabled) { background: var(--surface-3); }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--blue); }
/* 입찰 있는 날 — 파란 동그라미에 흰 숫자(점 대신). 고른 날은 바깥에 파란 고리를 하나 더 */
.cal-day.has { background: var(--blue); color: #fff; font-weight: 700; }
.cal-day.has:hover:not(:disabled) { background: var(--blue); filter: brightness(1.12); }
/* 고른 날 — 흐린 파랑. 입찰일을 고르면 파란 원 둘레에 흐린 파랑 고리 */
.cal-day.on, .cal-day.on:hover:not(:disabled) { background: color-mix(in srgb, var(--blue) 28%, transparent); font-weight: 700; filter: none; }
.cal-day.has.on, .cal-day.has.on:hover:not(:disabled) { background: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 32%, transparent); }
.cal-key { display: inline-flex; align-items: center; gap: 6px; }
.cal-keys { display: inline-flex; align-items: center; gap: 14px; }
.cal-key i { width: 12px; height: 12px; border-radius: 50%; background: var(--blue); }
.cal-key i.ring { background: transparent; box-shadow: inset 0 0 0 1.5px var(--blue); }
.cal-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; margin-top: 4px; font-size: 14px; color: var(--faint); }
.cal-foot button { border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-size: 14px; padding: 4px 9px; border-radius: 6px; }
.cal-foot button:hover { border-color: var(--line-2); color: var(--text); }

.bin { width: 360px; padding: 0; overflow: hidden; }
.bin-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; font-size: 14px; font-weight: 700; }
.bin-head span { color: var(--faint); font-weight: 500; margin-left: 4px; }
.bin-head .x { width: 26px; height: 26px; border: 0; background: transparent; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }
.bin-head .x:hover { background: var(--surface-3); color: var(--text); }
.bin-head .x svg { width: 14px; height: 14px; }
.bin-acts { display: flex; gap: 6px; padding: 0 14px 10px; }
.bin-acts button { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); font-size: 14px; font-weight: 700; color: var(--text-2); }
.bin-acts button:hover:not(:disabled) { color: var(--text); border-color: #b8c1d1; }
.bin-acts button.apply { background: var(--blue); border-color: var(--blue); color: #fff; }
.bin-acts button.purge { margin-left: auto; color: var(--danger); border-color: var(--danger-line); }
.bin-acts button:disabled { opacity: .45; cursor: not-allowed; }
.bin-list { list-style: none; margin: 0; padding: 4px 6px 6px; max-height: 300px; overflow: auto; border-top: 1px solid var(--line); }
.bin-item { display: flex; gap: 9px; align-items: flex-start; padding: 9px 8px; border-radius: 8px; cursor: pointer; transition: background .12s; }
.bin-item:hover { background: var(--surface-3); }
.bin-item.picked { background: var(--blue-soft); }
.bin-item .case { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.bin-item .addr { font-size: 14px; color: var(--text-2); }
.bin-empty { padding: 24px 14px; text-align: center; color: var(--faint); font-size: 14px; border-top: 1px solid var(--line); }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 9px; font-size: 14px; font-weight: 700; background: var(--surface-3); color: var(--text-2); }
.tag.hot { background: var(--hot-bg); color: var(--hot-text); }

.ck { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 1px 0 0; border-radius: 4px; border: 1.5px solid #b8c1d1; background: var(--surface); display: inline-grid; place-items: center; flex: 0 0 auto; cursor: pointer; transition: background .12s, border-color .12s; }
.ck:hover { border-color: var(--blue); }
.ck:checked { background: var(--blue); border-color: var(--blue); }
.ck:checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }

/* ================= 카드 — 앱 .wlp-card 를 웹 크기로 ================= */
.content { padding-block: 11px 72px; min-height: 520px; }
/* 알약이 아홉 개라 카드는 한 줄에 하나 — 가로로 길게 */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.grid .divider { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: 14px 2px 2px; color: var(--muted); font-size: 13px; }
.grid .divider b { color: var(--text); font-size: 14px; }
.grid .divider i { flex: 1; height: 1px; background: #d3d6dc; }
/* 한 줄 = 물건 카드 + 오른쪽 수익률 분석 카드 */
.card-row { display: flex; gap: 12px; align-items: stretch; min-width: 0; }
.card-row > .card { flex: 1 1 auto; }
.res {
  position: relative; flex: 0 0 300px; display: flex; flex-direction: column; gap: 8px; padding: 16px var(--list-pad-r) 15px; min-width: 0;
  background: var(--surface); border: 1px solid var(--card-line); border-radius: 10px; box-shadow: var(--shadow-card); cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.res:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: #c9d4f5; z-index: 4; }
.res-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 30px; padding: 0 2px; font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; }
.res-title { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }
.res-title svg { width: 18px; height: 18px; color: var(--blue); flex: 0 0 auto; }
.res.past .res-title svg { color: var(--past-text); }
.res-head span { font-size: 14px; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.metric { position: relative; flex: 1 1 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; min-height: 40px; border-radius: 8px; background: var(--price-bg); border: 1px solid transparent; transition: border-color .15s; }
.metric:hover { border-color: var(--line); }
.metric small { font-size: 13px; color: var(--muted); white-space: nowrap; }
.metric strong { font-size: 16px; font-weight: 800; color: var(--text); white-space: nowrap; letter-spacing: -0.3px; }
.metric strong em { font-style: normal; font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 1px; }
.metric strong.neg { color: #dc2626; }
.metric strong.none { font-size: 14px; font-weight: 600; color: var(--faint); }
.metric.rate { background: var(--mine-bg); }
.metric.rate strong { color: var(--mine-text); font-size: 18px; }
.metric.rate strong.neg { color: #dc2626; }
.res.past .res-head, .res.past .metric small, .res.past .metric strong, .res.past .metric strong em { color: var(--past-text) !important; }
.res.past .metric { background: #fbfcfe; }
:root[data-theme="dark"] .res.past .metric { background: var(--surface-2); }
.card {
  position: relative; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--card-line); border-radius: 10px;
  padding: 16px var(--list-pad-r) 15px var(--list-pad-l); box-shadow: var(--shadow-card); cursor: pointer; min-width: 0;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: #c9d4f5; }
/* 마우스를 올린 카드를 맨 위 층으로 — 말풍선이 옆·아래 카드에 깔리지 않게 */
.card:hover, .card:focus-within { z-index: 4; }
.card.picked { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue), var(--shadow-card); }
.card.menu-open { z-index: 5; }
.c-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; }
.c-meta { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1 1 auto; white-space: nowrap; padding-left: 1px; }
.c-date { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 400; color: var(--text); flex: 0 0 auto; letter-spacing: 0; }
.c-date svg { width: 14px; height: 14px; color: var(--muted); flex: 0 0 auto; }
.card.past .c-date svg { color: var(--past-text); }
.c-court { font-size: 13px; font-weight: 500; color: var(--text-2); flex: 0 3 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.c-case, .c-court { display: inline-flex; align-items: center; gap: 5px; }
.c-case svg, .c-court svg { width: 14px; height: 14px; color: var(--muted); flex: 0 0 auto; }
.c-court .full, .c-court .short { overflow: hidden; text-overflow: ellipsis; }
.c-case { font-size: 13px; color: var(--text); flex: 0 0 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
.c-court .short { display: none; }
/* 법원 이름이 칸에 다 안 들어가면 앱처럼 줄여 쓴다 ('서울남부지방법원' → '서울남부법원') */
.c-court.use-short .full { display: none; } .c-court.use-short .short { display: inline; }
.c-acts { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.stars { display: inline-flex; align-items: center; gap: 1px; margin-right: 8px; }
.star { width: 20px; height: 30px; border: 0; background: transparent; padding: 0; display: grid; place-items: center; }
.star svg { width: 17px; height: 17px; transition: transform .12s; }
.star polygon { fill: none; stroke: var(--star-empty); stroke-width: 2; stroke-linejoin: round; transition: fill .12s, stroke .12s; }
.star.f polygon { fill: var(--star); stroke: var(--star-line); }
.stars.preview .star polygon { fill: none; stroke: var(--star-empty); }
.stars.preview .star.p polygon { fill: color-mix(in srgb, var(--star) 60%, transparent); stroke: var(--star-line); }
.star:hover svg { transform: scale(1.2); }
.ibtn { width: 28px; height: 30px; border: 0; background: transparent; border-radius: 6px; color: var(--muted); display: grid; place-items: center; padding: 0; transition: background .12s, color .12s; }
.ibtn svg { width: 17px; height: 17px; }
.ibtn:hover { background: var(--surface-3); color: var(--blue); }
.ibtn.del:hover { color: #dc2626; background: rgba(220, 38, 38, 0.08); }
.addr-row { min-width: 0; }
.c-addr { display: flex; align-items: center; min-width: 0; margin: 0; font-size: 16px; font-weight: 800; color: var(--text); line-height: 1.35; white-space: nowrap; letter-spacing: -0.3px; padding-left: 1px; }
.c-addr .type-mark { flex: 0 0 auto; }
.c-addr .a-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* 주소 옆 토지·건물 면적 — 보조 글자 */
/* 오른쪽 끝에 붙여 카드마다 같은 자리에 선다 */
.c-addr .a-area { flex: 0 0 auto; margin-left: auto; padding-left: 16px; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.c-addr .a-area i { font-style: normal; color: var(--faint); margin: 0 5px; }
.c-addr .a-area s { text-decoration: none; color: var(--faint); margin: 0 4px; }
.card.past .c-addr .a-area { color: var(--past-text); }
/* 면적 말풍선을 볼 때는 주소 줄 말풍선을 감춘다 — 둘이 겹쳐 뜨지 않게 */
.addr-row:has(.a-area:hover)::after { display: none; }
.c-addr b { color: var(--blue); font-weight: 800; }
.c-addr .done { text-decoration: line-through; color: var(--faint); }
.c-addr .done b { color: var(--faint); }
.c-addr mark { background: rgba(250, 204, 21, 0.45); color: inherit; border-radius: 2px; }
.type-mark { display: inline-flex; align-items: center; justify-content: center; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--blue); color: #fff; font-size: 14px; font-weight: 700; line-height: 1; letter-spacing: -0.2px; margin-right: 8px; vertical-align: 2px; white-space: nowrap; }
.prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.price { position: relative; display: flex; align-items: baseline; gap: 6px; min-width: 0; padding: 9px 8px 8px; border-radius: 8px; background: var(--price-bg); border: 1px solid transparent; transition: border-color .15s; }
.price:hover { border-color: var(--line); }
.price small { font-size: 13px; color: var(--muted); flex: 0 0 auto; }
.price strong { flex: 1 1 auto; min-width: 0; text-align: right; font-size: 16px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }
.price strong em { font-style: normal; font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 1px; }
.price.mine { background: var(--mine-bg); }
.price.mine:hover { border-color: #c9d8ff; }
.price.mine strong { color: var(--mine-text); }
.price.mine strong.none { color: var(--faint); font-size: 14px; font-weight: 600; }
.phases { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 10px; }
.phase {
  position: relative; flex: 1 1 0; min-width: 0; height: 26px; border: 1.5px solid var(--pill-line); background: var(--surface); color: var(--pill-text);
  border-radius: 6px; padding: 0 8px; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1;
  transition: border-color .15s, background .15s, color .15s;
}
.phase:hover { border-color: var(--on-line); color: var(--on-text); }
.phase.on { border-color: var(--on-line); background: var(--on-bg); color: var(--on-text); }
.phase.hot { border-color: var(--hot-line); background: var(--hot-bg); color: var(--hot-text); font-weight: 800; }
.phase.closed { border-color: var(--pill-line); background: var(--closed-bg); color: var(--pill-text); }
/* 카드의 단계 알약(손품조사 ~ 매도) — 고르지 않은 것은 보통 굵기, 지금 단계(on · hot · closed)만 굵게 */
.phases .phase { font-weight: 400; }
.phases .phase:is(.on, .hot, .closed) { font-weight: 700; }
/* 낙찰·유찰·취소 알약 — ▾ 를 글자 바로 뒤에 붙여 일곱 알약 폭이 똑같게 */
.phase.has-caret .caret { position: static; transform: none; margin-left: 3px; font-size: 11px; vertical-align: 0; }
.phase .caret { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 15px; opacity: .85; }
.phase-arrow { flex: 0 0 auto; font-size: 11px; color: var(--pill-line); transition: color .15s; }
.phase-dot { flex: 0 0 auto; width: 4px; height: 4px; margin: 0 3px; border-radius: 50%; background: var(--pill-line); transition: background .15s; }
.card:hover .phase-dot { background: #aab6c8; }
.card:hover .phase-arrow { color: #aab6c8; }
/* 고르기 — 앱처럼 카드 첫 줄 맨 왼쪽(달력 앞)에 체크가 선다 */
.c-top .pick-ck { flex: 0 0 auto; width: 18px; height: 18px; margin: 0 -2px 0 0; }
.card.pickmode .c-acts { display: none; }
/* 입찰일이 지난 카드 — 앱처럼 왼쪽 위 빨간 삼각형 + 흐린 글자. 단추와 켜진 알약은 산다 */
/* 잘라내기(overflow) 없이 삼각형만 카드 모서리 둥글기에 맞춘다 — 말풍선이 카드 밖으로 나갈 수 있게 */
.card.past::before { content: ""; position: absolute; top: -1px; left: -1px; z-index: 1; width: 31px; height: 31px; background: var(--ribbon); border-top-left-radius: 10px; clip-path: polygon(0 0, 100% 0, 0 100%); }
.ribbon { position: absolute; z-index: 2; top: 2px; left: 2px; display: inline-flex; color: #fff; pointer-events: none; }
.ribbon svg { width: 13px; height: 13px; }
.card.past .c-date, .card.past .c-court, .card.past .c-case, .card.past .c-addr, .card.past .c-addr b,
.card.past .price strong, .card.past .price strong em, .card.past .price small { color: var(--past-text) !important; }
.card.past .star polygon { stroke: var(--past-line); fill: none; }
.card.past .type-mark { background: #e4e8ef; }
.card.past .price { background: #fbfcfe; }
.card.past .phase:not(.on):not(.hot):not(.closed) { border-color: #ebeef3; color: var(--faint); }
:root[data-theme="dark"] .card.past .price { background: var(--surface-2); }
:root[data-theme="dark"] .card.past .type-mark { background: #3a4458; }
:root[data-theme="dark"] .card.past .phase:not(.on):not(.hot):not(.closed) { border-color: var(--line); }
.ribbon-hit { position: absolute !important; top: 0; left: 0; width: 30px; height: 30px; z-index: 3; }

/* 표 */
.table-wrap { background: var(--surface); border: 1px solid var(--card-line); border-radius: 10px; overflow-x: auto; box-shadow: var(--shadow-card); }
table.list { width: 100%; border-collapse: collapse; min-width: 1150px; }
.list th { text-align: left; font-size: 14px; font-weight: 700; color: var(--muted); padding: 11px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.list th.r, .list td.r { text-align: right; }
.list td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
.list tbody tr { cursor: pointer; transition: background .12s; }
.list tbody tr:hover { background: var(--surface-2); }
.list tbody tr.picked { background: var(--blue-soft); }
.list tbody tr.past td { color: var(--past-text); }
.list tr:last-child td { border-bottom: 0; }
.list .t-date { font-weight: 700; white-space: nowrap; }
.list .t-case { white-space: nowrap; }
.list .t-case b { display: block; }
.list .t-case span { color: var(--text-2); font-size: 14px; }
/* 주소는 한 줄 — 남는 폭을 다 쓰고, 그래도 넘치면 … (올리면 전체 주소 말풍선) */
.list .t-addr { font-weight: 700; width: 100%; max-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list td:not(.t-addr), .list th { padding-left: 10px; padding-right: 10px; }
.list .t-addr b { color: var(--blue); }
.list .t-price { white-space: nowrap; font-weight: 700; }
.list .t-price small { display: block; color: var(--faint); font-size: 14px; font-weight: 500; }
.list .t-price.mine { color: var(--mine-text); }
.list .row-acts { display: flex; gap: 2px; justify-content: flex-end; opacity: 0; transition: opacity .15s; }
.list tbody tr:hover .row-acts, .list tbody tr:focus-within .row-acts { opacity: 1; }
.list .phase { flex: 0 0 auto; height: 26px; padding: 0 22px 0 12px; font-size: 14px; overflow: visible; }
.list .phase .caret { right: 8px; font-size: 13px; }
.list .stars { margin: 0; }

.empty { display: grid; place-items: center; text-align: center; gap: 6px; padding: 72px 20px; background: var(--surface); border: 1px dashed var(--line-2); border-radius: 10px; color: var(--text-2); }
.empty b { font-size: 16px; color: var(--text); }
.empty button { margin-top: 10px; height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; font-weight: 700; }
.empty button:hover { border-color: var(--blue); color: var(--blue); }

/* 말풍선 */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 7px); transform: translate(-50%, 3px); z-index: 70;
  background: #1f2937; color: #f9fafb; font-size: 14px; font-weight: 600; line-height: 1.3; padding: 5px 8px; border-radius: 6px; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .12s, transform .12s; letter-spacing: 0; text-decoration: none;
}
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); transition-delay: .2s; }
[data-tip-pos="right"]::after { left: auto; right: 0; transform: translateY(3px); }
[data-tip-pos="right"]:hover::after { transform: none; }
[data-tip-pos="left"]::after { left: 0; transform: translateY(3px); }
[data-tip-pos="left"]:hover::after { transform: none; }
[data-tip-pos="below"]::after, .tip-below::after { bottom: auto !important; top: calc(100% + 7px); }
.gnb .g-box[data-tip], .gnb .g-user { position: absolute; }
[aria-expanded="true"][data-tip]::after { display: none; }
/* 손가락 화면에서는 말풍선을 끈다 — 숨은 말풍선이 가로 스크롤을 만들지 않게 */
@media (hover: none), (max-width: 640px) { [data-tip]::after { display: none; } }
/* 표 상자(가로 스크롤)는 밖으로 나간 말풍선을 자른다 — 표 안 말풍선은 맨 위층(.tip-float)에 따로 띄운다 */
.table-wrap [data-tip]::after { display: none; }
.tip-float { position: fixed; z-index: 9999; left: 0; top: 0; background: #1f2937; color: #f9fafb; font-size: 14px; font-weight: 600; line-height: 1.3; padding: 5px 8px; border-radius: 6px; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .12s; }
.tip-float.on { opacity: 1; transition-delay: .2s; }
@media (hover: none), (max-width: 640px) { .tip-float { display: none; } }
html, body { overflow-x: clip; }

/* 떠 있는 메뉴 */
.float-menu { position: fixed; z-index: 80; width: 172px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-pop); animation: pop-in .12s ease-out; }
.float-menu .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--pill-line); flex: 0 0 auto; }
.float-menu .sw.hot { background: #dc2626; }
.float-menu .sw.on { background: var(--on-line); }
.float-menu .opt.back { color: var(--muted) !important; font-size: 14px; }

/* 창 */
.scrim { position: fixed; inset: 0; z-index: 90; background: var(--scrim); display: grid; place-items: center; padding: 20px; animation: fade .14s ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.dialog { width: min(400px, 100%); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-pop); padding: 22px 22px 16px; animation: rise .18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.dialog h2 { margin: 0 0 6px; font-size: 17px; }
.dialog p { margin: 0; color: var(--text-2); font-size: 13.5px; }
.dialog .skip { display: flex; align-items: center; gap: 7px; margin-top: 14px; font-size: 14px; color: var(--text-2); cursor: pointer; width: fit-content; }
.dialog .btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 18px; }
.btn { height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13.5px; font-weight: 700; color: var(--text-2); transition: background .15s, border-color .15s, color .15s; }
.btn:hover { border-color: #b8c1d1; color: var(--text); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { filter: brightness(.94); }
.btn.danger { background: #dc2626; border-color: #dc2626; color: #fff; }
.btn.danger:hover { filter: brightness(.94); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.reg { width: min(520px, 100%); padding: 0; overflow: hidden; }
.reg-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 0; }
.reg-head h2 { margin: 0; }
.reg-head .x { width: 30px; height: 30px; border: 0; background: transparent; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }
.reg-head .x:hover { background: var(--surface-3); color: var(--text); }
.reg-head .x svg { width: 16px; height: 16px; }
.reg-tabs { display: flex; gap: 2px; padding: 12px 20px 0; border-bottom: 1px solid var(--line); }
.reg-tabs button { position: relative; height: 38px; padding: 0 10px; border: 0; background: transparent; font-size: 13.5px; font-weight: 700; color: var(--faint); }
.reg-tabs button:hover { color: var(--text); }
.reg-tabs button.on { color: var(--blue); }
.reg-tabs button.on::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; background: var(--blue); }
.reg-body { padding: 18px 20px; display: grid; gap: 14px; }
.field label { display: block; font-size: 14px; font-weight: 700; color: var(--text-2); margin-bottom: 5px; }
.field label span { color: var(--faint); font-weight: 500; }
.field input, .field select { width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-size: 14px; transition: border-color .15s, box-shadow .15s; }
.field input:hover, .field select:hover { border-color: #b8c1d1; }
.field input:focus, .field select:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.field .hint { font-size: 14px; color: var(--faint); margin-top: 5px; }
.field.err input { border-color: #dc2626; }
.field .msg { font-size: 14px; color: #dc2626; margin-top: 5px; font-weight: 600; }
.case-row { display: grid; grid-template-columns: 100px 1fr; gap: 6px; }
.drop { display: grid; place-items: center; gap: 5px; text-align: center; padding: 30px 14px; border-radius: 10px; border: 1.5px dashed var(--line-2); background: var(--surface-2); color: var(--text-2); cursor: pointer; font-size: 14px; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--blue); background: var(--blue-soft); }
.drop svg { width: 30px; height: 30px; color: var(--blue); }
.drop b { color: var(--text); font-size: 14px; }
.drop input { display: none; }
.note { display: flex; gap: 8px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 14px; color: var(--text-2); }
.note svg { width: 15px; height: 15px; color: var(--blue); flex: 0 0 auto; margin-top: 1px; }
.reg-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 12px 20px 16px; border-top: 1px solid var(--line); background: var(--surface-2); }

.toasts { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 100; display: grid; gap: 6px; justify-items: center; pointer-events: none; max-width: calc(100vw - 32px); }
.toast { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: #1f2937; color: #f9fafb; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-pop); animation: rise .18s ease-out; }
.toast svg { width: 16px; height: 16px; flex: 0 0 auto; }
.toast.success svg { color: #4ade80; } .toast.error svg { color: #f87171; } .toast.info svg { color: #93c5fd; }

/* ================= 바닥글 — 시안 그대로 ================= */
.foot { background: var(--foot); color: var(--foot-text); }
.foot-in { position: relative; min-height: 164px; padding-block: 26px 48px; } /* 바닥 띠를 얇게 — 로고 위 여백을 줄였다(56 → 26) */
.f-brand { display: flex; align-items: center; gap: 10px; margin: 0 0 12px 3px; }
.f-brand img { height: 32px; width: auto; display: block; } /* 머리띠 로고(44px)와 너무 벌어지지 않게 */
.f-brand span { color: #c8cdd8; font-size: 14px; padding-left: 9px; border-left: 1px solid #5d6476; line-height: 1; }
.f-info { margin: 0 0 0 3px; font-size: 14px; line-height: 1.55; }
/* 저작권 — 맨 아랫줄 가운데, 바닥에서 조금 띄운다 */
.f-copy { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 14px; color: var(--foot-text); letter-spacing: .2px; white-space: nowrap; }
.f-links { position: absolute; left: 78.8%; top: 29px; display: flex; gap: 28px; }
.f-links a { color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; white-space: nowrap; background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .2s; }
.f-links a:hover { background-size: 100% 1px; }
.f-social { position: absolute; left: 78.8%; top: 70px; display: flex; align-items: center; gap: 22px; height: 34px; }
.f-social a { display: inline-flex; align-items: center; gap: 6px; color: #c8cdd8; text-decoration: none; font-size: 14px; transition: color .15s; }
.f-social a:hover { color: #fff; }
.f-social svg { width: 14px; height: 14px; }

/* ================= 좁은 화면 — 시안 좌표를 지킬 수 없으면 줄을 세운다 ================= */
@media (max-width: 1240px) {
  .gnb-in { display: flex; align-items: center; gap: 22px; }
  .gnb .g-logo, .gnb .g-menu, .gnb .g-icons, .gnb .g-box, .gnb .g-box[data-tip], .gnb .g-user { position: relative; left: auto; top: auto; }
  :root { --menu-fs: 16px; --tab-fs: 15px; --tab-px: 16px; }
  .g-menu::after { bottom: -20px; }
  .g-menu.m4 { margin-left: auto; }
  .g-icons { order: 10; } .g-box { order: 11; flex: 0 0 auto; }
  .g-user { order: 12; } .g-login, .g-out, .g-join { font-size: var(--menu-fs); }
  .g-login .txt { min-width: 0; } .g-out, .g-join { margin-left: 14px; }
  .g-pop.user { left: auto; right: 0; }
  .g-mega-in { min-height: 0; display: flex; flex-wrap: wrap; gap: 8px 36px; padding-block: 14px 18px; }
  .g-col { position: static; }
  .f-copy, .f-links, .f-social { position: relative; left: auto; top: auto; margin-top: 14px; width: fit-content; }
  .foot-in { display: grid; padding-bottom: 22px; }
  .f-copy { transform: none; bottom: auto; justify-self: center; margin-top: 26px; order: 10; white-space: normal; text-align: center; }
}
/* 두 줄 카드가 좁아지는 폭 — 앱처럼 법원을 줄여 쓰고 글자를 한 단계 내린다 */
@media (max-width: 1240px) {
  .search, .search:focus-within { width: 280px; }
}
@media (max-width: 1100px) {
  .step { padding: 0 5px; font-size: 14px; }
  /* 윗줄 글자는 단계 글자보다 크지 않게 */
  .chip, .sort-btn, .search input, .cnt-btn { font-size: 14px; }
}
/* 수익률 분석 카드를 옆에 둘 폭이 모자라면(1340 미만) 물건 카드 아래로 */
@media (max-width: 1339px) {
  .card-row { flex-direction: column; gap: 6px; }
  .res { flex: none; flex-direction: row; flex-wrap: wrap; align-items: stretch; padding: 10px 12px; }
  .res-head { flex: 1 1 100%; min-height: 0; }
  .metric { min-height: 40px; }
}
@media (max-width: 980px) {
  .gnb-in { flex-wrap: wrap; height: auto; padding-block: 12px; row-gap: 8px; column-gap: 16px; }
  .g-menu.m4 { margin-left: 0; }
  .g-menu::after { bottom: -6px; }
  .toolbar { padding: 10px 14px; row-gap: 8px; }
  .rg-results { padding-left: 14px; padding-right: 14px; }
  .search { width: 100%; margin-left: 0; }
  .search:focus-within { width: 100%; }
  .tb-row2 { flex-wrap: wrap; }
  .tabs { flex: 1 1 100%; }
  .tools { padding: 0; margin-left: auto; }
}
@media (max-width: 640px) {
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .toolbar-shell { padding: 6px 0 12px; }
  .gnb-in { gap: 6px 14px; }
  .g-logo img { height: 32px; }
  :root { --menu-fs: 14px; --tab-fs: 14px; --tab-px: 10px; }
  .g-menu::after { display: none; }
  .step { padding: 0 9px; font-size: 14px; }
  .fab { left: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); height: 42px; padding: 0 18px; font-size: 14px; }
  .step-arrow { margin: 0 6px 0 3px; }
  .grid .divider span { display: none; }
  .res { gap: 5px; padding: 10px; }
  .metric { flex: 1 1 100%; padding: 0 8px; min-height: 34px; }
  .metric small { font-size: 14px; } .metric strong { font-size: 14px; } .metric.rate strong { font-size: 15px; } .metric strong em { font-size: 14px; }
  .card { padding: 10px; gap: 7px; }
  .c-meta { gap: 8px; overflow: hidden; }
  .c-case { flex: 0 1 auto; }
  .c-date, .c-case { font-size: 13px; }
  .c-court { font-size: 13px; }
  .c-addr { font-size: 14.5px; flex-wrap: wrap; }
  .c-addr .a-text { flex: 1 1 0; }
  .c-addr .a-area { flex-basis: 100%; margin: 2px 0 0; padding-left: 0; text-align: right; font-size: 14px; }
  .type-mark { height: 19px; padding: 0 6px; border-radius: 10px; font-size: 14px; margin-right: 6px; vertical-align: 1px; }
  .star { width: 17px; } .star svg { width: 15px; height: 15px; }
  .c-acts { gap: 2px; } .stars { gap: 0; margin-right: 4px; }
  .ibtn { width: 24px; } .ibtn svg { width: 16px; height: 16px; }
  .prices { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 5px; margin-top: 2px; }
  .price { padding: 6px 8px; }
  .price:not(.mine) { flex-direction: column; align-items: stretch; gap: 1px; }
  .price.mine { grid-column: 1 / -1; }
  .price small { font-size: 14px; }
  .price strong { font-size: 14px; }
  .price strong em { font-size: 14px; }
  /* 손전화 — 알약 아홉 개를 5 + 4 두 줄로 */
  .phases { gap: 4px; margin-top: 2px; flex-wrap: wrap; }
  .phase { font-size: 14px; padding: 0 2px; height: 26px; flex: 1 1 calc(20% - 4px); }
  .phase .caret { display: none; }
  .phase.has-caret .caret { display: inline; }
  .phase-arrow, .phase-dot { display: none; }
  .bin, .cal, .filter-pop { width: min(330px, calc(100vw - 32px)); }
  .filter-pop { grid-template-columns: 1fr; }
  .filter-pop .col + .col { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); }
  .pop.right { right: auto; left: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* ===== 박스형 탭 (공통 모듈) — 2단 · 3단 탭은 모두 이 꼴 =====
   탭 줄 밑에 진한 선 한 줄, 안 고른 탭은 옅은 상자, 고른 탭은 위로 4px 올라온 흰(바탕색) 상자 — 위 두 모서리만 둥글고 밑선을 덮어 아래 내용과 이어진다.
   2단(하위 탭 줄 · 물건등록 탭)은 밑줄 탭 그대로 두고, 3단(내용 바로 위)만 이 꼴 — 둘 다 박스면 겹쳐 보인다.
   쓰는 곳: 시장분석 지역분석 탭(.adm-view-tabs) · 낙찰이후 장 탭(.pw-chaptabs).
   고른 탭의 바탕은 그 아래 내용의 바탕과 같아야 한다 — 줄마다 --boxtab-on 으로 정한다 */
:root { --boxtab-line: #a9b4c6; --boxtab-off: #d8dee8; --boxtab-off-hover: #ccd4e0; }
:root[data-theme="dark"] { --boxtab-line: rgba(255, 255, 255, .26); --boxtab-off: #1b2333; --boxtab-off-hover: #222c40; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --boxtab-line: rgba(255, 255, 255, .26); --boxtab-off: #1b2333; --boxtab-off-hover: #222c40; } }
.app-market .adm-view-tabs, .pw-chaptabs, .app-page[data-k="finance"] .kind-chips, .app-page[data-k="finance"] .fin-tabs { --boxtab-on: var(--bg); }
.app-page[data-k="finance"] .kind-chips { margin: 4px 16px 10px !important; border-bottom: 1px solid var(--boxtab-line); } /* 세금 틀(.tax-shell)이 좌우 -16 이라 16 을 돌려준다 — 위 상자들과 끝선 맞춤 */
:is(.app-market .adm-view-tabs, .pw-chaptabs, .app-page[data-k="finance"] .kind-chips, .app-page[data-k="finance"] .fin-header .fin-tabs) { display: flex !important; align-items: flex-end !important; gap: 4px !important; padding-left: 0 !important; }
:is(.app-market .adm-view-tabs > button, .pw-chaptabs > button, .app-page[data-k="finance"] .kind-chips > button, .app-page[data-k="finance"] .fin-tabs > .fin-tab) {
  position: relative; align-self: flex-end !important; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  /* 글자 길이와 상관없이 어느 페이지나 같은 폭 — 가장 긴 이름(매각불허가 · 유형분포+아이콘)이 들어가는 폭 */
  flex: 0 0 116px !important; width: 116px !important; min-width: 116px !important; box-sizing: border-box !important;
  height: 34px !important; padding: 0 8px !important; margin: 0 !important;
  border: 1px solid transparent !important; border-bottom: 0 !important; border-radius: 8px 8px 0 0 !important;
  background: var(--boxtab-off) !important; color: var(--muted) !important; font-size: 15px !important; font-weight: 600 !important; white-space: nowrap;
  transition: background .12s, color .12s;
}
:is(.app-market .adm-view-tabs > button, .pw-chaptabs > button, .app-page[data-k="finance"] .kind-chips > button, .app-page[data-k="finance"] .fin-tabs > .fin-tab):hover { background: var(--boxtab-off-hover) !important; color: var(--text) !important; }
:is(.app-market .adm-view-tabs > button, .pw-chaptabs > button, .app-page[data-k="finance"] .kind-chips > button, .app-page[data-k="finance"] .fin-tabs > .fin-tab):is(.on, .active) {
  z-index: 2; height: 38px !important; margin-bottom: 0 !important;
  border-color: var(--boxtab-line) !important; background: var(--boxtab-on) !important; color: var(--blue) !important; font-weight: 800 !important;
}
:is(.app-market .adm-view-tabs > button, .pw-chaptabs > button, .app-page[data-k="finance"] .kind-chips > button, .app-page[data-k="finance"] .fin-tabs > .fin-tab)::after { display: none !important; }
/* 탭 줄 밑선은 진하게 */
.app-market:is([data-k="dong"], [data-k="case"]) .adm-tabs-top::after { background: var(--boxtab-line) !important; z-index: 3; }
/* 낙찰이후 — 탭을 눌러도 내용이 떠오르지 않게(장면 이동이 아니다 · 진행절차처럼 바로 바뀐다) */
.app-page[data-k="postwin"] .pw-body { animation: none !important; }
/* 박스 탭 밑선은 켜진 탭 위로 지나간다 — 낙찰이후 장 탭과 같게(켜진 탭이 선을 덮지 않는다) */
/* 2단 밑줄 탭 — 고른 탭 밑줄을 굵게(3px) */
.subtab::after { height: 3px !important; }
.app-market .adm-tabs-top { overflow: visible; }
/* 낙찰이후 장 탭 — 내용 바로 위, 밑선은 내용 폭만큼 */
.pw-chaptabs { margin: 4px 0 4px; border-bottom: 1px solid var(--boxtab-line); overflow-x: auto; scrollbar-width: none; }
.pw-chaptabs::-webkit-scrollbar { display: none; }
/* 좁은 화면 — 줄바꿈 대신 가로로 밀어 본다 */


/* 공용 확인창(앱 AppConfirm) — 웹 글자 규칙(제목 16 · 나머지 14) */
.app-page .acf-title { font-size: 16px !important; }
.app-page :is(.acf-desc, .acf-skip, .acf-btns button) { font-size: 14px !important; }
.app-page .acf-backdrop { z-index: 960 !important; } .app-page .acf-box { z-index: 961 !important; }

/* 자금관리 › 세금신고 요약 상자 — 바탕(#e7ebf1)에 묻히지 않게: 매도 완료는 흰색, 종합소득세 · 취득세는 맑고 진한 파랑 */
.app-page[data-k="finance"] .tax-card { border: 1px solid transparent; }
/* 요약 다섯 칸 한 줄 — 매도완료 · 취득세 · 총사업소득 · 연간합산종합소득세 · 세후순수익 */

    for (let i = 0; i < start; i += 1) cells += '<span></span>';
    for (let d = 1; d <= days; d += 1) {
      const key = `${y}-${pad(m + 1)}-${pad(d)}`; const n = byDate[key] || 0;
      const wd = (start + d - 1) % 7;
      /* 보기 전용 — 날짜를 눌러 목록을 거르지 않는다(골라 둔 걸 잊으면 카드가 안 보여 헷갈린다). 올리면 'N건' 말풍선만 */
      cells += `<span class="cal-day num ${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''} ${key === TODAY_YMD ? 'today' : ''} ${n ? 'has' : ''}" ${n ? `data-tip="${n}건"` : ''} aria-label="${m + 1}월 ${d}일${n ? ` ${n}건` : ''}">${d}</span>`;
    }
    return `<div class="pop cal" role="dialog" aria-label="입찰일 고르기">
      <div class="cal-head"><button type="button" data-act="cal-move" data-v="-1" aria-label="이전 달">${I.chevL}</button><b class="num">${y}년 ${m + 1}월</b><button type="button" data-act="cal-move" data-v="1" aria-label="다음 달">${I.chevR}</button></div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-foot"><span class="cal-keys"><span class="cal-key"><i></i>입찰일</span><span class="cal-key"><i class="ring"></i>오늘</span></span></div></div>`; /* 고른 날을 푸는 건 그 날을 다시 누르면 된다 */
  }

  function binHtml(kind, list) {
    const name = kind === 'archive' ? '보관함' : '휴지통';
    const picked = list.filter((it) => S.binPicked.has(it.id));
    const all = list.length > 0 && picked.length === list.length;
    return `<div class="pop right bin" role="dialog" aria-label="${name}">
      <div class="bin-head"><div>${name}<span>× ${list.length}건</span></div><button type="button" class="x" data-act="close-pop" aria-label="닫기">${I.x}</button></div>
      ${list.length ? `<div class="bin-acts"><button type="button" data-act="bin-all" data-v="${kind}">${all ? '전체해제' : '전체선택'}</button><button type="button" class="apply" data-act="bin-restore" data-v="${kind}" ${picked.length ? '' : 'disabled'}>${kind === 'archive' ? '꺼내기' : '복원'}${picked.length ? ` (${picked.length})` : ''}</button>${kind === 'trash' ? `<button type="button" class="purge" data-act="bin-purge" ${picked.length ? '' : 'disabled'}>완전삭제</button>` : ''}</div>
      <ul class="bin-list">${list.map((it) => `<li class="bin-item ${S.binPicked.has(it.id) ? 'picked' : ''}" data-act="bin-pick" data-id="${it.id}"><input type="checkbox" class="ck" tabindex="-1" ${S.binPicked.has(it.id) ? 'checked' : ''} aria-label="${esc(it.caseNo)} 고르기"><span><span class="case">${esc(it.caseNo)}<span class="tag ${bidOf(it) === '진행' ? 'hot' : ''}">${esc(stageLabel(it))}</span></span><span class="addr">${esc(addrText(it))}</span></span></li>`).join('')}</ul>`
      : `<div class="bin-empty">${name}이 비어 있습니다.</div>`}
    </div>`;
  }

  /* ---------- 카드 (앱 .wlp-card 짜임 그대로: 날짜·법원·사건번호 / 별·복사·보관·휴지통 / 유형+주소 / 값 세 칸 / 알약 다섯) ---------- */
  function starsHtml(it) {
    return `<span class="stars">${[1, 2, 3].map((n) => `<button type="button" class="star ${it.priority >= n ? 'f' : ''}" data-act="star" data-id="${it.id}" data-n="${n}" aria-label="중요도 ${n}"${n === 2 ? tip(`중요도 ${it.priority || 0}/3`) : ''}>${starSvg}</button>`).join('')}</span>`;
  }
  function phasesHtml(it) {
    const b = bidOf(it);
    const pills = PHASES.map((p) => {
      const on = p.key === 'bid' ? it.status === '입찰' && !b : it.status === p.status;
      return `<button type="button" class="phase ${on ? 'on' : ''}" data-act="phase" data-id="${it.id}" data-v="${p.key}"${tip(on ? '지금단계' : `${p.label} 단계로`)}>${p.label}</button>`;
    });
    /* 입찰진행 ▶ 낙찰 ▶ 유찰 ▶ 취소 ▶ 매도 — 한 칸씩, 누르면 바로 그 단계 */
    AFTER.forEach((a, i) => pills.push(`<button type="button" class="phase ${b === a.bid ? a.tone : ''}" data-act="bid-set" data-id="${it.id}" data-v="${a.bid}"${tip(b === a.bid ? '지금단계' : `${a.label} 단계로`, i > 2 ? 'right' : '')}>${a.label}</button>`));
    /* 사이 표시 — 흐름은 ▶, 낙찰·유찰·취소 사이(6·7번째 앞)는 점 */
    return `<div class="phases">${pills.map((h, i) => (i === 0 ? '' : i === 6 || i === 7 ? '<span class="phase-dot" aria-hidden="true"></span>' : '<span class="phase-arrow" aria-hidden="true">▶</span>') + h).join('')}</div>`;
  }
  /* 수익률 분석 — 앱 수익 분석과 같은 셈(간이): 실투자금 = 입찰가 − 대출 + 비용, 세후 순이익 = 매도가 − 총투자금 − 세금, 세후 수익률 = 순이익 ÷ 실투자금.
     예시 화면이라 대출(입찰가 70%)·비용(입찰가 4.5% + 300만)·예상 매도가는 자리 잡기 값이다. 실제로는 물건상세 수익계산의 값을 그대로 읽는다 */
  const incomeTax = (g) => { if (!(g > 0)) return 0; const br = [[14e6, 0.06, 0], [50e6, 0.15, 1.26e6], [88e6, 0.24, 5.76e6], [150e6, 0.35, 15.44e6], [3e8, 0.38, 19.94e6], [5e8, 0.4, 25.94e6], [1e9, 0.42, 35.94e6], [Infinity, 0.45, 65.94e6]]; const [, r, d] = br.find(([lim]) => g <= lim); return Math.max(0, g * r - d); };
  const profitOf = (it) => {
    if (!(it.mine > 0)) return null;
    const bid = it.mine;
    const loan = it.loan || Math.round((bid * 0.7) / 1e5) * 1e5;
    const cost = it.cost ?? Math.round((bid * 0.045 + 3e6) / 1e4) * 1e4;
    const seed = [...String(it.id)].reduce((n, ch) => n + ch.charCodeAt(0), 0); /* 예시 매도가 자리 — 앱 물건은 매도가가 있으면 그 값 */
    const sale = it.sale || Math.round((bid * (1.12 + (seed % 5) * 0.04)) / 1e6) * 1e6;
    const gain = sale - bid - cost; const tax = incomeTax(gain); const after = gain - tax - tax * 0.1;
    const net = bid - loan + cost;
    return { sale, loan, cost, after: Math.round(after / 1000) * 1000, net, rate: net > 0 ? (after / net) * 100 : 0 };
  };
  function resultHtml(it, past) {
    const r = profitOf(it);
    const m = (cls, label, val, tipText) => `<div class="metric ${cls}"${tip(tipText, 'left')}><small>${label}</small>${val}</div>`;
    const money = (n) => `<strong class="num ${n < 0 ? 'neg' : ''}">${won(Math.abs(n)) ? `${n < 0 ? '−' : ''}${won(Math.abs(n))}` : '0'}<em>원</em></strong>`;
    return `<aside class="res ${past ? 'past' : ''}" data-act="go-profit" data-id="${it.id}" aria-label="${esc(it.caseNo)} 수익률 분석">
      <div class="res-head"><b class="res-title">${I.trend}수익률 분석</b><span>${r ? `매도 예상 ${eok(r.sale)}` : '입찰가 산정 전'}</span></div>
      ${r ? [
        m('rate', '최종 수익률', `<strong class="num ${r.rate < 0 ? 'neg' : ''}">${r.rate.toFixed(1)}<em>%</em></strong>`, '세후 순이익 ÷ 필요준비금'),
        m('', '순수익금', money(r.after), '매도가 − 총투자금 − 세금'),
        m('', '필요준비금', money(r.net), '입찰가 − 대출 + 비용'),
      ].join('') : ['최종 수익률', '순수익금', '필요준비금'].map((l) => `<div class="metric blank"><small>${l}</small><strong class="none">산정 전</strong></div>`).join('')}
    </aside>`;
  }
  /* 카드 하나를 그리다 틀려도 목록 전체가 사라지지 않게 — 그 카드만 짧게 보이고 콘솔에 남긴다 */
  const safeCard = (it) => { try { return cardHtml(it); } catch (err) { console.error('카드 그리기 실패', it && it.id, err); return `<article class="card" data-act="card" data-id="${esc(it.id)}" tabindex="0"><div class="c-top"><b>${esc(it.caseNo || '사건번호 없음')}</b></div><p>${esc(addrText(it))}</p></article>`; } };
  /* 적지 않은 값은 하이픈으로 — 아이콘만 덩그러니 남으면 무슨 칸인지 알 수 없다 */
  const DASH = '-';
  const orDash = (v) => (String(v ?? '').trim() ? v : DASH);
  function cardHtml(it) {
    return `<div class="card-row">${mainCardHtml(it)}${resultHtml(it, isPast(it) && !hasResult(it))}</div>`;
  }
  function mainCardHtml(it) {
    const past = isPast(it) && !hasResult(it);
    const picked = S.picked.has(it.id);
    const over = it.mine > 0 && it.min > 0 ? (it.mine / it.min - 1) * 100 : null;
    return `<article class="card ${past ? 'past' : ''} ${S.pick ? 'pickmode' : ''} ${picked ? 'picked' : ''} ${S.menu && S.menu.id === it.id ? 'menu-open' : ''}" data-act="card" data-id="${it.id}" tabindex="0" aria-label="${esc(it.caseNo)} ${esc(addrText(it))}">
      ${past ? `<span class="ribbon" aria-hidden="true">${I.refresh}</span><span class="ribbon-hit" data-tip="입찰일이 지났습니다 · 갱신필요" data-tip-pos="left"></span>` : ''}
      <div class="c-top">
        ${S.pick ? `<input type="checkbox" class="ck pick-ck" data-act="pick-one" data-id="${it.id}" ${picked ? 'checked' : ''} aria-label="${esc(it.caseNo)} 고르기">` : ''}
        <div class="c-meta"><span class="c-case num">${I.hash}${hl(it.caseNo)}</span><span class="c-court" title="${esc(it.court || DASH)}">${I.court}<span class="full">${orDash(hl(it.court))}</span><span class="short">${orDash(hl(shortCourt(it.court)))}</span></span><span class="c-date num"${tip(it.date ? `매각기일 ${ddayText(it.date)}${past ? ' · 지났습니다' : ''}` : '매각기일을 적지 않았습니다', 'left')}>${I.cal}${it.date ? `${it.date}${dowText(it.date)}` : DASH}</span></div>
        <div class="c-acts">
          ${starsHtml(it)}
          <button type="button" class="ibtn" data-act="copy" data-id="${it.id}" aria-label="주소복사"${tip('주소복사')}>${I.copy}</button>
          <button type="button" class="ibtn" data-act="archive" data-id="${it.id}" aria-label="보관함에 넣기"${tip('보관함에 넣기')}>${I.box}</button>
          <button type="button" class="ibtn del" data-act="delete" data-id="${it.id}" aria-label="휴지통으로 보내기"${tip('휴지통으로 보내기', 'right')}>${I.trash}</button>
        </div>
      </div>
      <div class="addr-row"${tip([addrText(it).length > 30 ? addrText(it) : '', it.status === '임장완료' ? '임장 다녀옴' : ''].filter(Boolean).join(' · '), 'left')}><h3 class="c-addr"><span class="type-mark">${esc(TYPE_NAME(it.type))}</span><span class="a-text ${it.status === '임장완료' ? 'done' : ''}">${addrHtml(it)}</span>${areaHtml(it)}</h3></div>
      <div class="prices">
        <div class="price"${tip(eok(it.apr))}><small>감정가</small><strong class="num">${won(it.apr) || DASH}${it.apr ? '<em>원</em>' : ''}</strong></div>
        <div class="price"${tip(it.min && it.apr ? `${eok(it.min)} · 감정가의 ${pct(it.min, it.apr)}%` : '')}><small>최저가${it.round ? ` (${esc(it.round)})` : ''}</small><strong class="num">${won(it.min) || DASH}${it.min ? '<em>원</em>' : ''}</strong></div>
        <div class="price mine"${tip(it.mine ? `${eok(it.mine)} · 최저가 +${over.toFixed(1)}%` : '')}><small>입찰가</small>${it.mine ? `<strong class="num">${won(it.mine)}<em>원</em></strong>` : '<strong class="none">산정 전</strong>'}</div>
      </div>
      ${phasesHtml(it)}
    </article>`;
  }
  function rowHtml(it) {
    const past = isPast(it) && !hasResult(it);
    const tone = bidTone(bidOf(it)) || 'on';
    return `<tr class="${past ? 'past' : ''} ${S.picked.has(it.id) ? 'picked' : ''}" data-act="card" data-id="${it.id}" tabindex="0">
      ${S.pick ? `<td><input type="checkbox" class="ck" data-act="pick-one" data-id="${it.id}" ${S.picked.has(it.id) ? 'checked' : ''} aria-label="${esc(it.caseNo)} 고르기"></td>` : ''}
      <td>${starsHtml(it)}</td>
      <td class="t-date num">${orDash(it.date)}</td>
      <td class="t-case"><b class="num">${orDash(hl(it.caseNo))}</b><span>${orDash(hl(it.court))}</span></td>
      <td class="t-addr" data-tip="${esc([it.addr, it.bld, it.unit].filter(Boolean).join(' '))}" data-tip-trunc><span class="type-mark">${esc(TYPE_NAME(it.type))}</span>${addrHtml(it)}</td>
      <td class="t-price r num"${tip(eok(it.apr))}>${won(it.apr) || DASH}</td>
      <td class="t-price r num"${tip(eok(it.min))}>${won(it.min) || DASH}<small>${esc(it.round)}${it.min && it.apr ? ` · ${pct(it.min, it.apr)}%` : ''}</small></td>
      <td class="t-price r num mine">${it.mine ? won(it.mine) : `<span style="color:var(--faint)">${DASH}</span>`}</td>
      <td><button type="button" class="phase ${tone}" data-act="stage-menu" data-id="${it.id}" aria-haspopup="menu">${esc(stageLabel(it))}<i class="caret">▾</i></button></td>
      <td><div class="row-acts">
        <button type="button" class="ibtn" data-act="copy" data-id="${it.id}" aria-label="주소복사"${tip('주소복사')}>${I.copy}</button>
        <button type="button" class="ibtn" data-act="archive" data-id="${it.id}" aria-label="보관함에 넣기"${tip('보관함에 넣기')}>${I.box}</button>
        <button type="button" class="ibtn del" data-act="delete" data-id="${it.id}" aria-label="휴지통으로 보내기"${tip('휴지통으로 보내기', 'right')}>${I.trash}</button>
      </div></td>
    </tr>`;
  }

  function renderContent() {
    const list = visible();
    const root = $('content');
    const note = CLOUD.on ? '' : S.denied
      ? '<div class="demo-note">이 계정은 마이턴옥션 사용 허가가 없습니다 — 허가된 계정으로 로그인해 주세요.</div>'
      : '<div class="demo-note">예시 물건입니다 — 로그인하면 앱과 같은 내 선정물건이 보입니다. <button type="button" class="mini edit" data-act="login-btn">로그인</button></div>';
    /* 설명 상자 — 물건등록 안내처럼 무엇을 하는 화면인지 한 줄로 (제목 옆에 바로 설명) */
    const guide = `<div class="list-guide"><span class="lg-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.6"/></svg>선정물건</span><span class="lg-text">카드를 선택하여 물건상세로 들어가세요.</span></div>`;
    queueMicrotask(() => {
      const r = $('content'); if (!r) return;
      if (note && !r.querySelector('.demo-note')) r.insertAdjacentHTML('afterbegin', note);
      if (!r.querySelector('.list-guide')) r.insertAdjacentHTML('afterbegin', guide);
    });
    if (!list.length) {
      const filtered = S.type || S.court || S.date || S.q || S.stage !== 'all';
      /* 달력에서 물건 없는 날을 고른 것 — 지울 조건을 권할 일이 아니라 그날 목록이 비었다는 한 줄이면 된다 */
      if (S.date) { root.innerHTML = '<div class="empty"><b>목록이 없습니다</b></div>'; return; }
      root.innerHTML = `<div class="empty"><b>${filtered ? '조건에 맞는 물건이 없습니다' : '표시할 물건이 없습니다'}</b><span>${filtered ? (['won', 'fail', 'cancel', 'sold'].includes(S.stage) ? '카드의 낙찰·유찰·취소·매도 알약을 누르면 여기에 모입니다.' : '걸어 둔 조건을 바꾸거나 지워 보세요.') : '선정물건등록으로 첫 물건을 넣어 보세요.'}</span><button type="button" data-act="${filtered ? 'reset-all' : 'register'}">${filtered ? '조건 모두 지우기' : '선정물건등록'}</button></div>`;
      return;
    }
    if (S.layout === 'list') {
      root.innerHTML = `<div class="table-wrap"><table class="list"><thead><tr>${S.pick ? '<th style="width:40px"></th>' : ''}<th style="width:80px">중요도</th><th>입찰일</th><th>사건번호 · 법원</th><th>주소</th><th class="r">감정가</th><th class="r">최저가</th><th class="r">입찰가</th><th>단계</th><th style="width:110px"></th></tr></thead><tbody>${list.map(rowHtml).join('')}</tbody></table></div>`;
      return;
    }
    if (['won', 'fail', 'cancel', 'sold'].includes(S.stage)) { root.innerHTML = `<div class="grid">${list.map(safeCard).join('')}</div>`; fitCourtsSoon(); return; }
    const upcoming = list.filter((it) => !isPast(it));
    const pastList = list.filter((it) => isPast(it));
    fitCourtsSoon();
    root.innerHTML = `<div class="grid">${upcoming.map(safeCard).join('')}${pastList.length ? `<div class="divider"><b>지난 입찰일</b><span class="num">${pastList.length}건 · 새 기일로 갱신하거나 결과를 적어 두세요</span><i></i></div>${pastList.map(safeCard).join('')}` : ''}</div>`;
  }

  /* 법원 칸 — 전체 이름이 들어가면 그대로, 넘치면 줄인 이름 */
  function fitCourts() {
    document.querySelectorAll('.c-court').forEach((el) => {
      el.classList.remove('use-short');
      const full = el.querySelector('.full');
      if (full && getComputedStyle(full).display !== 'none' && el.scrollWidth > el.clientWidth + 1) el.classList.add('use-short');
    });
  }
  const fitCourtsSoon = () => requestAnimationFrame(fitCourts);

  function renderFloat() {
    const root = $('floatRoot');
    const it = S.menu ? items.find((x) => x.id === S.menu.id) : null;
    if (!it) { root.innerHTML = ''; return; }
    const b = bidOf(it);
    let html;
    if (S.menu.kind === 'bid') {
      html = [['낙찰', '낙찰', 'on'], ['유찰', '유찰', ''], ['취소', '취소', '']]
        .map((o) => `<button type="button" class="opt ${b === o[0] ? 'on' : ''}" data-act="pick-bid" data-id="${it.id}" data-v="${o[0]}"><span class="sw ${o[2]}"></span>${o[1]}${b === o[0] ? I.check : ''}</button>`).join('');
    } else {
      const sk = stageKey(it); const cur = b && b !== '진행' ? `r-${b}` : sk;
      html = `<div class="pop-title">단계 바꾸기</div>${[...PHASES.map((p) => [p.key, p.label, 'on']), ['running', '입찰진행', 'hot'], 'sep', ['r-낙찰', '낙찰', 'on'], ['r-유찰', '유찰', ''], ['r-취소', '취소', ''], ['r-매도', '매도', 'on']]
        .map((o) => (o === 'sep' ? '<div class="opt-sep"></div>' : `<button type="button" class="opt ${cur === o[0] ? 'on' : ''}" data-act="pick-stage" data-id="${it.id}" data-v="${o[0]}"><span class="sw ${o[2]}"></span>${o[1]}${cur === o[0] ? I.check : ''}</button>`)).join('')}`;
    }
    const w = 172;
    const left = Math.max(8, Math.min(S.menu.x - w, window.innerWidth - w - 8));
    root.innerHTML = `<div class="float-menu" role="menu" style="left:${left}px;top:${S.menu.y + 4}px">${html}</div>`;
    const el = root.firstElementChild;
