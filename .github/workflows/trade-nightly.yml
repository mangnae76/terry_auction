# 실거래 적재 — 매일 한국 시각 01:17 에 국토부 실거래를 받아 Firestore(cacheTradeMonth)에 적어 둔다.
# 화면은 그 문서를 먼저 읽으므로 국토부를 덜 부르고 빨리 뜬다. 내용은 jobs/trade-nightly/run.mjs.
# 비밀값(저장소 Settings › Secrets and variables › Actions): FIREBASE_SERVICE_ACCOUNT · DATA_GO_KR_KEY
name: 새벽 실거래 적재

on:
  # 2026-11-10 사용자 요청으로 잠시 멈춤 — 다시 하라고 하면 아래 두 줄의 # 를 지운다(손으로 돌리기는 그대로 된다)
  # schedule:
  #   - cron: '17 16 * * *'  # UTC 16:17 = 한국 01:17. 정시(:00 · :30)는 GitHub 예약이 몰려 늦거나 빠지기 쉬워 비켜 잡았다
  workflow_dispatch:         # Actions 탭에서 손으로도 돌린다
    inputs:
      extra_targets:
        description: "더할 지역 (예: 28275:villa,11680:apt)"
        required: false
        default: ''
      backfill_budget:
        description: '지난 달 채우기 최대 호출 수'
        required: false
        default: '1500'
      history_months:
        description: '받을 달 수 (이번 달 포함, 1년치 = 13, 기본 49 = 4년치)'
        required: false
        default: '49'
      only_extra:
        description: '더할 지역만 받기 (DB 에 있는 다른 지역은 건드리지 않음)'
        type: boolean
        required: false
        default: false
      count_only:
        description: '국토부는 부르지 않고 대문 숫자만 다시 세기'
        type: boolean
        required: false
        default: false

concurrency:
  group: trade-nightly
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: jobs/trade-nightly
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/trade-nightly/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node run.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          EXTRA_TARGETS: ${{ inputs.extra_targets || vars.TRADE_EXTRA_TARGETS || '' }}
          BACKFILL_BUDGET: ${{ inputs.backfill_budget || '1500' }}
          COUNT_ONLY: ${{ inputs.count_only && '1' || '' }}
          HISTORY_MONTHS: ${{ inputs.history_months || '49' }}
          ONLY_EXTRA: ${{ inputs.only_extra && '1' || '' }}
