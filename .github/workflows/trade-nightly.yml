# 새벽 실거래 적재 — 매일 한국 시각 01:00 에 국토부 실거래를 받아 Firestore(cacheTradeMonth)에 적어 둔다.
# 화면은 그 문서를 먼저 읽으므로 국토부를 덜 부르고 빨리 뜬다. 내용은 jobs/trade-nightly/run.mjs.
# 비밀값(저장소 Settings › Secrets and variables › Actions): FIREBASE_SERVICE_ACCOUNT · DATA_GO_KR_KEY
name: 새벽 실거래 적재

on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = 한국 01:00 (GitHub 가 바쁘면 조금 늦게 시작한다)
  workflow_dispatch:         # Actions 탭에서 손으로도 돌린다
    inputs:
      extra_targets:
        description: "더할 지역 (예: 28275:villa,11680:apt)"
        required: false
        default: ''
      backfill_budget:
        description: '지난 달 채우기 최대 호출 수'
        required: false
        default: '1500'

concurrency:
  group: trade-nightly
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: jobs/trade-nightly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/trade-nightly/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node run.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          EXTRA_TARGETS: ${{ inputs.extra_targets || vars.TRADE_EXTRA_TARGETS || '' }}
          BACKFILL_BUDGET: ${{ inputs.backfill_budget || '1500' }}
